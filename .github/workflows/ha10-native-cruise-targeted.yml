name: JANUS HA10 Native Cruise Targeted Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/demiurge_native_cruise_gate.py'
      - 'tools/demiurge_bodc_linked_gate.py'
      - 'tools/demiurge_bodc_inventory_fallback.py'
      - 'tools/demiurge_bodc_inventory_series_gate.py'
      - '.github/workflows/ha10-native-cruise-targeted.yml'
  workflow_dispatch:

concurrency:
  group: janus-ha10-native-targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Run deterministic self-tests
        run: |
          python tools/demiurge_bodc_inventory_fallback.py --self-test
          python tools/demiurge_bodc_inventory_series_gate.py --self-test
          python tools/demiurge_native_cruise_gate.py --self-test
          python tools/demiurge_bodc_linked_gate.py --self-test

  probe:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        scout_id:
          - SCOUT_DEMIHEAD_08
          - SCOUT_FUNDAMENTUM_09
          - SCOUT_CAT_10
          - SCOUT_SCOBY_11
          - SCOUT_AIFC_16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Build minimal evidence carrier
        shell: bash
        run: |
          mkdir -p runtime/${{ matrix.scout_id }}
          printf '{"schema":"janus.demiurge.native_probe.input.v1","scout_id":"%s","analysis":{"findings":[]},"discovery":{"sources":[]}}\n' '${{ matrix.scout_id }}' > runtime/${{ matrix.scout_id }}/report.json
      - name: Prefetch BODC cruise inventory fallback
        run: python tools/demiurge_bodc_inventory_fallback.py --report runtime/${{ matrix.scout_id }}/report.json
      - name: Extract BODC inventory series and track-chart pointers
        run: python tools/demiurge_bodc_inventory_series_gate.py --report runtime/${{ matrix.scout_id }}/report.json
      - name: Probe native BODC/BAS cruise sources
        run: python tools/demiurge_native_cruise_gate.py --report runtime/${{ matrix.scout_id }}/report.json
      - name: Probe BODC NODB Linked Open Data fallback
        run: python tools/demiurge_bodc_linked_gate.py --report runtime/${{ matrix.scout_id }}/report.json
      - name: Upload deterministic probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cruise-${{ matrix.scout_id }}
          path: runtime/${{ matrix.scout_id }}/report.json
          retention-days: 30
