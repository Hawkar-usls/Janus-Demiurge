name: ESSENCE v4.8 persistent peer-weight evolution (shadow only)

on:
  pull_request:
    paths:
      - 'tools/essence_v48_recurrent_state.py'
      - 'tools/essence_v48_recurrent_neural.py'
      - 'tests/test_essence_v48_recurrent.py'
      - 'research/essence/peer_v48/CYCLE_LOCK.json'
      - '.github/workflows/essence-v48-recurrent-peer.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v48_recurrent_state.py'
      - 'tools/essence_v48_recurrent_neural.py'
      - 'tests/test_essence_v48_recurrent.py'
      - 'research/essence/peer_v48/CYCLE_LOCK.json'
      - '.github/workflows/essence-v48-recurrent-peer.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-essence-v48-single-writer
  cancel-in-progress: false

env:
  LOCK: research/essence/peer_v48/CYCLE_LOCK.json
  ROOT: runtime/essence/v48
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test deterministic source intake and protected authority
        run: |
          python -m compileall -q tools/essence_v48_recurrent_state.py tools/essence_v48_recurrent_neural.py tests/test_essence_v48_recurrent.py
          python -m json.tool research/essence/peer_v48/CYCLE_LOCK.json >/dev/null
          python -m unittest -v tests.test_essence_v48_recurrent

  select-fresh-source:
    if: github.event_name != 'pull_request' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.select.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: essence-peer-shadow-state
          path: runtime/essence/v48/state
          persist-credentials: false
      - name: Read allowlisted source files from 3 public JANUS repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/sources"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/-Terminal-for-Janus.git "$ROOT/sources/terminal"
          git -C "$ROOT/sources/terminal" sparse-checkout set --no-cone config/JANUS_MODEL_PEERS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/Hrain.git "$ROOT/sources/hrain"
          git -C "$ROOT/sources/hrain" sparse-checkout set --no-cone PROJECT_STATUS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/Janus_Genesis.git "$ROOT/sources/genesis"
          git -C "$ROOT/sources/genesis" sparse-checkout set --no-cone PROJECT_STATUS.json
      - id: select
        name: Plan at most one unseen verified source digest
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.essence_v48_recurrent_state plan \
            --lock "$LOCK" --state "$ROOT/state" \
            --sources "$ROOT/sources" --out "$ROOT/plan.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          plan=json.loads(Path("runtime/essence/v48/plan.json").read_text())
          print("ready="+str(plan["action"]=="TRAIN_SHADOW_CANDIDATE").lower())
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/essence/v48/plan.json").read_text())
          print("### ESSENCE v4.8 fresh-source decision")
          print("Action:",d["action"])
          print("Source:",d.get("source_repo","none"))
          print("Parent generation:",d.get("parent_generation","unchanged"))
          print("EXPERIMENTAL SHADOW. Sentinel & native model updates prohibited.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v48-source-plan-${{ github.run_id }}
          path: runtime/essence/v48/plan.json
          retention-days: 90
          if-no-files-found: error

  ask-peer-and-train:
    if: needs.select-fresh-source.outputs.ready == 'true'
    needs: select-fresh-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v48/state
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v48-source-plan-${{ github.run_id }}
          path: runtime/essence/v48
      - name: Download original verified G2 checkpoint once, as emergency seed
        uses: actions/download-artifact@v4
        with:
          name: essence-v47-repo-child-research-43746247031
          run-id: 43746247031
          github-token: ${{ github.token }}
          path: runtime/essence/v48/seed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify and verify most recent inherited shadow parent
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          from tools import essence_v48_recurrent_state as s
          root=Path("runtime/essence/v48")
          d=json.loads((root/"plan.json").read_text())
          actual=root/"state"/d["parent_model_path"]
          if not actual.is_dir():
              if d["parent_generation"]!=2:
                  raise RuntimeError("NO_PERSISTENT_PARENT_AFTER_BOOTSTRAP")
              actual=root/"seed"/"child"
          s.check_model(actual,d["parent_adapter_sha256"],d["parent_lineage_sha256"])
          print("JANUS_SHADOW_PARENT="+str(actual))
          PY
      - name: Install bounded free open-weight CPU training runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Model selects question; Qwen ↔ SmolLM source-backed discussion and no-peer ablation
        run: |
          python -m tools.essence_v48_recurrent_neural peer \
            --lock "$LOCK" --plan "$ROOT/plan.json" \
            --parent "$JANUS_SHADOW_PARENT" \
            --out "$ROOT/dialogue.json"
      - name: Continue parent LoRA for exactly 20 steps on verified source facts and memory
        run: |
          python -m tools.essence_v48_recurrent_neural train \
            --lock "$LOCK" --plan "$ROOT/plan.json" \
            --parent "$JANUS_SHADOW_PARENT" \
            --dialogue "$ROOT/dialogue.json" \
            --child "$ROOT/candidate" --out "$ROOT/train.json"
          test -s "$ROOT/candidate/adapter_model.safetensors"
          test -s "$ROOT/candidate/lineage.json"
      - name: Seal real child tensors before loading novel holdout repository
        uses: actions/upload-artifact@v4
        with:
          name: essence-v48-candidate-${{ github.run_id }}
          path: |
            runtime/essence/v48/candidate/
            runtime/essence/v48/dialogue.json
            runtime/essence/v48/train.json
          retention-days: 90
          if-no-files-found: error

  compare-parent-child:
    needs: [select-fresh-source, ask-peer-and-train]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v48/state
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v48-source-plan-${{ github.run_id }}
          path: runtime/essence/v48
      - uses: actions/download-artifact@v4
        with:
          name: essence-v48-candidate-${{ github.run_id }}
          path: runtime/essence/v48
      - uses: actions/download-artifact@v4
        with:
          name: essence-v47-repo-child-research-43746247031
          run-id: 43746247031
          github-token: ${{ github.token }}
          path: runtime/essence/v48/seed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve cross-repository heldout values ONLY in this post-training job
        shell: bash
        run: |
          set -euo pipefail
          case "$(python -c 'import json; print(json.load(open("runtime/essence/v48/plan.json"))["holdout_id"])')" in
            terminal) repo='-Terminal-for-Janus'; file='config/JANUS_MODEL_PEERS.json' ;;
            hrain) repo='Hrain'; file='PROJECT_STATUS.json' ;;
            genesis) repo='Janus_Genesis'; file='PROJECT_STATUS.json' ;;
            *) echo 'UNTRUSTED_HOLDOUT_REPOSITORY'; exit 1 ;;
          esac
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/Hawkar-usls/$repo.git" "$ROOT/holdout"
          git -C "$ROOT/holdout" sparse-checkout set --no-cone "$file"
          python - <<'PY'
          import json,subprocess
          x=json.load(open('runtime/essence/v48/plan.json'))
          got=subprocess.check_output(['git','-C','runtime/essence/v48/holdout','rev-parse','HEAD'],text=True).strip()
          assert got==x['holdout_commit'], 'HOLDOUT_COMMIT_DRIFT'
          print('Heldout commit matches the pre-training plan (not independently secret).')
          PY
      - name: Resolve parent checkpoint without changing it
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          from tools import essence_v48_recurrent_state as s
          d=json.load(open('runtime/essence/v48/plan.json'))
          parent=Path('runtime/essence/v48/state')/d['parent_model_path']
          if not parent.is_dir():
              if d['parent_generation']!=2: raise RuntimeError('NO_PARENT')
              parent=Path('runtime/essence/v48/seed/child')
          s.check_model(parent,d['parent_adapter_sha256'],d['parent_lineage_sha256'])
          print('JANUS_SHADOW_PARENT='+str(parent))
          PY
      - name: Install pinned CPU evaluator
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: One-shot paired functional gain, fresh repo facts and all-family retention
        run: |
          python -m tools.essence_v48_recurrent_neural exam \
            --lock "$LOCK" --plan "$ROOT/plan.json" \
            --parent "$JANUS_SHADOW_PARENT" --child "$ROOT/candidate" \
            --holdout "$ROOT/holdout" --out "$ROOT/exam.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('runtime/essence/v48/exam.json'))
          print('### ESSENCE v4.8 paired candidate exam')
          print('Decision:',d['status'])
          for key in ('source_paraphrase','other_repository_unseen','previous_skills_and_memory'):
              print(key+':',d[key])
          print('No independent external examiner, production or Sentinel authority.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v48-recurrent-exam-${{ github.run_id }}
          path: runtime/essence/v48/exam.json
          retention-days: 90
          if-no-files-found: error

  preserve-evolution-state:
    needs: [select-fresh-source, ask-peer-and-train, compare-parent-child]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v48/state
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: essence-v48-source-plan-${{ github.run_id }}
          path: runtime/essence/v48
      - uses: actions/download-artifact@v4
        with:
          name: essence-v48-candidate-${{ github.run_id }}
          path: runtime/essence/v48
      - uses: actions/download-artifact@v4
        with:
          name: essence-v48-recurrent-exam-${{ github.run_id }}
          path: runtime/essence/v48
      - uses: actions/download-artifact@v4
        with:
          name: essence-v47-repo-child-research-43746247031
          run-id: 43746247031
          github-token: ${{ github.token }}
          path: runtime/essence/v48/seed
      - name: Verify receipt lineage, preserve G2 and accept or reject candidate in isolated branch
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.essence_v48_recurrent_state publish \
            --lock "$LOCK" --state "$ROOT/state" \
            --plan "$ROOT/plan.json" --exam "$ROOT/exam.json" \
            --child "$ROOT/candidate" --seed "$ROOT/seed/child"
          git -C "$ROOT/state" config user.name "JANUS ESSENCE Shadow Witness"
          git -C "$ROOT/state" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$ROOT/state" add research/essence/peer_v48_state models/
          if git -C "$ROOT/state" diff --cached --quiet; then
            echo "NO_NEW_STATE"
          else
            git -C "$ROOT/state" commit -m "ESSENCE shadow: append verified peer learning attempt and ancestry"
            git -C "$ROOT/state" push origin HEAD:refs/heads/essence-peer-shadow-state
          fi
      - name: Publish independent status boundary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("runtime/essence/v48/state/research/essence/peer_v48_state/ledger.json")
          x=json.loads(p.read_text())
          print('### ESSENCE recurring shadow state')
          print('Accepted research generation:',x['current_generation'])
          print('Recorded attempts:',len(x['attempts']))
          print('Verified source-memory entries:',len(x['memory']))
          print('Native JANUS / Terminal Qwen / Sentinel A/B/C unchanged.')
          print('External validation and production deployment remain HOLD.')
          PY
