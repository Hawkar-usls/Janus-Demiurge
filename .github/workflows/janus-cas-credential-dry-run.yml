name: JANUS R3.5 CAS credential dry-run witness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/janus-cas-credential-dry-run.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-cas-credential-dry-run
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Hawkar-usls/Janus-Demiurge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing state credential without writing any remote ref
        env:
          STATE_CREDENTIAL: ${{ secrets.JANUS_MESH_STATE_TOKEN }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess,tempfile
          from pathlib import Path
          from datetime import datetime,timezone
          token=os.environ.get('STATE_CREDENTIAL','')
          repo='https://github.com/Hawkar-usls/janus-meta-registry.git'
          branch='sentinel-mesh-state'
          receipt={'schema':'janus.eye.r35.cas_credential_probe.v1','run_id':os.environ['GITHUB_RUN_ID'],'observed_utc':datetime.now(timezone.utc).isoformat(),'token_present':bool(token),'clone':'NOT_RUN','push_dry_run':'NOT_RUN','remote_ref_write_attempted':False,'dispatch_attempted':False}
          def classify(p):
              if p.returncode==0:return 'PASS'
              data=(p.stdout[-65536:]+b'\n'+p.stderr[-65536:]).lower()
              for code,patterns in [
                  ('BRANCH_POLICY',(b'gh013',b'gh006',b'protected branch',b'repository rule violations')),
                  ('PERMISSION_DENIED',(b'write access to repository not granted',b'permission to ',b'403',b'resource not accessible')),
                  ('AUTHENTICATION_FAILED',(b'authentication failed',b'invalid username or token',b'401',b'could not read username')),
                  ('REF_CONFLICT',(b'non-fast-forward',b'fetch first',b'cannot lock ref',b'stale info')),
                  ('NETWORK_FAILURE',(b'could not resolve host',b'connection timed out',b'connection reset',b'502',b'503'))]:
                  if any(x in data for x in patterns):return code
              return 'UNCLASSIFIED_FAILURE'
          if token:
              env=os.environ.copy()
              pair=':'.join(('x-access-token',token))
              header=base64.b64encode(pair.encode()).decode()
              env.update(GIT_CONFIG_COUNT='2',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+header,GIT_CONFIG_KEY_1='core.hooksPath',GIT_CONFIG_VALUE_1='/dev/null',GIT_TERMINAL_PROMPT='0',GIT_TRACE='0',GIT_CURL_VERBOSE='0',GIT_TRACE_CURL='0')
              def git(*args):
                  return subprocess.run(['git',*args],env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=45)
              try:
                  with tempfile.TemporaryDirectory(prefix='janus-dry-run-') as d:
                      root=Path(d)/'state'
                      p=git('clone','--quiet','--depth','1','--single-branch','--branch',branch,repo,str(root))
                      receipt['clone']=classify(p)
                      if p.returncode==0:
                          def local(*args):return git('-C',str(root),*args)
                          p=local('rev-parse','HEAD')
                          if p.returncode!=0:raise RuntimeError('HEAD_UNAVAILABLE')
                          receipt['observed_head']=p.stdout.decode().strip()
                          p=local('-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','--allow-empty','-m','local diagnostic only; never push')
                          receipt['local_commit']=classify(p)
                          if p.returncode==0:
                              p=local('push','--dry-run','--porcelain','origin','HEAD:refs/heads/'+branch)
                              receipt['push_dry_run']=classify(p)
                              receipt['dry_run_is_not_real_write_proof']=True
                          else:receipt['push_dry_run']='HOLD_LOCAL_COMMIT'
              except subprocess.TimeoutExpired:receipt['push_dry_run']='HOLD_TIMEOUT'
              except Exception as e:receipt['push_dry_run']='HOLD_'+type(e).__name__
          else:receipt['push_dry_run']='HOLD_MISSING_STATE_CREDENTIAL'
          Path('cas-dry-run.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-cas-credential-dry-run
          path: cas-dry-run.json
          retention-days: 14
