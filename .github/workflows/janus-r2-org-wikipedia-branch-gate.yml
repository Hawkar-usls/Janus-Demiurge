name: JANUS R2 Org Wikipedia Branch Gate

on:
  push:
    branches:
      - 'feature/attribution-r2-org-wikipedia-2026-09-02'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and unit contracts
        run: |
          python -m py_compile \
            janus_model/extensions/org_surface.py \
            janus_model/extensions/wikipedia_trunk.py \
            janus_model/extensions/research_spine.py \
            janus_model/extensions/research_spine_v2.py \
            janus_model/attribution_r2.py
          python -m unittest -v \
            tests/test_janus_org_surface.py \
            tests/test_janus_wikipedia_trunk.py \
            tests/test_janus_research_spine.py \
            tests/test_janus_attribution_r2.py
      - name: Live bind every public Hawkar-usls repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m janus_model.extensions.org_surface \
            --out runtime/JANUS_ORG_SURFACE.json \
            --private-unmounted-count 3 \
            --baseline-inventory-total 50 \
            --workers 8 \
            --timeout 12
      - name: Live Wikipedia revision-bound retrieval
        run: |
          python -m janus_model.extensions.wikipedia_trunk \
            --decision janus_model/state/JANUS_LATEST_DECISION.json \
            --research janus_model/state/JANUS_RESEARCH_SPINE.json \
            --out runtime/JANUS_WIKIPEDIA_TRUNK.json \
            --max-topics 6 \
            --max-pages-per-topic 2 \
            --timeout 10
      - name: Clone required research organs
        run: |
          mkdir -p runtime/research
          git clone --depth 1 https://github.com/Hawkar-usls/TOPA.git runtime/research/TOPA
          git clone --depth 1 https://github.com/Hawkar-usls/Demi_Head.git runtime/research/Demi_Head
          git clone --depth 1 https://github.com/Hawkar-usls/Janus-Fundamentum.git runtime/research/Janus-Fundamentum
      - name: Build integrated read-only research context
        run: |
          python -m janus_model.extensions.research_spine_v2 \
            --topa-root runtime/research/TOPA \
            --demi-head-root runtime/research/Demi_Head \
            --fundamentum-root runtime/research/Janus-Fundamentum \
            --org-surface runtime/JANUS_ORG_SURFACE.json \
            --wikipedia runtime/JANUS_WIKIPEDIA_TRUNK.json \
            --out runtime/JANUS_RESEARCH_SPINE.json \
            --no-arxiv
          python - <<'PY'
          import json
          org=json.load(open('runtime/JANUS_ORG_SURFACE.json'))
          wiki=json.load(open('runtime/JANUS_WIKIPEDIA_TRUNK.json'))
          spine=json.load(open('runtime/JANUS_RESEARCH_SPINE.json'))
          assert org['public_discovered_count']==47, org['public_discovered_count']
          assert org['public_bound_count']==47, org['public_bound_count']
          assert org['baseline_inventory']['represented_minimum_now']==50
          assert wiki['status'] in {'READY','READY_DEGRADED'}
          assert wiki['page_count'] > 0
          assert spine['research_spine']['topa']['router_self_test']['status']=='PASS'
          assert spine['claim_ceiling']['wikipedia_presence_is_truth'] is False
          assert spine['claim_ceiling']['org_surface_grants_authority'] is False
          print('JANUS_R2_ORG_WIKIPEDIA_LIVE_GATE=PASS')
          print(f"PUBLIC={org['public_bound_count']};REPRESENTED={org['baseline_inventory']['represented_minimum_now']};WIKI_PAGES={wiki['page_count']}")
          PY
      - name: Upload live proof
        uses: actions/upload-artifact@v4
        with:
          name: janus-r2-org-wikipedia-${{ github.run_id }}
          path: |
            runtime/JANUS_ORG_SURFACE.json
            runtime/JANUS_WIKIPEDIA_TRUNK.json
            runtime/JANUS_RESEARCH_SPINE.json
          retention-days: 30
