name: ESSENCE v4.1 Physarum frozen G4 external-source paired exam

on:
  pull_request:
    paths:
      - 'tools/essence_v41_physarum_external_exam.py'
      - 'tests/test_essence_v41_physarum_external_exam.py'
      - 'research/essence/physarum_v41/locked_external_sources.json'
      - '.github/workflows/essence-v41-physarum-external-exam.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v41_physarum_external_exam.py'
      - 'tests/test_essence_v41_physarum_external_exam.py'
      - 'research/essence/physarum_v41/locked_external_sources.json'
      - '.github/workflows/essence-v41-physarum-external-exam.yml'

permissions:
  contents: read

concurrency:
  group: essence-v41-physarum-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch
        run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify frozen source lock and mocked external exam, no real holdout files
        run: |
          python -m py_compile tools/essence_v41_physarum_external_exam.py
          python -m unittest -v \
            tests.test_essence_v41_physarum_external_exam \
            tests.test_essence_v40_physarum_bridge

  verify-freeze:
    needs: synthetic-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify external-source Git object IDs and model weights hashes without fetching content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.essence_v38_inheritance import sealed,immutable_json,sha
          from tools.essence_v41_physarum_external_exam import load_lock
          lock=load_lock('research/essence/physarum_v41/locked_external_sources.json')
          report=sealed({
              'schema':'janus.essence.physarum_external_freeze/4.1',
              'lock_sha256':sha(lock),
              'g4_source_run':lock['g4_source_run'],
              'expected_weights_sha256':lock['weights_sha256'],
              'external_content_read':False,
              'first_run_attempt':True,
              'production_authority':False})
          immutable_json('runtime/essence/v41/pre-exam-freeze.json',report)
          print(json.dumps({'external_content_read':False,
                            'lock_sha256':report['lock_sha256']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v41-freeze-${{ github.run_id }}
          path: runtime/essence/v41/pre-exam-freeze.json
          if-no-files-found: error
          retention-days: 90

  new-external-exam:
    needs: verify-freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v40-physarum-research-43650540561
          run-id: 43650540561
          github-token: ${{ github.token }}
          path: runtime/essence/v41/g4
      - uses: actions/download-artifact@v4
        with:
          name: essence-v38-freeze-43648008998
          run-id: 43648008998
          github-token: ${{ github.token }}
          path: runtime/essence/v41
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch
        run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Open NEW HTTPX and attrs sources only after G4 sibling SHA checks
        run: |
          python -m tools.essence_v41_physarum_external_exam \
            --lock research/essence/physarum_v41/locked_external_sources.json \
            --freeze runtime/essence/v41/freeze.json \
            --control-dir runtime/essence/v41/g4/control \
            --physarum-dir runtime/essence/v41/g4/physarum \
            --out runtime/essence/v41/physarum-external-exam.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.essence_v38_inheritance import sha
          from tools.essence_v41_physarum_external_exam import EXAM_SCHEMA
          x=json.loads(Path('runtime/essence/v41/physarum-external-exam.json').read_text())
          assert x['schema']==EXAM_SCHEMA
          assert x['receipt_sha256']==sha({k:v for k,v in x.items() if k!='receipt_sha256'})
          assert len(x['files'])==4
          assert x['external_sources_new_not_g3_cohort'] is True
          assert x['both_checkpoints_verified_before_external_bytes_fetched'] is True
          assert x['automatic_promotion'] is False
          assert x['status'] in ('PASS_INTERNAL_PHYSARUM_GAIN_ON_NEW_EXTERNAL_SOURCES',
                                 'NO_PHYSARUM_GAIN_ON_NEW_EXTERNAL_SOURCES')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## ESSENCE original Physarum G4: FIRST new-source frozen pair\n')
              f.write('Status: '+x['status']+'\n')
              f.write('Control: '+str(x['control_external_mean_file_loss'])+'\n')
              f.write('Physarum: '+str(x['physarum_external_mean_file_loss'])+'\n')
              f.write('This is not independent scientific validation. Production authority denied.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v41-first-external-physarum-${{ github.run_id }}
          path: runtime/essence/v41/physarum-external-exam.json
          if-no-files-found: warn
          retention-days: 90
