name: ESSENCE v4.7 inherited JANUS repo-peer learning (research)

on:
  pull_request:
    paths:
      - 'tools/essence_v47_repo_peer_evolution.py'
      - 'tests/test_essence_v47_repo_peer_evolution.py'
      - 'research/essence/peer_v47/repo_lock.json'
      - '.github/workflows/essence-v47-repo-peer-learning.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v47_repo_peer_evolution.py'
      - 'tests/test_essence_v47_repo_peer_evolution.py'
      - 'research/essence/peer_v47/repo_lock.json'
      - '.github/workflows/essence-v47-repo-peer-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-essence-v47-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  OMP_NUM_THREADS: '4'

jobs:
  freeze-repository-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository split, original parent SHA and boundaries
        run: |
          python -m py_compile tools/essence_v47_repo_peer_evolution.py tests/test_essence_v47_repo_peer_evolution.py
          python -m unittest -v tests.test_essence_v47_repo_peer_evolution tests.test_essence_v46_oracle_descendant
      - name: Freeze source bytes and training vs unseen fact commitments
        run: |
          python tools/essence_v47_repo_peer_evolution.py freeze \
            --root . --lock research/essence/peer_v47/repo_lock.json \
            --out runtime/essence/v47/freeze.json
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v47-repo-source-lock-${{ github.run_id }}
          path: runtime/essence/v47/freeze.json
          retention-days: 90
          if-no-files-found: error

  model-to-model-research-council:
    if: github.event_name != 'pull_request' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    needs: freeze-repository-truth
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v47-repo-source-lock-${{ github.run_id }}
          path: runtime/essence/v47
      - name: Inherit sealed G1 Qwen adapter from genuine v4.6 Actions run
        uses: actions/download-artifact@v4
        with:
          name: essence-v46-oracle-child-43744199834
          run-id: 43744199834
          github-token: ${{ github.token }}
          path: runtime/essence/v47/parent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU inference, never tool-executing peer models
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Qwen chooses its knowledge gap and asks SmolLM to inspect source evidence
        run: |
          python tools/essence_v47_repo_peer_evolution.py peer \
            --root . --lock research/essence/peer_v47/repo_lock.json \
            --freeze runtime/essence/v47/freeze.json \
            --parent runtime/essence/v47/parent/child \
            --out runtime/essence/v47/peer.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('runtime/essence/v47/peer.json'))
          print('### JANUS Qwen ↔ SmolLM repo dialogue')
          print('- Learner selected field: '+d['selected_verified_key'])
          print('- Model picked recognized key:',d['model_chose_valid_source_key'])
          print('- Qwen initial matches source:',d['initial_exact_match'])
          print('- Qwen after peer review matches source:',d['revised_exact_match'])
          print('- Only actual repository data may become a training target.')
          print('- Neither model can modify GitHub, Sentinel or checkpoint rules.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v47-real-peer-council-${{ github.run_id }}
          path: runtime/essence/v47/peer.json
          retention-days: 90
          if-no-files-found: error

  train-repo-descendant:
    needs: model-to-model-research-council
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v47-repo-source-lock-${{ github.run_id }}
          path: runtime/essence/v47
      - uses: actions/download-artifact@v4
        with:
          name: essence-v47-real-peer-council-${{ github.run_id }}
          path: runtime/essence/v47
      - uses: actions/download-artifact@v4
        with:
          name: essence-v46-oracle-child-43744199834
          run-id: 43744199834
          github-token: ${{ github.token }}
          path: runtime/essence/v47/parent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU adapter-training dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Start exactly at G1 tensors, train only verified JANUS repository fact labels
        run: |
          python tools/essence_v47_repo_peer_evolution.py train \
            --root . --lock research/essence/peer_v47/repo_lock.json \
            --freeze runtime/essence/v47/freeze.json \
            --parent runtime/essence/v47/parent/child \
            --dialogue runtime/essence/v47/peer.json \
            --child runtime/essence/v47/child \
            --out runtime/essence/v47/train-receipt.json
          test -s runtime/essence/v47/child/adapter_model.safetensors
          test -s runtime/essence/v47/child/lineage.json
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v47-repo-child-research-${{ github.run_id }}
          path: |
            runtime/essence/v47/child/
            runtime/essence/v47/train-receipt.json
          retention-days: 90
          if-no-files-found: error

  new-facts-and-parent-retention-exam:
    needs: [freeze-repository-truth, train-repo-descendant]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v47-repo-source-lock-${{ github.run_id }}
          path: runtime/essence/v47
      - uses: actions/download-artifact@v4
        with:
          name: essence-v47-repo-child-research-${{ github.run_id }}
          path: runtime/essence/v47
      - uses: actions/download-artifact@v4
        with:
          name: essence-v46-oracle-child-43744199834
          run-id: 43744199834
          github-token: ${{ github.token }}
          path: runtime/essence/v47/parent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model evaluator
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: One-shot new-fact and old-ability regression exam (never auto-promote)
        run: |
          python tools/essence_v47_repo_peer_evolution.py exam \
            --root . --lock research/essence/peer_v47/repo_lock.json \
            --freeze runtime/essence/v47/freeze.json \
            --parent runtime/essence/v47/parent/child \
            --child runtime/essence/v47/child \
            --out runtime/essence/v47/paired-exam.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open('runtime/essence/v47/paired-exam.json'))
          print('### ESSENCE v4.7 actual G1→G2 repo transfer')
          print('- Verdict:',p['status'])
          for field in ('paraphrase_test','unseen_fact_test','previous_generation_retention'):
            print('- '+field+': '+str(p[field]))
          print('**Internal experimental data only. Native JANUS, production and Sentinel untouched.**')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v47-first-repo-peer-exam-${{ github.run_id }}
          path: runtime/essence/v47/paired-exam.json
          retention-days: 90
          if-no-files-found: warn
