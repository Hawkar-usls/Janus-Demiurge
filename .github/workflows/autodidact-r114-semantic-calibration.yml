          # exam entity identity or label. The same scalar offset transfers to both forms.
          for seed,arm,model,row in trained:
              world,cw,ew=split_world(seed); y=[v for n,v in ew]
              new=fact_rows(ew,exam_forms); old=old_pool(seed,2)+ce
              prior_old=old_pool(seed,0)+old_pool(seed,1)+cp+cg
              require(not {r['entity'] for r in prior_old}&{r['entity'] for r in old},'OLD_EXAM_OVERLAP')
              require(not {r['prompt'] for r in prior_old+fact_rows(world,train_forms)+fact_rows(ew,gate_forms)+fact_rows(cw,cal_forms)}&{r['prompt'] for r in old+new},'PROMPT_OVERLAP')
              require(not set(null_names(seed))&{n for n,v in world},'NULL_ENTITY_OVERLAP')
              po=[x>0 for x in scores(teacher,old)]; o=[x>0 for x in scores(model,old)]
              lost=sum(a and not b for a,b in zip(po,o))
              categories={tag:{'n':sum(r['tag']==tag for r in old),'parent_correct':sum(a and r['tag']==tag for a,r in zip(po,old)),'candidate_correct':sum(a and r['tag']==tag for a,r in zip(o,old)),'lost':sum(a and not b and r['tag']==tag for a,b,r in zip(po,o,old))} for tag in sorted({r['tag'] for r in old})}
              raw_p=read_matrix(teacher,ew,exam_forms); raw_c=read_matrix(model,ew,exam_forms)
              bp=reference_bias(teacher,seed,exam_forms); bc=reference_bias(model,seed,exam_forms)
              def correct_pair(z):
                  return [all((v[i]>0 if y[i]==1 else v[i]<0) for v in z) for i in range(len(y))]
              parent_raw_both=sum(correct_pair(raw_p)); candidate_raw_both=sum(correct_pair(raw_c))
              base_auc=[auc(z,y) for z in raw_c]
              for mode in readouts:
                  zp=transform(raw_p,bp,mode,calibrators[(seed,'parent',mode)])
                  zc=transform(raw_c,bc,mode,calibrators[(seed,'candidate',mode)])
                  pm=[metrics(z,y) for z in zp]; cmx=[metrics(z,y) for z in zc]
                  require(all(abs(a-b['rank_auc'])<1e-12 for a,b in zip(base_auc,cmx)),'EXAM_RANK_CHANGED_BY_OFFSET')
                  pe=correct_pair(zp); ne=correct_pair(zc)
                  anti=all(min(q['recall_0'],q['recall_1'])>=.5 and q['rank_auc']>=.7 for q in cmx)
                  # Retain prior absolute/raw-parent criteria and add matched-readout parent comparison.
                  passed=sum(ne)>=20 and sum(ne)-max(parent_raw_both,sum(pe))>=4 and lost==0 and sum(po)>=16 and anti
                  panel={'seed':seed,'arm':arm,'readout':mode,'novel_entities':n_facts,'calibration_entities':n_cal,'parent_raw_novel_both':parent_raw_both,'candidate_raw_novel_both':candidate_raw_both,'parent_novel_both':sum(pe),'candidate_novel_both':sum(ne),'candidate_novel_prompt_correct':sum(x['correct'] for x in cmx),'parent_forms':pm,'candidate_forms':cmx,'parent_offset':calibrators[(seed,'parent',mode)],'candidate_offset':calibrators[(seed,'candidate',mode)],'exam_reference_bias_parent':bp,'exam_reference_bias_candidate':bc,'anti_collapse_gate':anti,'old_items':len(old),'old_parent_correct':sum(po),'old_candidate_correct':sum(o),'old_lost':lost,'categories':categories,'exploratory_gate':passed,'new_parent':pe,'new_candidate':ne,'old_parent':po,'old_candidate':o}
                  panels.append(panel)
                  print('AUTODIDACT_R114_EXAM',json.dumps({k:v for k,v in panel.items() if k not in ('new_parent','new_candidate','old_parent','old_candidate')},sort_keys=True,allow_nan=False),flush=True)
          require(len(trained)==2 and len(panels)==6 and len(cal_receipts)==12 and frozen==[tensor_digest(m.state_dict()) for _,_,m,_ in trained] and state_digest()==before and sha(parent.read_bytes())==parent_sha,'FINAL_INTEGRITY')
          require(calibration_digest==sha(json.dumps(cal_receipts,sort_keys=True,allow_nan=False).encode()),'CALIBRATION_MUTATION')
          result={'schema':'janus.autodidact.r114.semantic_calibration.v1','prior_run':45909944388,'prior_sha256':sha(r113_raw),'parent_sha256':parent_sha,'parent_state_digest':before,'registry_commit':commit,'risk_ledger':risk,'design':{'seeds':seeds,'trials':trials,'step_radius':step_radius,'total_radius':total_radius,'menu':menu,'replay_weight':.25,'acquisition_arms':['random_ce'],'readouts':readouts,'calibration_forms':cal_forms,'calibration_entities':n_cal,'exam_entities':n_facts,'fit_entities':n_facts+n_cal,'offset_bounds':[-4.,4.],'offset_ridge':.01,'reference_names_per_form':8,'train_forms':train_forms,'gate_forms':gate_forms,'exam_forms':exam_forms,'prior_sources_excluded':108,'anti_collapse_gate':'per exam form each class recall >= .5 and opposite-label ranking AUC >= .7','replay_source':'rule-verified examples plus newly admitted exact-source numeric-copy exercises, not raw document training','admission_diagnostic':diagnostic,'admission_scope':'SHADOW_DERIVED_COPY_ONLY','origin_commit':origin_commit,'cortex_commit':ccommit,'cortex_manifest':cm['receipt_sha256'],'cortex_receipts':{'train':cr,'gate':cgr,'exam':cer},'gate_policy':'parent-correct item mask, new gate loss <= parent, geometry; not monotonic loss','equal_work':'same frozen candidate weights for all readouts; extra reference inference for centered readout','old_pool_size':'45 synthetic plus 12 Cortex per split','old_exam_min_parent_correct':16},'runs':[r for _,_,_,r in trained],'panels':panels,'calibration_receipts':cal_receipts,'calibration_digest':calibration_digest,'controls':11,'admission_controls':4,'elapsed_seconds':time.monotonic()-started,'sovereign':'HOLD_EXTERNAL_INDEPENDENT_EXAM','claim_ceiling':{'memory_cortex_source_copy_verified':True,'raw_cortex_training_allowed':False,'quarantine_override':False,'scientific_truth_verified':False,'external_blind_exam':False,'open_generation_tested':False,'general_semantic_immunity_proven':False,'candidate_exported':False,'parent_weights_changed':False,'production_changed':False,'promotion_authority':False}}
          out=Path(os.environ['RUNNER_TEMP'])/'autodidact-r114.json'
          out.write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print('AUTODIDACT_R114_RESULT',json.dumps({k:v for k,v in result.items() if k not in ('runs','panels')},sort_keys=True,allow_nan=False))
          PY
