name: JANUS SENTINEL real GitHub Actions tiny Transformer trainer

on:
  pull_request:
    paths:
      - 'tools/sentinel_transformer.py'
      - 'tests/test_sentinel_transformer.py'
      - '.github/workflows/sentinel-train-transformer.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sentinel_transformer.py'
      - '.github/workflows/sentinel-train-transformer.yml'
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-sentinel-train-and-calibrate
  cancel-in-progress: false

jobs:
  neural-training-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU Torch research runtime
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify true trainable causal attention, chronology and held-out calibration
        run: |
          python -m py_compile tools/sentinel_transformer.py tools/sentinel_core.py
          python -m unittest -v tests.test_sentinel_transformer tests.test_sentinel_core

  train-from-observed-actions:
    if: github.event_name != 'pull_request' && vars.SENTINEL_PAUSED != 'true' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: sentinel-state
          path: runtime/sentinel/state
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU Torch to train ALL trainable tiny attention weights
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train and calibrate on real dated GitHub Actions history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime/sentinel/output
          PREVIOUS=""
          if [ -f runtime/sentinel/state/sentinel/model/checkpoint.json ]; then
            PREVIOUS="--previous runtime/sentinel/state/sentinel/model/checkpoint.json"
          fi
          python -m tools.sentinel_transformer \
            --out runtime/sentinel/output/candidate.json $PREVIOUS
      - name: Verify source hashes and persist research candidate without unreviewed production promotion
        env:
          CHECKOUT: runtime/sentinel/state
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.sentinel_transformer import check_checkpoint
          import json
          from pathlib import Path
          p=Path('runtime/sentinel/output/candidate.json')
          doc=check_checkpoint(json.loads(p.read_text()))
          assert doc['source']=='REAL_COMPLETED_GITHUB_ACTIONS'
          assert doc['dispatch_authority'] is False
          assert doc['production_authority'] is False
          assert doc['cohort_sizes']['chronological_test']>=16
          assert doc['train_epochs']==30
          print('GENUINE_TRAINED_TINY_ATTENTION:',doc['status'])
          print('CHRONOLOGICAL_TEST_BRIER:',doc['test_brier'])
          print('BASELINE_BRIER:',doc['constant_prior_brier'])
          print('TEMPERATURE:',doc['temperature'])
          PY
          mkdir -p "$CHECKOUT/sentinel/model/candidates"
          if [ ! -f "$CHECKOUT/sentinel/model/checkpoint.json" ]; then
            # Shared A/B initial research checkpoint, no release authority.
            cp runtime/sentinel/output/candidate.json \
              "$CHECKOUT/sentinel/model/checkpoint.json"
          else
            # Never auto-replace the shared A/B model with a model evaluated
            # on a previously exposed or overlapping internal holdout.
            cp runtime/sentinel/output/candidate.json \
              "$CHECKOUT/sentinel/model/candidates/${{ github.run_id }}.json"
            # Freeze ONE immutable child before any future GH outcomes. Other
            # 30-minute candidates remain shadow until this gate is consumed.
            python - <<'PY'
          import json
          from pathlib import Path
          from tools import sentinel_transformer as m
          root=Path('runtime/sentinel/state/sentinel/model')
          parent=m.check_checkpoint(json.loads((root/'checkpoint.json').read_text()))
          child=m.check_checkpoint(json.loads(Path('runtime/sentinel/output/candidate.json').read_text()))
          pending=root/'pending-challenge.json'
          if not pending.exists() and child['parent_checkpoint_sha256']==parent['checkpoint_sha256'] and m.canonical(parent['weights'])!=m.canonical(child['weights']):
              run_id='${{ github.run_id }}'
              record={
                  'schema':'janus.sentinel.precommitted_weight_challenge/1.0',
                  'candidate_file':'sentinel/model/candidates/'+run_id+'.json',
                  'source_run_id':run_id,
                  'candidate_checkpoint_sha256':child['checkpoint_sha256'],
                  'parent_checkpoint_sha256':parent['checkpoint_sha256'],
                  'candidate_last_test_utc':child['last_test_utc'],
                  'research_only':True,
                  'production_authority':False,
              }
              record['receipt_sha256']=m.digest(record)
              pending.write_text(json.dumps(record,sort_keys=True,indent=2)+'\\n')
              print('SENTINEL_CHALLENGER_FROZEN_PENDING_128_NEW_GITHUB_RUNS',run_id)
          elif pending.exists():
              print('SENTINEL_EXISTING_CHALLENGER_ALREADY_FROZEN')
          else:
              print('SENTINEL_HOLD_NO_NEW_WEIGHTS_FOR_CHALLENGER')
          PY
          fi
          git -C "$CHECKOUT" config user.name "github-actions[bot]"
          git -C "$CHECKOUT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$CHECKOUT" add -f sentinel/model/
          if git -C "$CHECKOUT" diff --cached --quiet; then
            echo "::error::Model training result missing, refusing false success"
            exit 1
          fi
          git -C "$CHECKOUT" commit -m "SENTINEL: real GitHub history Transformer checkpoint/calibration ${{ github.run_id }}"
          # Atomic non-force Git compare-and-swap, bounded retries only.
          # On conflict, DO NOT blindly overwrite A/B checkpoint.
          if git -C "$CHECKOUT" push origin HEAD:refs/heads/sentinel-state; then
            echo "SENTINEL_RESEARCH_CANDIDATE_AND_CHALLENGE_CAS_PERSISTED" >> "$GITHUB_STEP_SUMMARY"
          else
            # Branch changed under concurrent guardian CAS. Candidate
            # remains an immutable artifact; do not rebase/retry unsafe state.
            echo "SENTINEL_HOLD_TRAINER_CAS_CONFLICT_CANDIDATE_ARTIFACT_ONLY" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "SENTINEL_TRAINED_RESEARCH_ONLY_NO_DISPATCH_AUTHORITY" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-trained-risk-candidate-${{ github.run_id }}
          path: runtime/sentinel/output/candidate.json
          if-no-files-found: warn
          retention-days: 90
