name: JANUS HRAiN Runtime Cluster Data-Loss HOLD
on:
  pull_request:
    paths:
      - 'hrain_graph_engine.py'
      - 'tests/test_hrain_runtime_compression_hold.py'
      - '.github/workflows/janus-hrain-runtime-compression-hold.yml'
  push:
    branches: [main]
    paths:
      - 'hrain_graph_engine.py'
      - 'tests/test_hrain_runtime_compression_hold.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-graph-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            hrain_graph_engine.py
            tests/test_hrain_runtime_compression_hold.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal dependency
        run: python -m pip install numpy
      - name: Compile runtime and test
        run: python -m py_compile hrain_graph_engine.py tests/test_hrain_runtime_compression_hold.py
      - name: Verify synthetic data-loss protection
        run: python -m unittest discover -v -s tests -p test_hrain_runtime_compression_hold.py
