name: JANUS HRAiN Runtime Cluster Data-Loss HOLD
on:
  pull_request:
    paths:
      - 'hrain_graph_engine.py'
      - 'tests/test_hrain_runtime_compression_hold.py'
      - '.github/workflows/janus-hrain-runtime-compression-hold.yml'
  push:
    branches: [main]
    paths:
      - 'hrain_graph_engine.py'
      - 'tests/test_hrain_runtime_compression_hold.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-graph-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Fetch two pinned files (Windows-safe; repository contains legacy colon filenames)
        shell: pwsh
        env:
          SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Force tests | Out-Null
          $base = "https://raw.githubusercontent.com/Hawkar-usls/Janus-Demiurge/$env:SRC_SHA"
          Invoke-WebRequest -Uri "$base/hrain_graph_engine.py" -OutFile hrain_graph_engine.py
          Invoke-WebRequest -Uri "$base/tests/test_hrain_runtime_compression_hold.py" -OutFile tests/test_hrain_runtime_compression_hold.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal dependency
        run: python -m pip install numpy
      - name: Compile runtime and test
        run: python -m py_compile hrain_graph_engine.py tests/test_hrain_runtime_compression_hold.py
      - name: Verify synthetic data-loss protection
        run: python -m unittest discover -v -s tests -p test_hrain_runtime_compression_hold.py
