name: JANUS-011B Dryad API Access Audit
on:
  pull_request:
    paths:
      - 'experiments/ocean_transformer/late_choice_010/dryad_access_011b_probe.py'
      - '.github/workflows/janus-011b-dryad-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-011b-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public Dryad APIs and original CSV first line, bounded
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/janus011b"
          python -u experiments/ocean_transformer/late_choice_010/dryad_access_011b_probe.py --output "$RUNNER_TEMP/janus011b/dryad_probe.json"
      - uses: actions/upload-artifact@v4
        with:
          name: janus-011b-dryad-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/janus011b/dryad_probe.json
          retention-days: 60
          if-no-files-found: error
