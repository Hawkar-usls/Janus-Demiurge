name: TRUMP Candidate Runtime v0.1

on:
  push:
    paths:
      - 'trump/**'
      - 'tests/test_trump_candidate_runtime_v0_1.py'
      - 'tests/test_trump_reverse_narrative_transform_v0_1.py'
      - '.github/workflows/trump-candidate-runtime-v0.1.yml'
  pull_request:
    paths:
      - 'trump/**'
      - 'tests/test_trump_candidate_runtime_v0_1.py'
      - 'tests/test_trump_reverse_narrative_transform_v0_1.py'
      - '.github/workflows/trump-candidate-runtime-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile TRUMP candidate runtime
        run: |
          python -m py_compile \
            trump/trump_candidate.py \
            trump/looking_for_something_policy.py \
            trump/looking_for_something_runner.py \
            trump/reverse_narrative_transform.py \
            trump/reverse_narrative_runner.py \
            trump/reverse_narrative_origin_prime.py \
            trump/reverse_narrative_r1_runner.py \
            tests/test_trump_candidate_runtime_v0_1.py \
            tests/test_trump_reverse_narrative_transform_v0_1.py
      - name: Validate manifest and R1 prereg JSON
        run: |
          python -m json.tool trump/TRUMP_MANIFEST.json >/dev/null
          python -m json.tool trump/experiments/TRUMP_REVERSE_NARRATIVE_R1_ORIGIN_PRIME_PREREG.json >/dev/null
      - name: Candidate runtime unit tests
        run: |
          python -m unittest -v \
            tests.test_trump_candidate_runtime_v0_1 \
            tests.test_trump_reverse_narrative_transform_v0_1
      - name: Reverse narrative R0 local contract self-test
        run: python trump/reverse_narrative_runner.py selftest
      - name: ORIGIN PRIME local contract self-test
        run: python trump/reverse_narrative_origin_prime.py
      - name: Reverse narrative R1 local contract self-test
        run: python trump/reverse_narrative_r1_runner.py selftest
      - name: Candidate status remains OPEN and non-authoritative
        run: |
          python trump/trump_candidate.py status > /tmp/trump-status.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/trump-status.json'))
          assert r['terminal']=='TRUMP_CANDIDATE_RUNTIME_AVAILABLE'
          assert r['wake_allowed'] is True
          assert r['use_allowed'] is True
          assert r['authority']['proof_authority'] is False
          assert r['scientific_boundary']['P_VS_NP']=='OPEN'
          PY

  pinned-source-live-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact pinned Fundamentum source through Git blob identity
        run: python trump/trump_candidate.py verify-source
      - name: Wake candidate TRUMP and run its own self-test
        run: python trump/trump_candidate.py selftest
      - name: Run frozen REVERSE NARRATIVE R0 tournament
        run: python trump/reverse_narrative_runner.py frozen-r0 > reverse-narrative-r0.json
      - name: Validate frozen R0 receipt firewall
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reverse-narrative-r0.json'))
          assert r['experiment_id']=='TRUMP_REVERSE_NARRATIVE_FROZEN_R0'
          assert r['authority']['proof_authority'] is False
          assert r['scientific_boundary']['P_equals_NP_proved'] is False
          assert r['scientific_boundary']['P_VS_NP']=='OPEN'
          assert r['frozen_contract']['same_witness_bytes'] is True
          assert r['frozen_contract']['formula_semantics_mutable'] is False
          assert all(x['replay_failures']==0 for x in r['results'])
          PY
      - name: Run frozen REVERSE NARRATIVE R1 ORIGIN PRIME tournament
        run: python trump/reverse_narrative_r1_runner.py frozen-r1 > reverse-narrative-r1.json
      - name: Validate and expose frozen R1 receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reverse-narrative-r1.json'))
          assert r['experiment_id']=='TRUMP_REVERSE_NARRATIVE_R1_ORIGIN_PRIME'
          assert r['prereg_commit']=='5a83dd495fcc8f6939cd8b94d4cd38e2c26ccb3f'
          assert r['authority']['proof_authority'] is False
          assert r['scientific_boundary']['P_equals_NP_proved'] is False
          assert r['scientific_boundary']['P_VS_NP']=='OPEN'
          assert r['frozen_contract']['same_witness_bytes'] is True
          assert r['frozen_contract']['formula_semantics_mutable'] is False
          assert r['frozen_contract']['mode_name_scientific_tiebreak_allowed'] is False
          assert all(x['replay_failures']==0 for x in r['results'])
          assert r['origin_prime']['authority']['proof_authority'] is False
          assert r['origin_prime']['scientific_boundary']['P_VS_NP']=='OPEN'
          print(json.dumps(r, ensure_ascii=False, sort_keys=True, indent=2))
          PY
      - name: Upload frozen reverse receipts
        uses: actions/upload-artifact@v4
        with:
          name: trump-reverse-narrative-r0-r1
          path: |
            reverse-narrative-r0.json
            reverse-narrative-r1.json
          if-no-files-found: error
