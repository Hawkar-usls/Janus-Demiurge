name: JANUS HRAiN Legacy UI Save Data-Loss Firewall
on:
  pull_request:
    paths:
      - 'server.py'
      - 'tests/test_hrain_server_full_save_hold.py'
      - '.github/workflows/janus-hrain-server-save-firewall.yml'
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'tests/test_hrain_server_full_save_hold.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-save-hold:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - name: Fetch pinned source and synthetic tests only
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Path tests -Force | Out-Null
          $base="https://raw.githubusercontent.com/Hawkar-usls/Janus-Demiurge/$env:SOURCE_SHA"
          Invoke-WebRequest -Uri "$base/server.py" -OutFile server.py
          Invoke-WebRequest -Uri "$base/tests/test_hrain_server_full_save_hold.py" -OutFile tests/test_hrain_server_full_save_hold.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v -s tests -p test_hrain_server_full_save_hold.py
