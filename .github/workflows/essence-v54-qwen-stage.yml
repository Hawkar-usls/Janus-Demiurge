name: ESSENCE v5.4 real Qwen research staging HTTP rollout rollback

on:
  pull_request:
    paths:
      - 'tools/essence_v54_qwen_stage.py'
      - 'tests/test_essence_v54_qwen_stage.py'
      - '.github/workflows/essence-v54-qwen-stage.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v54_qwen_stage.py'
      - 'tests/test_essence_v54_qwen_stage.py'
      - '.github/workflows/essence-v54-qwen-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v54-real-qwen-stage-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'

jobs:
  no-network-stage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Freeze G2 G3 checkpoint identities and reject fake HTTP staging routes
        run: |
          python -m py_compile tools/essence_v54_qwen_stage.py tests/test_essence_v54_qwen_stage.py
          python -m unittest -v tests.test_essence_v54_qwen_stage

  real-live-qwen-loopback-rollout:
    needs: no-network-stage-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.ESSENCE_EVOLUTION_PAUSED != 'true' && vars.ESSENCE_V54_STAGE_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v54_stage/state
          persist-credentials: false
          sparse-checkout: |
            models/gen0002
            models/v54gen0003
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install pinned CPU Qwen and safetensors only
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Real separate OS Qwen service switches G2 to SHA-pinned G3, injects HTTP 503 and rolls back
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.essence_v54_qwen_stage rehearse \
            --parent runtime/essence/v54_stage/state/models/gen0002 \
            --child runtime/essence/v54_stage/state/models/v54gen0003 \
            --stage runtime/essence/v54_stage/staging-ephemeral \
            --out runtime/essence/v54_stage/real-http-receipt.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from tools import essence_v54_qwen_stage as m
          r=m.check(m.read("runtime/essence/v54_stage/real-http-receipt.json"))
          if r.get("schema")!=m.SCHEMA or r.get("status")!="PASS_REAL_QWEN_LOOPBACK_ROLLOUT_AND_ROLLBACK":
              raise SystemExit("ST54_EXPERIMENT_NOT_PASSED")
          if (r["real_qwen_http_requests_before"]!=3 or
              r["real_qwen_http_requests_after_switch"]!=3 or
              r["real_qwen_http_requests_after_rollback"]!=3 or
              r["injected_canary_http_status"]!=503 or
              r["restored_original_answer_exactly"] is not True or
              r["live_service_pid_preserved"] is not True or
              r["production_promotion"] is not False or
              r["actual_production_service_modified"] is not False or
              r["real_production_rollback_proven"] is not False):
              raise SystemExit("ST54_FORGED_OR_INVALID_ROLLBACK")
          print("### ESSENCE v5.4 actual Qwen HTTP staging G2 → G3 → G2")
          print("Real Qwen inference before / after / restored: 3 / 3 / 3")
          print("Injected candidate HTTP fault 503: YES")
          print("Same service PID and original answer SHA restored: YES")
          print("External/production persistent service changed: NO")
          print("Not a claim of neural generalization, external replication or production rollback.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: essence-v54-real-qwen-stage-rollback-${{ github.run_id }}
          path: runtime/essence/v54_stage/real-http-receipt.json
          retention-days: 90
          if-no-files-found: warn
