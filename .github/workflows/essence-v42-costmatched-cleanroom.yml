name: ESSENCE v4.2 cost-matched Physarum clean-room source exam

on:
  pull_request:
    paths:
      - 'tools/essence_v42_physarum_full_cost.py'
      - 'research/essence/physarum_v42/cleanroom_verifier.py'
      - 'research/essence/physarum_v42/preregistered_new_source_cohort.json'
      - 'tests/test_essence_v42_costmatched_cleanroom.py'
      - '.github/workflows/essence-v42-costmatched-cleanroom.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v42_physarum_full_cost.py'
      - 'research/essence/physarum_v42/cleanroom_verifier.py'
      - 'research/essence/physarum_v42/preregistered_new_source_cohort.json'
      - 'tests/test_essence_v42_costmatched_cleanroom.py'
      - '.github/workflows/essence-v42-costmatched-cleanroom.yml'

permissions:
  contents: read

concurrency:
  group: essence-v42-one-first-exam-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-and-adversarial-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU
        run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate source locks and independent checkpoint reconstruction using synthetic tensors only
        run: |
          python -m py_compile \
            tools/essence_v42_physarum_full_cost.py \
            research/essence/physarum_v42/cleanroom_verifier.py
          python -m unittest -v \
            tests.test_essence_v42_costmatched_cleanroom \
            tests.test_essence_v41_physarum_external_exam \
            tests.test_essence_v40_physarum_bridge

  full-cost-sealed-checkpoints:
    needs: contract-and-adversarial-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v39-g3-checkpoint-43649912620
          run-id: 43649912620
          github-token: ${{ github.token }}
          path: runtime/essence/v42/g3
      - uses: actions/download-artifact@v4
        with:
          name: essence-v38-freeze-43648008998
          run-id: 43648008998
          github-token: ${{ github.token }}
          path: runtime/essence/v42
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU
        run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Seal 14-step fixed baseline and replay full Physarum search INCLUDING probes, before external source access
        run: |
          python -m tools.essence_v42_physarum_full_cost \
            --repo-root . \
            --g3-dir runtime/essence/v42/g3 \
            --freeze runtime/essence/v42/freeze.json \
            --lock research/essence/physarum_v42/preregistered_new_source_cohort.json \
            --out-dir runtime/essence/v42/cost-sealed
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.essence_v38_inheritance import sha
          row=json.loads(Path('runtime/essence/v42/cost-sealed/full-cost-receipt.json').read_text())
          assert row['receipt_sha256']==sha({k:v for k,v in row.items() if k!='receipt_sha256'})
          assert row['external_exam_bytes_read'] is False
          assert row['physarum']['total_training_steps']==14
          assert row['baseline14']['train_steps']==14
          assert row['full_cost_includes_all_probes_and_selection'] is True
          assert row['production_authority'] is False
          print('All candidate training costs and the baseline14 checkpoint sealed BEFORE unseen data.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v42-sealed-cost-checkpoints-${{ github.run_id }}
          path: runtime/essence/v42/cost-sealed/
          if-no-files-found: error
          retention-days: 90

  separate-cleanroom-implementation-exam:
    needs: full-cost-sealed-checkpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v42-sealed-cost-checkpoints-${{ github.run_id }}
          path: runtime/essence/v42/cost-sealed/
      - uses: actions/download-artifact@v4
        with:
          name: essence-v40-physarum-research-43650540561
          run-id: 43650540561
          github-token: ${{ github.token }}
          path: runtime/essence/v42/g4/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch, no ESSENCE trainer imports
        run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Strictly validate THREE sealed models before reading 12 new external upstream files
        run: |
          python research/essence/physarum_v42/cleanroom_verifier.py \
            --lock research/essence/physarum_v42/preregistered_new_source_cohort.json \
            --cost runtime/essence/v42/cost-sealed/full-cost-receipt.json \
            --baseline14-dir runtime/essence/v42/cost-sealed/baseline14 \
            --control8-dir runtime/essence/v42/g4/control \
            --physarum-dir runtime/essence/v42/g4/physarum \
            --out runtime/essence/v42/first-costmatched-exam.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('runtime/essence/v42/first-costmatched-exam.json').read_text())
          assert len(d['raw_tasks'])==12
          assert len(d['repo_families'])==4
          assert d['all_models_checked_before_new_external_data'] is True
          assert d['independent_execution_by_external_researcher'] is False
          assert d['secret_external_custodian'] is False
          assert d['no_promotion_to_working_models'] is True
          assert d['status'] in (
            'PASS_SELF_VERIFIED_COST_AWARE_FRESH_SOURCE_GAIN',
            'NO_COST_AWARE_PHYSARUM_GAIN_ON_FROZEN_COHORT')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## JANUS Physarum cost-matched clean-room reimplementation (12 external files)\n')
            f.write('**Verdict:** '+d['status']+'\n')
            f.write('Loss means: '+str(d['mean_loss'])+'\n')
            f.write('Physarum/full-cost baseline CPU ratio: '+str(d['physarum_to_fixed_full_cpu_cost_ratio'])+'\n')
            f.write('Not an independent researcher or private blind custodian.\n')
          print('Exam receipt published with negative results preserved.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v42-cleanroom-fresh-source-exam-${{ github.run_id }}
          path: runtime/essence/v42/first-costmatched-exam.json
          if-no-files-found: warn
          retention-days: 90
