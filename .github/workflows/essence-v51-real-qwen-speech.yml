name: ESSENCE v5.1 real Qwen G2 spoken peer question (research only)

on:
  pull_request:
    paths:
      - 'tools/essence_v51_model_speaker.py'
      - 'tests/test_essence_v51_model_speaker.py'
      - '.github/workflows/essence-v51-real-qwen-speech.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v51_model_speaker.py'
      - 'tests/test_essence_v51_model_speaker.py'
      - '.github/workflows/essence-v51-real-qwen-speech.yml'
  schedule:
    - cron: '3 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v51-model-speech-once-per-inbound-task
  cancel-in-progress: false

jobs:
  offline-safety-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Prove model text cannot become shell commands, scientific truth, or executable workflow
        run: |
          python -m compileall -q tools/essence_v51_model_speaker.py tests/test_essence_v51_model_speaker.py
          python -m unittest -v tests.test_essence_v51_model_speaker

  one-shot-genuine-qwen-utterance:
    if: github.event_name != 'pull_request' && vars.ESSENCE_V51_MODEL_SPEECH_PAUSED != 'true'
    needs: offline-safety-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: code
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-voice-state
          path: state
          sparse-checkout: |
            research/essence/voice_v51
          persist-credentials: true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: original-model
          persist-credentials: false
      - name: Fetch peer request snapshot without peer write credentials
        shell: bash
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch essence-voice-state \
            https://github.com/Hawkar-usls/Janus_Genesis.git peer
          git -C peer sparse-checkout set --no-cone research/essence/voice_v51
      - name: Select only first source-verified unanswered inbound peer question
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          root=Path('peer/research/essence/voice_v51/messages')
          replies=Path('state/research/essence/voice_v51/replies')
          utterances=Path('state/research/essence/voice_v51/model_utterances')
          found=False
          Path('runtime/essence-v51').mkdir(parents=True,exist_ok=True)
          for p in sorted(root.glob('*.json')):
              if (replies/p.name).is_file() and not (utterances/p.name).exists():
                  Path('runtime/essence-v51/peer-task-path').write_text(str(p))
                  Path('runtime/essence-v51/local-reply-path').write_text(str(replies/p.name))
                  Path('runtime/essence-v51/utterance-path').write_text(str(utterances/p.name))
                  found=True
                  break
          print('ready='+str(found).lower())
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Install pinned CPU Qwen runtime, only for new verified unanswered peer task
        if: steps.gate.outputs.ready == 'true'
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Generate NEW raw words from same SHA-verified Qwen G2 adapter
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          PYTHONPATH=code python code/tools/essence_v51_model_speaker.py \
            --peer-task "$(cat runtime/essence-v51/peer-task-path)" \
            --local-reply "$(cat runtime/essence-v51/local-reply-path)" \
            --model-dir original-model/models/gen0002 \
            --out "$(cat runtime/essence-v51/utterance-path)"
          echo 'NEW_MODEL_OUTPUT_IS_UNTRUSTED_RESEARCH_TEXT_NOT_A_COMMAND' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist one model-generated message in isolated transport branch
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name 'ESSENCE Qwen G2 researcher[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/essence/voice_v51/model_utterances/*.json
          git diff --cached --check
          git commit -m "ESSENCE: preserve raw Qwen G2 research utterance to peer (not task authority)"
          git pull --rebase origin essence-voice-state
          git push origin HEAD:refs/heads/essence-voice-state
          echo 'ONE_REAL_MODEL_UTTERANCE_PERSISTED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.gate.outputs.ready == 'true'
        with:
          name: essence-v51-g2-actual-voice-${{ github.run_id }}
          path: state/research/essence/voice_v51/model_utterances/*.json
          retention-days: 90
          if-no-files-found: error
