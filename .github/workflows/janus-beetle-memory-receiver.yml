name: JANUS Beetle Memory Receiver
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-beetle-memory-receiver.yml'

permissions:
  contents: write

concurrency:
  group: janus-beetle-memory-receiver
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout recipient repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout pinned JANUS Beetle receiver
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-lapis
          ref: c35b9af34ce56a3545a8d60addc01f947997f4e8
          path: beetle-client
          persist-credentials: false

      - name: Restore durable discovery inbox
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin beetle-memory >/dev/null 2>&1; then
            git fetch origin beetle-memory
            git switch -C beetle-memory origin/beetle-memory
          else
            git switch --orphan beetle-memory
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Stage all missing sequenced discovery packages
        shell: bash
        run: |
          set -euo pipefail
          python beetle-client/tools/beetle_memory_receiver.py \
            --inbox-dir target/data/beetle-inbox \
            --target-repository "$GITHUB_REPOSITORY" \
            --max-batches 96

      - name: Commit batches and ACK atomically to isolated branch
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          [[ -d data/beetle-inbox ]] || exit 0
          git config user.name 'janus-beetle-memory[bot]'
          git config user.email 'janus-beetle-memory[bot]@users.noreply.github.com'
          git add data/beetle-inbox
          if git diff --cached --quiet; then
            echo 'Inbox already up to date'
            exit 0
          fi
          git commit -m 'beetle-memory: durable ordered inbox + ACK'
          git push origin HEAD:beetle-memory
