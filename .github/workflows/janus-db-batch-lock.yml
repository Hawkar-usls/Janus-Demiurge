name: JANUS SQLite Batch Lock Regression
on:
  pull_request:
    paths:
      - janus_db.py
      - tests/test_janus_db_batch_buffer_lock.py
      - .github/workflows/janus-db-batch-lock.yml
  push:
    branches: [main]
    paths:
      - janus_db.py
      - tests/test_janus_db_batch_buffer_lock.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-sqlite-batch-lock:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            janus_db.py
            tests/test_janus_db_batch_buffer_lock.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile the module without importing the JANUS runtime
        run: python -m py_compile janus_db.py
      - name: Three synthetic temp-SQLite deadlock and loss tests
        run: python -m unittest discover -v -s tests -p test_janus_db_batch_buffer_lock.py
