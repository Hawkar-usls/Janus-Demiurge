name: JANUS Ocean / Zeno Temporal 001

on:
  pull_request:
    paths:
      - '.github/workflows/janus-zeno-temporal-001.yml'
      - 'experiments/ocean_transformer/zeno_temporal_001.py'
      - 'experiments/ocean_transformer/zeno_retro_control.py'
      - 'experiments/ocean_transformer/zeno_wolfram_bridge.py'
      - 'experiments/ocean_transformer/test_zeno_temporal_001.py'
      - 'experiments/ocean_transformer/JANUS_ZENO_TEMPORAL_001.md'
      - 'experiments/ocean_transformer/beetle_wolfram_readonly_gate.py'
      - 'experiments/ocean_transformer/test_beetle_wolfram_readonly_gate.py'
      - 'experiments/ocean_transformer/wolfram_v2_registry_gate.py'
      - 'experiments/ocean_transformer/test_wolfram_v2_registry_gate.py'
      - 'experiments/ocean_transformer/zeno_science_council_v3.py'
      - 'experiments/ocean_transformer/test_zeno_science_council_v3.py'
      - 'experiments/ocean_transformer/zeno_n4_wolfram_v3_gate.py'
      - 'experiments/ocean_transformer/test_zeno_n4_wolfram_v3_gate.py'
  workflow_dispatch:
    inputs:
      live_wolfram:
        description: 'Opt-in: four Zeno formula checks with Wolfram Alpha AppID, if configured'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: janus-zeno-temporal-001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-cpu-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify analytic Zeno, source-bound receipts and provider boundary
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/ocean_transformer -p 'test_zeno_temporal_001.py' -v
          python -m unittest discover -s experiments/ocean_transformer -p 'test_beetle_wolfram_readonly_gate.py' -v
          python -m unittest discover -s experiments/ocean_transformer -p 'test_wolfram_v2_registry_gate.py' -v
          python -m unittest discover -s experiments/ocean_transformer -p 'test_zeno_science_council_v3.py' -v
          python -m unittest discover -s experiments/ocean_transformer -p 'test_zeno_n4_wolfram_v3_gate.py' -v
      - name: Freeze CPU Zeno probabilities and SVG curve
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/zeno_temporal_001.py \
            --output artifacts/zeno_probabilities.json \
            --chart artifacts/zeno_survival_curve.svg
      - name: Freeze three different quantum observables and basis-choice no-signalling control
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/zeno_science_council_v3.py \
            --output artifacts/zeno_science_council_v3.json
      - name: Commit synthetic early receiver output before generating late choice
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/zeno_retro_control.py receiver \
            --output artifacts/early_receiver_precommit.json
      - name: Generate independent later random-choice control
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/zeno_retro_control.py sender \
            --receiver artifacts/early_receiver_precommit.json \
            --output artifacts/late_choice_precommit.json
      - name: Assess full raw data without postselection
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/zeno_retro_control.py assess \
            --receiver artifacts/early_receiver_precommit.json \
            --sender artifacts/late_choice_precommit.json \
            --output artifacts/retro_negative_control.json
      - name: Offline-first Wolfram Alpha formula attestation
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/zeno_wolfram_bridge.py \
            --mode offline --output artifacts/wolfram_zeno_offline.json
      - name: Read source-bound Beetle Wolfram math verdict (GitHub only; no provider request)
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/beetle_wolfram_readonly_gate.py \
            --output artifacts/beetle_wolfram_math_gate.json
      - name: Read source-bound Wolfram MCP V2 math record from Meta Registry
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/wolfram_v2_registry_gate.py \
            --output artifacts/wolfram_mcp_registry_v2_gate.json
      - name: Verify independent N4 Wolfram MCP V3 receipt (read only)
        run: |
          set -euo pipefail
          python experiments/ocean_transformer/zeno_n4_wolfram_v3_gate.py \
            --output artifacts/zeno_n4_wolfram_v3_gate.json
      - name: Optional four LIVE Wolfram Alpha checks (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_wolfram }}
        env:
          WOLFRAM_ALPHA_APPID: ${{ secrets.WOLFRAM_ALPHA_APPID }}
        run: |
          set -euo pipefail
          test -n "$WOLFRAM_ALPHA_APPID" || { echo 'WOLFRAM_ALPHA_APPID_REQUIRED_IN_ACTIONS_SECRETS'; exit 1; }
          python experiments/ocean_transformer/zeno_wolfram_bridge.py \
            --mode live --output artifacts/wolfram_zeno_live.json
      - name: Link immutable evidence and source commit to bounded science verdict
        env:
          SOURCE_SHA: ${{ github.sha }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("artifacts")
          files = sorted(path for path in root.iterdir() if path.is_file())
          digests = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          z = json.loads((root/"zeno_probabilities.json").read_text())
          science_v3 = json.loads((root/"zeno_science_council_v3.json").read_text())
          n4_external_v3 = json.loads((root/"zeno_n4_wolfram_v3_gate.json").read_text())
          retro = json.loads((root/"retro_negative_control.json").read_text())
          beetle = json.loads((root/"beetle_wolfram_math_gate.json").read_text())
          wolfram_v2 = json.loads((root/"wolfram_mcp_registry_v2_gate.json").read_text())
          wolfram = json.loads((root/"wolfram_zeno_offline.json").read_text())
          live_path = root/"wolfram_zeno_live.json"
          if live_path.exists():
              wolfram = json.loads(live_path.read_text())
          assert z["status"] == "STANDARD_QM_CPU_REFERENCE_ONLY"
          assert science_v3["logic"]["no_signalling"] == "PASS_UNCONDITIONAL_EQUAL_0_5"
          assert science_v3["wolfram"]["new_cases_remote_checked"] == 0
          assert science_v3["claims"]["physical_retrocausality_proven"] is False
          assert n4_external_v3["physical_retrocausal_channel_proven"] is False
          assert n4_external_v3["provider_calls_by_ocean"] == 0
          assert n4_external_v3["production_model_weights_modified"] is False
          assert retro["n"] == 2048
          assert beetle["physical_retrocausal_channel_proven"] is False
          assert beetle["wolfram_provider_called_by_this_job"] is False
          assert wolfram_v2["provider_direct_calls_by_ocean"] == 0
          assert wolfram_v2["physical_retrocausal_signal_verified"] is False
          assert retro["sampling"]["same_runner_not_independent_external_sender"] is True
          assert retro["negative_control"]["postselection_allowed_for_primary_test"] is False
          assert wolfram["proof_of_retrocausality"] is False
          assert all(not z["scope"][k] for k in (
              "real_physical_measurement_performed",
              "physical_retrocausality_proven",
              "forced_collapse_outcome"))
          report = {
              "experiment_id": "JANUS-ZENO-TEMPORAL-001",
              "schema": "janus.ocean.zeno_gate_summary.v1",
              "git_source_sha": os.environ["SOURCE_SHA"],
              "github_actions_run_id": os.environ["ACTIONS_RUN_ID"],
              "stage": "DEVELOPMENT_ONLY",
              "evidence_sha256": digests,
              "cpu_zeno": "PASS_ANALYTIC_REFERENCE",
              "cpu_no_signalling_v3": science_v3["logic"]["no_signalling"],
              "cpu_postselection_trap": science_v3["logic"]["postselection_trap"],
              "new_math_reference_cases": len(science_v3["analytic_crosschecks"]),
              "new_wolfram_live_calls": 0,
              "beetle_n4_external_math": n4_external_v3["status"],
              "beetle_n4_is_physics_proof": False,
              "retro_control": "SAME_RUNNER_NEGATIVE_CONTROL_ONLY",
              "retrosignal_confirmed": False,
              "wolfram_alpha": wolfram["status"],
              "beetle_keyless_wolfram_math": beetle["status"],
              "wolfram_mcp_registry_v2_arithmetic": wolfram_v2["status"],
              "wolfram_v2_is_independent_physics_evidence": False,
              "beetle_math_is_external_lab_evidence": False,
              "external_sender_verified": False,
              "production_model_promoted": False,
          }
          (root/"zeno_gate_summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## JANUS-ZENO-TEMPORAL-001\n\n")
              f.write("- CPU Zeno: **analytical reference PASS**\n")
              f.write("- Bell no-signalling v3: **"+science_v3["logic"]["no_signalling"]+"**\n")
              f.write("- Postselection artifact: **NOT A SIGNAL**\n")
              f.write("- New formulas: **3 offline analytic cases; 0 provider calls**\n")
              f.write("- Verified external N4 math: **"+n4_external_v3["status"]+"**\n")
              f.write("- Wolfram Alpha direct API: **"+wolfram["status"]+"**\n")
              f.write("- Beetle keyless MCP v1: **"+beetle["status"]+"**\n")
              f.write("- Wolfram MCP verified V2 Meta Registry record: **"+wolfram_v2["status"]+"**\n")
              f.write("- Raw late-choice match rate: **"+
                      str(round(100*retro["raw_accuracy"],3))+"%**\n")
              f.write("- Independent physical retrocausality: **NOT TESTED**\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-zeno-temporal-001
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
