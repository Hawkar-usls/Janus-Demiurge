name: Slime Relation Forest Router v3

on:
  push:
    paths:
      - 'models/slime/slime_semantic_candidate_router.py'
      - 'models/slime/slime_semantic_candidate_router_v2.py'
      - 'models/slime/slime_semantic_candidate_router_v3.py'
      - '.github/workflows/slime-relation-forest-router-v3.yml'
  pull_request:
    paths:
      - 'models/slime/slime_semantic_candidate_router.py'
      - 'models/slime/slime_semantic_candidate_router_v2.py'
      - 'models/slime/slime_semantic_candidate_router_v3.py'
      - '.github/workflows/slime-relation-forest-router-v3.yml'

permissions:
  contents: read

jobs:
  candidate-generator-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Slime semantic routers
        run: |
          python -m py_compile models/slime/slime_semantic_candidate_router.py
          python -m py_compile models/slime/slime_semantic_candidate_router_v2.py
          python -m py_compile models/slime/slime_semantic_candidate_router_v3.py
      - name: Run v3 self-test
        run: python models/slime/slime_semantic_candidate_router_v3.py
      - name: Verify generator-verifier firewall
        run: |
          python - <<'PY'
          import inspect
          from models.slime.slime_semantic_candidate_router_v3 import SlimeRelationForestCandidateRouter
          params=list(inspect.signature(SlimeRelationForestCandidateRouter.generate_manifest).parameters)
          assert params==['self','clauses'], params
          source=inspect.getsource(SlimeRelationForestCandidateRouter.generate_manifest)
          for token in ['assignment_signatures(', 'ps_cut_signatures(', 'truth_table(', 'solve_sat(', 'sat_oracle(']:
              assert token not in source, token
          m=SlimeRelationForestCandidateRouter().generate_manifest(((1,2,3),(-1,2,4),(1,-3,4)))
          assert m.artifact_id=='JANUS-SLIME-SEMANTIC-CANDIDATE-MANIFEST-V3'
          assert len(m.candidates)==6
          assert m.candidates[-1].name=='SLIME_RELATION_FOREST_PRESSURE'
          assert m.exact_ps_width_computed_inside_generator is False
          assert m.sat_oracle_used is False
          theorem=m.feature_certificate['relation_forest_theorem']
          assert theorem['assignment_independent'] is True
          assert theorem['truth_table_free'] is True
          assert theorem['forest_count_exact_by_tree_dp'] is True
          print('SLIME_RELATION_FOREST_V3_FIREWALL = PASS')
          print('MANIFEST_SHA256 =',m.manifest_sha256)
          print('TOTAL_GENERATION_OPS =',m.total_generation_ops)
          PY
      - name: Claim ceiling
        run: |
          echo 'RELATION_FOREST_CAP = CERTIFIED UPPER BOUND ONLY'
          echo 'SLIME_V3_PROPOSAL != DECOMPOSITION_PROOF'
          echo 'FINITE_SELFTEST != UNIVERSAL_COMPLETENESS'
          echo 'P_VS_NP = OPEN'
