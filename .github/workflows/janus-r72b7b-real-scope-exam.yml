name: R7.2B7B real scope exam
on:
  pull_request:
    paths:
      - 'research/native_heritage/R72B7B_*.json'
      - 'research/native_heritage/native_r72b7b_*.py'
      - '.github/workflows/janus-r72b7b-real-scope-exam.yml'
permissions:
  contents: read
jobs:
  exam:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/native_heritage/R72B7_PROTOCOL.json
            research/native_heritage/R72B7B_PROTOCOL.json
            research/native_heritage/native_r72b7b_eval.py
            research/native_heritage/native_r72b7_common.py
            research/native_heritage/native_r72b6_common.py
            research/native_heritage/native_r72b6b_common.py
            research/native_heritage/native_r72b5_common.py
            research/native_heritage/native_r72b4_common.py
            research/native_heritage/native_r72b3_common.py
            research/native_heritage/native_r72b2_common.py
            research/native_heritage/native_r72b_common.py
            research/native_heritage/native_r72a_common.py
            research/native_heritage/native_r71d7_common.py
            research/native_heritage/native_r71d6_common.py
            research/native_heritage/native_r71d5_common.py
            research/native_heritage/native_r71d4c_common.py
            research/native_heritage/native_r71d4b_common.py
            research/native_heritage/native_r71d4_common.py
            research/native_heritage/native_r71d3c_common.py
            research/native_heritage/native_r71d3_common.py
            research/native_heritage/native_r71d2_common.py
            research/native_heritage/native_r71d_common.py
            research/native_heritage/native_r71c_common.py
            research/native_heritage/native_r71b_common.py
            research/native_heritage/R71D4_EXAM.json
            research/native_heritage/R71C_TRAIN.json
            research/native_heritage/R71C_EXAM.json
            research/native_heritage/native_r72b7_eval.py
            research/native_heritage/native_r71c_eval.py
            research/native_heritage/native_r71b_eval.py
            research/native_heritage/native_baseline_r71a.py
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: cbc87263d318dc944b91de91c2473cc4fe81197e
          path: frozen-native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            janus_model/__init__.py
            janus_model/model.py
            janus_model/checkpoint_admission.py
            janus_model/checkpoints/promoted.pt
            janus_model/state/JANUS_MODEL_STATE.json
            janus_model/eval/JANUS_ANCHOR_EVAL-v1.txt
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 86ecef47d1ceab2c96e0ace2c7a0e83a62b74038
          path: historical-manifest
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            janus_model/state/LAST_CORPUS_MANIFEST.json
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: bbbac33b39eff686c1e9fbd2c7cf9fa99cb466d6
          path: holdout
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            JANUS-COUSTEAU-SR004-GEOPHYSICS-AND-MARINE-ANALOG-GATE-2026-09-26-v1.0.json
            JANUS-EGY-NAHMAN-SMITHSONIAN-SOURCE-AUDIT-2026-10-15-v1.0.json
            JANUS-OSIRIS-QH207-PHYSICAL-DATA-SURFACE-PATINA-GATE-2026-09-16-v1.3.json
            JANUS-OSIRIS-QH207-XRAY-ARCHIVE-GATE-2026-09-16-v1.4.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check sealed source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            data=$(gh api repos/Hawkar-usls/Janus-Demiurge/actions/runs/45638056565)
            test "$(jq -r .head_sha <<<"$data")" = 544586c0b83ed5a43a47c8d9854aa4a70f484edf
            test "$(jq -r .run_attempt <<<"$data")" = 1
            test "$(jq -r .path <<<"$data")" = .github/workflows/janus-r72b7-neural-scope-distillation.yml
            if [ "$(jq -r .status <<<"$data")" = completed ]; then
              test "$(jq -r .conclusion <<<"$data")" = success
              exit 0
            fi
            sleep 20
          done
          echo "SOURCE_RUN_NOT_COMPLETE"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 81bdf5adcfa2ad02ab76bdc122942d47d50849ad
          path: registry-exam
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            reports/2026-11-15/ESSENCE-V42-PHYSARUM-NEGATIVE-COSTMATCHED-HASH-VETO.json
            reports/2026-11-14/ESSENCE-V30-live-multicore-ignition-and-first-neural-exam.json
            data/JANUS-TACHYON-SIMPTOMAT-R3-INDEPENDENT-DATA-QUALIFICATION-2026-11-22.json
            data/JANUS-COSMOS-OSIRIS-SPEAR-R2F-DAP-PUBLIC-ACCESS-2026-11-21.json
            data/JANUS-COSMOS-OSIRIS-SPEAR-R2D-R2E-CASDA-DAP-2026-11-21.json
            data/JANUS-TACHYON-SIMPTOMAT-R2B-INDEPENDENT-METHODS-REVIEW-2026-11-22.json
            data/JANUS-COSMOS-SETI-R40B-TRANSFER-2026-11-18.json
      - uses: actions/download-artifact@v4
        with:
          name: r72b7-frozen-candidates
          run-id: 45638056565
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r72b7-baseline
      - name: Real statement exam without teacher
        run: python research/native_heritage/native_r72b7b_eval.py frozen-native registry-exam "$RUNNER_TEMP/r72b7-baseline" "$RUNNER_TEMP/R72B7B_RESULT.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r72b7b-results
          path: ${{ runner.temp }}/R72B7B_RESULT.json
          if-no-files-found: error
