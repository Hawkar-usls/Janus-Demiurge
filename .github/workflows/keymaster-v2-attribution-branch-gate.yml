name: Keymaster v2 Attribution Branch Gate

on:
  push:
    branches:
      - feature/keymaster-v2-attribution-ablation-8x

permissions:
  contents: read

jobs:
  keymaster-v2-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native runtime
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile v2 kernel
        run: python -m py_compile janus_model/keymaster.py janus_model/corpus.py janus_model/attribution.py janus_model/train_registry.py

      - name: Run v2 adversarial unit gates
        run: python -m unittest -v tests/test_janus_keymaster.py tests/test_janus_attribution.py

      - name: Fetch world memory
        run: |
          mkdir -p runtime
          git clone --depth 1 https://github.com/Hawkar-usls/janus-meta-registry.git runtime/meta-registry

      - name: Build live exact 8-of-8 corpus
        run: |
          python -m janus_model.corpus \
            --registry runtime/meta-registry \
            --out runtime/corpus \
            --max-train-bytes 2000000 \
            --max-holdout-bytes 300000 | tee runtime/corpus-proof.txt

      - name: Verify live eight contributor manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('runtime/keymaster/manifest.json'))
          assert m['status']=='READY_8_OF_8'
          assert m['contributor_count']==8
          assert m['required_contributor_count']==8
          assert m['training_only'] is True
          assert m['adaptive_holdout_inclusion'] is False
          assert m['frozen_anchor_inclusion'] is False
          assert m['authority_delta']==0
          assert all(int(x['contributed_bytes'])>0 for x in m['contributors'])
          assert {x['repository'] for x in m['contributors']}=={
            'Hawkar-usls/TOPA','Hawkar-usls/tranception','Hawkar-usls/janus-lapis',
            'Hawkar-usls/janus-io-public','Hawkar-usls/Fast-CAT-SHAiTan',
            'Hawkar-usls/Janus-Fundamentum','Hawkar-usls/Demi_Head','Hawkar-usls/aura-oracle-tg'
          }
          assert sum(x['cohort']=='CORE_5' for x in m['contributors'])==5
          assert sum(x['cohort']=='EXTENDED_3' for x in m['contributors'])==3
          print('JANUS_KEYMASTER_V2_LIVE_8_OF_8=PASS')
          PY

      - name: Run bounded 17-variant attribution proof
        run: |
          python -m janus_model.attribution \
            --registry-train runtime/corpus/registry_train.txt \
            --holdout runtime/corpus/holdout.txt \
            --keymaster-dir runtime/keymaster \
            --corpus-manifest runtime/corpus/corpus_manifest.json \
            --incumbent janus_model/checkpoints/promoted.pt \
            --out runtime/keymaster-attribution.json \
            --steps 16 \
            --batch-size 8 \
            --lr 0.0003 \
            --seed 7331 | tee runtime/attribution-proof.txt

      - name: Verify 17-variant ledger firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('runtime/keymaster-attribution.json'))
          assert x['status']=='COMPLETE_SINGLE_SEED_DIAGNOSTIC'
          assert x['variant_count']==17
          assert len(x['attribution'])==8
          assert sum(v['kind']=='FULL_LEAVE_ONE_OUT' for v in x['variants'])==8
          assert sum(v['kind']=='CORE_LEAVE_ONE_OUT' for v in x['variants'])==5
          assert x['claim_ceiling']['single_seed_establishes_causality'] is False
          assert x['claim_ceiling']['automatic_contributor_removal'] is False
          assert x['claim_ceiling']['automatic_weighting_change'] is False
          assert x['claim_ceiling']['authority_delta']==0
          print('JANUS_KEYMASTER_V2_ATTRIBUTION_LEDGER=PASS')
          PY

      - name: Upload live proof
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-v2-live-proof-${{ github.run_id }}
          path: |
            runtime/corpus/corpus_manifest.json
            runtime/keymaster/manifest.json
            runtime/keymaster-attribution.json
            runtime/corpus-proof.txt
            runtime/attribution-proof.txt
          if-no-files-found: error
          retention-days: 14
