name: TRUMP Genesis Lane 3 Elbow Third Strict

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trump/packets/GENESIS_LANE3_ELBOW_THIRD_STRICT_TISSUE_DOMAIN_EVIDENCE_v1.json'
      - '.github/workflows/trump-genesis-lane3-elbow-third-strict.yml'
      - 'trump/physarius_final_gate.py'
      - 'trump/PHYSARIUS_FINAL_ADMISSION_CONTRACT_v1.json'
      - 'trump/TRUMP_MANIFEST.json'

permissions:
  contents: read

jobs:
  trump-final-domain-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run TRUMP final domain evidence gate
        run: |
          mkdir -p out/trump-elbow
          python trump/physarius_final_gate.py \
            --packet trump/packets/GENESIS_LANE3_ELBOW_THIRD_STRICT_TISSUE_DOMAIN_EVIDENCE_v1.json \
            --out out/trump-elbow/receipt.json
      - name: Assert fail-closed ceiling and domain admission
        run: |
          python - <<'PY'
          import json
          r=json.load(open('out/trump-elbow/receipt.json'))
          assert r['stage']=='DOMAIN_EVIDENCE_CANDIDATE'
          assert r['admitted'] is True
          assert r['verdict']=='DOMAIN_EVIDENCE_ACCEPTED_NO_PROMOTION'
          assert r['next_authority']=='JANUS_GENESIS_DOMAIN_LANE_ONLY'
          assert r['scientific_claim_promoted'] is False
          assert r['proof_promoted'] is False
          assert r['external_effect_authorized'] is False
          assert r['physical_effect_authorized'] is False
          assert r['missing']==[] and r['unknown']==[] and r['violations']==[]
          print('TRUMP_ELBOW_THIRD_STRICT_DOMAIN_ADMISSION_PASS',r['receipt_sha256'])
          PY
      - name: Upload TRUMP elbow receipt
        uses: actions/upload-artifact@v4
        with:
          name: trump-elbow-third-strict-${{ github.run_id }}
          path: out/trump-elbow/receipt.json
          retention-days: 30
