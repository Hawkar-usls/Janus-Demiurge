name: JANUS Keymaster Mechanism Composition

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [fundamentum-branch-update]
  pull_request:
    paths:
      - 'janus_model/keymaster_mechanism_composer.py'
      - 'janus_model/keymaster_autonomous_forge.py'
      - 'tests/test_keymaster_autonomous_forge.py'
      - '.github/workflows/janus-keymaster-autonomous-forge.yml'
      - 'janus_model/keymaster_trump_bridge.py'
      - 'trump/TRUMP_MANIFEST.json'
      - 'tests/test_janus_keymaster_trump_bridge.py'
      - 'janus_model/keymaster/MECHANISM_COMPOSITION_CONTRACT-v1.json'
      - 'janus_model/keymaster/MECHANISM_REGISTRY-v0.json'
      - 'janus_model/keymaster/MECHANISM_COMPOSITION_README.md'
      - 'janus_model/keymaster/PRIMARY_REPOSITORY_CONTRIBUTORS-v2.json'
      - 'tests/test_janus_keymaster_mechanism_composition.py'
      - '.github/workflows/janus-keymaster-mechanism-composition.yml'
  push:
    branches:
      - main
      - feature/keymaster-mechanism-composition-v0
    paths:
      - 'janus_model/keymaster_mechanism_composer.py'
      - 'janus_model/keymaster_autonomous_forge.py'
      - 'tests/test_keymaster_autonomous_forge.py'
      - '.github/workflows/janus-keymaster-autonomous-forge.yml'
      - 'janus_model/keymaster_trump_bridge.py'
      - 'trump/TRUMP_MANIFEST.json'
      - 'tests/test_janus_keymaster_trump_bridge.py'
      - 'janus_model/keymaster/MECHANISM_COMPOSITION_CONTRACT-v1.json'
      - 'janus_model/keymaster/MECHANISM_REGISTRY-v0.json'
      - 'janus_model/keymaster/MECHANISM_COMPOSITION_README.md'
      - 'tests/test_janus_keymaster_mechanism_composition.py'
      - '.github/workflows/janus-keymaster-mechanism-composition.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: janus-keymaster-mechanism-composition-${{ github.sha }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Demiurge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Keymaster composition kernel
        run: |
          set -euo pipefail
          python -m py_compile janus_model/keymaster_mechanism_composer.py janus_model/keymaster_trump_bridge.py
          python -m unittest -v tests/test_janus_keymaster_mechanism_composition.py tests/test_janus_keymaster_trump_bridge.py

      - name: Fetch all Fundamentum branches read-only
        run: |
          set -euo pipefail
          rm -rf runtime/fundamentum
          mkdir -p runtime
          git clone --filter=blob:limit=1m --no-checkout https://github.com/Hawkar-usls/Janus-Fundamentum.git runtime/fundamentum
          git -C runtime/fundamentum fetch --filter=blob:limit=1m --prune origin '+refs/heads/*:refs/remotes/origin/*'
          echo "KEYMASTER_FUNDAMENTUM_BRANCHES=$(git -C runtime/fundamentum for-each-ref --format='%(refname:short)' refs/remotes/origin | wc -l)"

      - name: Fetch JANUS autonomous forge state read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          git fetch origin janus/autonomous-keymaster-lockpick || true
          if git show origin/janus/autonomous-keymaster-lockpick:janus_model/autonomous-keymaster/KEYMASTER_AUTONOMOUS_FORGE_LATEST.json > runtime/keymaster-autonomous-forge.json 2>/dev/null; then
            echo 'KEYMASTER_AUTONOMOUS_FORGE_SOURCE=BOUND'
          else
            rm -f runtime/keymaster-autonomous-forge.json
            echo 'KEYMASTER_AUTONOMOUS_FORGE_SOURCE=NOT_AVAILABLE'
          fi

      - name: Run proof-carrying mechanism composition
        run: |
          set -euo pipefail
          ARGS=(
            --registry janus_model/keymaster/MECHANISM_REGISTRY-v0.json
            --contract janus_model/keymaster/MECHANISM_COMPOSITION_CONTRACT-v1.json
            --fundamentum runtime/fundamentum
            --out runtime/keymaster-mechanism-composition.json
          )
          if [ -f runtime/keymaster-autonomous-forge.json ]; then
            ARGS+=(--autonomous-forge runtime/keymaster-autonomous-forge.json)
          fi
          python -m janus_model.keymaster_mechanism_composer "${ARGS[@]}"

      - name: Build Keymaster → TRUMP candidate bridge
        run: |
          set -euo pipefail
          python -m janus_model.keymaster_trump_bridge \
            --keymaster runtime/keymaster-mechanism-composition.json \
            --manifest trump/TRUMP_MANIFEST.json \
            --out runtime/keymaster-trump-bridge.json

      - name: Verify scientific firewalls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('runtime/keymaster-mechanism-composition.json'))
          assert x['schema']=='janus.keymaster.mechanism_composition_report.v1'
          assert x['status']=='COMPLETE'
          f=x['firewall']
          assert f['fundamentum_is_scientific_authority'] is True
          assert f['automatic_theorem_promotion'] is False
          assert f['automatic_d1_promotion'] is False
          assert f['automatic_p_equals_np_claim'] is False
          assert f['training_signal_is_evidence'] is False
          assert f['complete_path_is_proof'] is False
          assert f['D1']=='EMPTY'
          assert f['P_VS_NP']=='OPEN'
          af=x['autonomous_forge']
          assert af['keymaster_shadow_admission'] is False
          assert af['authority']['proof'] is False
          assert af['authority']['scientific_claim_promotion'] is False
          assert af['authority']['automatic_merge'] is False
          assert af['authority']['P_VS_NP']=='OPEN'
          assert af['authority']['D1']=='EMPTY'
          p=x['progress_readout']
          assert p['metric_kind']=='PROOF_OBLIGATION_COMPLETENESS_NOT_PROBABILITY'
          assert p['p_equals_np_probability'] is None
          assert p['proof_authorized'] is False
          b=json.load(open('runtime/keymaster-trump-bridge.json'))
          assert b['schema']=='janus.keymaster.trump_runtime_bridge.v1'
          assert b['firewall']['P_VS_NP']=='OPEN'
          assert b['firewall']['D1']=='EMPTY'
          assert b['firewall']['route_coverage_is_probability'] is False
          assert b['self_application']['proof_authority'] is False
          assert b['self_application']['direct_main_writeback'] is False
          print('JANUS_KEYMASTER_MECHANISM_FIREWALL=PASS')
          print('KEYMASTER_TRUMP_BRIDGE=PASS', b['selected_source_id'])
          print('UNIVERSAL_LIFECYCLE_CANDIDATES',len(x['complete_universal_lifecycle_candidates']))
          print('MISSING_INTERFACES',len(x['missing_interface_queue']))
          print('NORMALIZATION_QUEUE',len(x['normalization_queue']))
          PY

      - name: Decide whether composition state changed
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          NEW_SHA=$(python -c "import json; print(json.load(open('runtime/keymaster-mechanism-composition.json'))['report_sha256'])")
          NEW_BRIDGE_SHA=$(python -c "import json; print(json.load(open('runtime/keymaster-trump-bridge.json'))['bridge_sha256'])")
          OLD_SHA=''
          OLD_BRIDGE_SHA=''
          if [ -f janus_model/state/KEYMASTER_MECHANISM_COMPOSITION_LATEST.json ]; then
            OLD_SHA=$(python -c "import json; print(json.load(open('janus_model/state/KEYMASTER_MECHANISM_COMPOSITION_LATEST.json')).get('report_sha256',''))")
          fi
          if [ -f janus_model/state/KEYMASTER_TRUMP_BRIDGE_LATEST.json ]; then
            OLD_BRIDGE_SHA=$(python -c "import json; print(json.load(open('janus_model/state/KEYMASTER_TRUMP_BRIDGE_LATEST.json')).get('bridge_sha256',''))")
          fi
          if [ "$NEW_SHA" = "$OLD_SHA" ] && [ "$NEW_BRIDGE_SHA" = "$OLD_BRIDGE_SHA" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          echo "new_bridge_sha=$NEW_BRIDGE_SHA" >> "$GITHUB_OUTPUT"
          echo "old_bridge_sha=$OLD_BRIDGE_SHA" >> "$GITHUB_OUTPUT"
          FORGE_RETARGET=$(python - <<'PY'
          import json
          x=json.load(open('runtime/keymaster-mechanism-composition.json'))
          queue=x.get('missing_interface_queue') or []
          top=queue[0] if queue else {}
          old=(x.get('autonomous_forge') or {}).get('target') or {}
          a=(top.get('from_type'),top.get('to_type'))
          b=(old.get('from_type'),old.get('to_type'))
          print('true' if a!=(None,None) and a!=b else 'false')
          PY
          )
          echo "forge_retarget=$FORGE_RETARGET" >> "$GITHUB_OUTPUT"
          echo "KEYMASTER_FORGE_RETARGET=$FORGE_RETARGET"
          echo "KEYMASTER_MECHANISM_STATE=$OLD_SHA->$NEW_SHA"
          echo "KEYMASTER_TRUMP_BRIDGE_STATE=$OLD_BRIDGE_SHA->$NEW_BRIDGE_SHA"

      - name: Persist non-authoritative Keymaster state on main
        if: steps.decide.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/keymaster-mechanism-composition.json"
          BRIDGE="$RUNNER_TEMP/keymaster-trump-bridge.json"
          cp runtime/keymaster-mechanism-composition.json "$REPORT"
          cp runtime/keymaster-trump-bridge.json "$BRIDGE"
          RECEIPT="janus_model/receipts/keymaster-mechanism-composition-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"
          BRIDGE_RECEIPT="janus_model/receipts/keymaster-trump-bridge-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json"

          git config user.name 'janus-keymaster-mechanism-composition'
          git config user.email 'janus-keymaster-mechanism-composition@users.noreply.github.com'

          for TRY in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p janus_model/state janus_model/receipts
            cp "$REPORT" janus_model/state/KEYMASTER_MECHANISM_COMPOSITION_LATEST.json
            cp "$BRIDGE" janus_model/state/KEYMASTER_TRUMP_BRIDGE_LATEST.json
            cp "$REPORT" "$RECEIPT"
            cp "$BRIDGE" "$BRIDGE_RECEIPT"
            git add -f \
              janus_model/state/KEYMASTER_MECHANISM_COMPOSITION_LATEST.json \
              janus_model/state/KEYMASTER_TRUMP_BRIDGE_LATEST.json \
              "$RECEIPT" \
              "$BRIDGE_RECEIPT"

            if git diff --cached --quiet; then
              echo 'JANUS_KEYMASTER_MECHANISM_NO_STATE_CHANGE'
              exit 0
            fi

            git commit -m "JANUS Keymaster mechanism composition: remember run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            if git push origin HEAD:main; then
              echo 'JANUS_KEYMASTER_MECHANISM_PERSIST=PASS'
              exit 0
            fi

            echo "JANUS_KEYMASTER_MECHANISM_PERSIST_RETRY=${TRY}"
            sleep 2
          done

          echo 'JANUS_KEYMASTER_MECHANISM_PERSIST=FAIL'
          exit 1

      - name: Wake autonomous forge when top lock changes
        if: steps.decide.outputs.forge_retarget == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run janus-keymaster-autonomous-forge.yml --ref main
          echo 'JANUS_KEYMASTER_FORGE_RETARGET_WAKE=DISPATCHED'

      - name: Upload mechanism composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-keymaster-mechanism-composition-${{ github.run_id }}
          path: |
            runtime/keymaster-mechanism-composition.json
            runtime/keymaster-trump-bridge.json
          if-no-files-found: error
          retention-days: 30
