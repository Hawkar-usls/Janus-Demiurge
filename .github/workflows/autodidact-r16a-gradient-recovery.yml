name: AUTODIDACT R1.6A frozen gradient recovery
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/autodidact-r16a-gradient-recovery.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: autodidact-r16a-gradient
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'Hawkar-usls/Janus-Demiurge' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/autodidact-r16a-gradient-recovery-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fc4293c972c231e9b06dd286a74c840b69131baa
          path: brain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 106463de92f57fb21785c59146b63e3013aaaa62
          path: registry
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Demiurge
          run-id: 45886857861
          name: autodidact-r15-evidence-only
          path: question-evidence
      - name: Frozen checkpoint gradient measurement (metrics only)
        working-directory: brain
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,random,subprocess,math,statistics,time
          from pathlib import Path
          import torch
          import torch.nn.functional as F
          from janus_model.corpus import scrub
          from janus_model.train_registry import batch_from,eval_loss,load_checkpoint
          from janus_model.model import ByteTokenizer
          def sha(b): return hashlib.sha256(b).hexdigest()
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          torch.set_num_threads(2)
          torch.set_num_interop_threads(1)
          root=Path('../registry').resolve()
          parent=Path('janus_model/checkpoints/promoted.pt')
          parent_sha='06d7e6228ca9aef2dc58eb55fe1c805aa3b66e4f8fb90b0e946ce6af47b1a662'
          require(sha(parent.read_bytes())==parent_sha,'PARENT_HASH')
          mp=Path('janus_model/state/LAST_CORPUS_MANIFEST.json')
          m=json.loads(mp.read_text())
          commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          require(commit==m['source_commit']=='106463de92f57fb21785c59146b63e3013aaaa62','SOURCE_IDENTITY')
          # Historical train-labeled data only; no production anchor or holdout.
          # Hash buckets are proxies for adaptation and retention, not chronology.
          # Document hashes are disjoint; near-duplicate semantics and parent exposure remain possible.
          keys=['adapt_fit','adapt_eval','retain_fit','retain_eval']
          docs={k:[] for k in keys}; ids={k:[] for k in keys}
          protected={r['sha256'] for r in m['records'] if r['split']=='holdout'}
          seen=set()
          for row in sorted(m['records'],key=lambda x:x['path']):
              if row['split']!='train': continue
              h=row['sha256']
              require(h not in protected and int(h[:8],16)%10!=0,'PROTECTED_SOURCE')
              if h in seen: continue
              seen.add(h)
              p=root/row['path']
              require(p.resolve().is_relative_to(root) and p.is_file() and not p.is_symlink(),'SOURCE_PATH')
              raw=p.read_bytes()
              require(sha(raw)==h and len(raw)==row['bytes'],'SOURCE_BYTES')
              text=scrub(raw.decode('utf-8',errors='replace')).encode()[:65536].decode('utf-8',errors='ignore')
              # Fixed 40/10/40/10 partition by independent salted content hash.
              bucket=int(sha(('r12-preservation:'+h).encode())[:8],16)%10
              key=keys[0 if bucket<4 else 1 if bucket==4 else 2 if bucket<9 else 3]
              docs[key].append(text); ids[key].append(h)
          require(sum(map(len,ids.values()))==len(seen),'DUPLICATE')
          data={k:'\n\n'.join(v) for k,v in docs.items()}
          streams={k:torch.tensor(ByteTokenizer.encode(v,bos=True,eos=True),dtype=torch.long) for k,v in data.items()}
          require(min(map(len,ids.values()))>=10 and min(x.numel() for x in streams.values())>10000,'DATA_TOO_SMALL')
          teacher,_=load_checkpoint(parent,expected_sha256=parent_sha)
          teacher.eval()
          question_raw=Path('../question-evidence/r15-report.json').read_bytes()
          question=json.loads(question_raw)
          require(question['schema']=='janus.autodidact.r15.question_engine.v1' and question['root']=='1f84a30d18544bba266bbfb08c6db4674b53375a8065fffdda6066b5c59ac350','QUESTION_IDENTITY')
          require(question['proposal']['next_question']=='GRADIENT_COSINE' and question['captain']=='ADMIT_REPORT_ONLY' and question['proposal']['training_allowed'] is False,'QUESTION_SCOPE')
          require(question['proposal']['ranking'][0]['fingerprint']=='b7052e63b171197e65b2930f7cf350d85157606de773090a63a5b3b90f436356','QUESTION_FINGERPRINT')
          require(question['scope']['parent_sha256']==parent_sha and question['scope']['registry_commit']==commit and question['scope']['seeds']==[27021,27022],'QUESTION_SOURCE')
          # Read-only autograd. No optimizer, no backward accumulation, no checkpoint output.
          params=dict(teacher.named_parameters())
          require(all(v.requires_grad for v in params.values()),'GRADIENT_PARAMS')
          # Hash logical tensor bytes directly via PyTorch, without NumPy or serialization metadata.
          def tensor_digest(state):
              h=hashlib.sha256()
              for k,v in sorted(state.items()):
                  t=v.detach().cpu().contiguous()
                  meta=json.dumps([k,str(t.dtype),list(t.shape)],separators=(',',':')).encode()
                  raw=bytes(t.reshape(-1).view(torch.uint8).tolist())
                  h.update(len(meta).to_bytes(8,'big')); h.update(meta)
                  h.update(len(raw).to_bytes(8,'big')); h.update(raw)
              return h.hexdigest()
          def state_digest(): return tensor_digest(teacher.state_dict())
          hash_control=torch.tensor([0.,1.],dtype=torch.float32)
          require(tensor_digest({'x':hash_control})==tensor_digest({'x':hash_control.clone()}),'HASH_STABLE')
          changed=hash_control.clone(); changed[0]=2.
          require(tensor_digest({'x':hash_control})!=tensor_digest({'x':changed}),'HASH_MUTATION')
          require(tensor_digest({'x':hash_control})!=tensor_digest({'x':hash_control.reshape(1,2)}),'HASH_SHAPE')
          require(tensor_digest({'x':hash_control})!=tensor_digest({'y':hash_control}),'HASH_NAME')
          before=state_digest()
          def family(name):
              if name.startswith('blocks.layers.'): return '.'.join(name.split('.')[:3])
              return name.split('.')[0]
          groups=sorted(set(family(k) for k in params))
          def gradient(stream,g):
              x,y=batch_from(stream,8,teacher.config.context_length,g)
              _,loss=teacher(x,y)
              gs=torch.autograd.grad(loss,tuple(params.values()),allow_unused=False)
              require(bool(torch.isfinite(loss)) and all(bool(torch.isfinite(v).all()) for v in gs),'NONFINITE')
              return {k:v.detach().flatten().double() for k,v in zip(params,gs)},float(loss.detach())
          def stats(a,b,names):
              aa=sum(float(torch.dot(a[k],a[k])) for k in names)
              bb=sum(float(torch.dot(b[k],b[k])) for k in names)
              ab=sum(float(torch.dot(a[k],b[k])) for k in names)
              na=math.sqrt(aa); nb=math.sqrt(bb)
              if na<=1e-12 or nb<=1e-12: return {'cosine':None,'norm_a':na,'norm_b':nb,'dot':ab}
              cosine=ab/(na*nb)
              require(math.isfinite(cosine) and abs(cosine)<=1+1e-10,'COSINE_RANGE')
              return {'cosine':max(-1.0,min(1.0,cosine)),'norm_a':na,'norm_b':nb,'dot':ab}
          def measure(a,b):
              return {'global':stats(a,b,list(params)),**{g:stats(a,b,[k for k in params if family(k)==g]) for g in groups}}
          # Analytic controls prove sign convention and explicit zero-norm handling.
          toy={'x':torch.tensor([1.,0.],dtype=torch.float64)}
          require(stats(toy,toy,['x'])['cosine']==1,'SELF_CONTROL')
          require(stats(toy,{'x':-toy['x']},['x'])['cosine']==-1,'OPPOSITE_CONTROL')
          require(stats(toy,{'x':torch.tensor([0.,1.],dtype=torch.float64)},['x'])['cosine']==0,'ORTHOGONAL_CONTROL')
          require(stats(toy,{'x':torch.zeros_like(toy['x'])},['x'])['cosine'] is None,'ZERO_CONTROL')
          seeds=[27021,27022]
          rows=[]; summaries=[]
          started=time.monotonic()
          def summarize(ms):
              cs=[x['cosine'] for x in ms if x['cosine'] is not None]
              return {'n':len(ms),'valid':len(cs),'zero_or_undefined':len(ms)-len(cs),'negative':sum(x<0 for x in cs),'positive':sum(x>0 for x in cs),'mean':statistics.mean(cs) if cs else None,'median':statistics.median(cs) if cs else None,'sd':statistics.stdev(cs) if len(cs)>1 else None,'min':min(cs) if cs else None,'max':max(cs) if cs else None,'mean_norm_a':statistics.mean(x['norm_a'] for x in ms),'mean_norm_b':statistics.mean(x['norm_b'] for x in ms)}
          for seed in seeds:
              generators=[torch.Generator().manual_seed(seed+offset) for offset in (1,2,101,102)]
              sum_a={k:torch.zeros(v.numel(),dtype=torch.float64) for k,v in params.items()}
              sum_b={k:torch.zeros_like(v) for k,v in sum_a.items()}
              seed_rows=[]
              for batch in range(16):
                  a,la=gradient(streams['adapt_fit'],generators[0])
                  b,lb=gradient(streams['retain_fit'],generators[1])
                  a2,_=gradient(streams['adapt_fit'],generators[2])
                  b2,_=gradient(streams['retain_fit'],generators[3])
                  for k in params:
                      sum_a[k].add_(a[k]/16); sum_b[k].add_(b[k]/16)
                  row={'seed':seed,'batch':batch,'adapt_loss':la,'retain_loss':lb,'cross':measure(a,b),'within_adapt':measure(a,a2),'within_retain':measure(b,b2)}
                  rows.append(row); seed_rows.append(row)
              summary={'seed':seed,'mean_gradient_cosine':measure(sum_a,sum_b),'comparisons':{kind:{group:summarize([r[kind][group] for r in seed_rows]) for group in ['global']+groups} for kind in ['cross','within_adapt','within_retain']}}
              summaries.append(summary)
              print('AUTODIDACT_R16A_SEED',json.dumps(summary,sort_keys=True,allow_nan=False),flush=True)
          cross=[r['cross']['global'] for r in rows]
          overall=summarize(cross)
          means=[s['mean_gradient_cosine']['global']['cosine'] for s in summaries]
          # Descriptive sign rule only; no significance claim, no causal inference.
          if overall['zero_or_undefined'] or any(x is None for x in means): decision='OPEN_UNDEFINED'
          elif all(x<0 for x in means) and all(s['comparisons']['cross']['global']['mean']<0 for s in summaries): decision='NEGATIVE_ALIGNMENT_OBSERVED'
          elif all(x>=0 for x in means) and all(s['comparisons']['cross']['global']['mean']>=0 for s in summaries): decision='NONNEGATIVE_ALIGNMENT_OBSERVED'
          else: decision='OPEN_MIXED_ALIGNMENT'
          require(state_digest()==before and sha(parent.read_bytes())==parent_sha,'PARENT_CHANGED')
          require(all(v.grad is None for v in params.values()),'GRADIENT_ACCUMULATION')
          result={'schema':'janus.autodidact.r16.gradient_conflict.v1','source_question_run':45886857861,'source_question_sha256':sha(question_raw),'question_fingerprint':question['proposal']['ranking'][0]['fingerprint'],'parent_sha256':parent_sha,'state_digest':before,'state_digest_method':'sha256_length_framed_name_dtype_shape_raw_torch_uint8_v1','hash_controls':4,'recovery_of_run':45887107643,'registry_commit':commit,'manifest_sha256':sha(mp.read_bytes()),'splits':{k:{'documents':len(ids[k]),'text_sha256':sha(data[k].encode()),'bytes':len(data[k].encode())} for k in keys},'mode':'eval dropout disabled, autograd enabled','batch_size':8,'batches_per_seed':16,'seeds':seeds,'parameter_groups':groups,'rows':rows,'seed_summaries':summaries,'overall_cross':overall,'decision':decision,'analytic_controls':4,'elapsed_seconds':time.monotonic()-started,'claim_ceiling':{'historical_proxy_cohorts':True,'causal_root_proven':False,'fresh_independent_exam':False,'weights_changed':False,'optimizer_steps':0,'checkpoint_exported':False,'production_changed':False,'training_authority':False,'promotion_authority':False}}
          out=Path(os.environ['RUNNER_TEMP'])/'autodidact-r16a.json'
          out.write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print('AUTODIDACT_R16A_RESULT',json.dumps({k:v for k,v in result.items() if k!='rows'},sort_keys=True,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autodidact-r16a-metrics-only
          path: ${{ runner.temp }}/autodidact-r16a.json
          if-no-files-found: error
          retention-days: 30
