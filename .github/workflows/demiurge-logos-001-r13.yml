name: Demiurge LOGOS 001 R1.3 - real instruments and strong witness without model promotion

on:
  pull_request:
    paths:
      - 'research/logos_001/r13_discover.py'
      - 'research/logos_001/demiurge_r13_adapter.py'
      - '.github/workflows/demiurge-logos-001-r13.yml'
  push:
    branches: [main]
    paths:
      - 'research/logos_001/r13_discover.py'
      - 'research/logos_001/demiurge_r13_adapter.py'
      - '.github/workflows/demiurge-logos-001-r13.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demiurge-logos-r13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  new-observation-proposals:
    name: Demiurge source-locked R1.3 TRAIN and VALIDATION candidate equations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 4615989f9cf0b6d30098a2d92f1114d7e4828bb9
          path: meta-registry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify byte-exact scientific module and unchanged R1.2 model grammar
        run: |
          cmp research/logos_001/r13_discover.py meta-registry/research/logos_001/r13_discover.py
          cmp research/logos_001/r12_discover.py meta-registry/research/logos_001/r12_discover.py
      - name: Prepare TRAIN and VALIDATION only from source-locked NIST datasets
        run: python meta-registry/research/logos_001/r13_data.py --out /tmp/logos-r13-train-validation.json
      - name: Demiurge research hypothesis proposals; reproducibility check
        run: |
          python research/logos_001/demiurge_r13_adapter.py --input /tmp/logos-r13-train-validation.json --out /tmp/demiurge-r13-proposals.json
          python research/logos_001/demiurge_r13_adapter.py --input /tmp/logos-r13-train-validation.json --out /tmp/demiurge-r13-replay.json
          cmp /tmp/demiurge-r13-proposals.json /tmp/demiurge-r13-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: demiurge-r13-scientific-proposals
          path: /tmp/demiurge-r13-proposals.json
          retention-days: 14
          if-no-files-found: error

  strong-independent-scientific-witness:
    name: Independent NIST strong baseline witness must reject model promotion
    needs: new-observation-proposals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 4615989f9cf0b6d30098a2d92f1114d7e4828bb9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent pinned scientific baselines
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.14.1 scikit-learn==1.5.2
      - uses: actions/download-artifact@v4
        with:
          name: demiurge-r13-scientific-proposals
          path: /tmp/demiurge-r13-artifact
      - name: Check fresh scientific observations, paired intervals and falsification
        run: |
          python research/logos_001/r13_witness.py \
            --candidate /tmp/demiurge-r13-artifact/demiurge-r13-proposals.json \
            --out /tmp/demiurge-r13-witness.json --self-test
      - name: Require honest negative result and zero production permission
        run: |
          python -c "import json; d=json.load(open('/tmp/demiurge-r13-witness.json')); assert d['integrity']=='PASS_SOURCE_AND_PROPOSAL_CHECKS'; assert d['successes']==0; assert d['negative_controls_rejected']==3; assert d['scientific_verdict']=='NOT_ALL_THREE_COMPETITIVE'; assert d['production_model_promotion_allowed'] is False; assert len(d['tamper_checks'])==4"
      - uses: actions/upload-artifact@v4
        with:
          name: demiurge-r13-independent-strong-baseline-no-promotion
          path: /tmp/demiurge-r13-witness.json
          if-no-files-found: error
          retention-days: 30
