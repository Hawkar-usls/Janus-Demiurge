name: ESSENCE v3.6 JUXTAPOSE Exact-Backed Search Microcore

on:
  pull_request:
    paths:
      - 'tools/essence_v36_juxtapose_exact.py'
      - 'tests/test_essence_v36_juxtapose_exact.py'
      - 'research/essence/juxtapose_v36/**'
      - '.github/workflows/essence-v36-juxtapose-exact.yml'
      - 'tools/essence_v30_active_evolution.py'
      - 'tests/test_essence_v30_active_evolution.py'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v36_juxtapose_exact.py'
      - 'tests/test_essence_v36_juxtapose_exact.py'
      - 'research/essence/juxtapose_v36/**'
      - '.github/workflows/essence-v36-juxtapose-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v36-juxtapose-exact-main
  cancel-in-progress: false

jobs:
  adversarial-exact-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact transitions, finite replay, resource-limit veto and no theorem promotion
        run: |
          python -m py_compile tools/essence_v36_juxtapose_exact.py
          python -m unittest -v tests.test_essence_v36_juxtapose_exact
          python -m unittest -v tests.test_essence_v32_keymaster_memory tests.test_essence_v33_epistemic_exchange

  real-juxtapose-microcore:
    needs: adversarial-exact-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/essence-keymaster-memory-state
          path: memory-v32
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/essence-epistemic-state
          path: memory-v33
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable historical JUXTAPOSE source blobs (no remote Python execution)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=source python - <<'PY'
          import base64, hashlib, json, os
          from urllib.request import Request, urlopen
          from tools.essence_v36_juxtapose_exact import SOURCE_CODE,SOURCES
          items = [SOURCE_CODE,*SOURCES.values()]
          for entry in items:
              repo = entry['repo']
              expected = entry['git_blob_sha1']
              req = Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{expected}",
                  headers={
                      'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'JANUS-ESSENCE-JUXTAPOSE-SourcePin-v36'
                  })
              with urlopen(req,timeout=20) as response:
                  blob=json.load(response)
              assert blob['sha']==expected and blob['encoding']=='base64'
              raw=base64.b64decode(blob['content'])
              actual=hashlib.sha1(
                  b'blob '+str(len(raw)).encode()+b'\0'+raw
              ).hexdigest()
              assert actual==expected
              assert len(raw)<75000
              print(json.dumps({'path':entry['path'],
                  'source_blob_sha1':expected,
                  'source_sha256':hashlib.sha256(raw).hexdigest(),
                  'source_executed':False},sort_keys=True))
          PY
      - name: Run COLD exact field search on frozen research inputs with sealed memory
        env:
          PYTHONPATH: source
        run: |
          python source/tools/essence_v36_juxtapose_exact.py \
            --cases source/research/essence/juxtapose_v36/frozen_cases.json \
            --v32 memory-v32/research/essence/keymaster_memory/state.json \
            --v33 memory-v33/research/essence/epistemic/state.json \
            --receipt source/artifacts/essence-v36/juxtapose-exact.json
      - name: Reverify sealed output and report negative cases
        env:
          PYTHONPATH: source
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.essence_v36_juxtapose_exact import seal
          path=Path('source/artifacts/essence-v36/juxtapose-exact.json')
          receipt=json.loads(path.read_text())
          assert receipt['receipt_sha256']==seal({
              k:v for k,v in receipt.items() if k!='receipt_sha256'})
          assert receipt['cases_verified']==4
          assert receipt['unresolved_negative_cases_preserved']==1
          assert all(c['report']['coverage_ratio']==1.0 for c in receipt['cases'])
          assert receipt['historical_source_python_executed'] is False
          assert receipt['production_neural_weights_changed'] is False
          assert receipt['production_authority'] is False
          assert receipt['future_prospective_gain_proven'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write("### JUXTAPOSE exact-backed ESSENCE microcore\\n")
              stream.write("Research exact cases: "+str(receipt['cases_verified'])+"\\n")
              stream.write("Resource-limit negatives retained: "+
                           str(receipt['unresolved_negative_cases_preserved'])+"\\n")
              stream.write("Hot/Warm authority: NOT EARNED; COLD full-field only\\n")
              stream.write("Production and theorem authority: DENIED\\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v36-juxtapose-exact-${{ github.run_id }}
          path: source/artifacts/essence-v36/juxtapose-exact.json
          if-no-files-found: warn
          retention-days: 90
