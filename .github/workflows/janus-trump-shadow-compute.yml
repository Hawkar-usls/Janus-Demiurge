name: JANUS TRUMP Shadow Compute

on:
  push:
    branches: [main, feature/trump-r29-objective-shadow-accelerator-v1, feature/trump-captain-proof-ladder-v1, fix/trump-shadow-cas-persistence-v1]
    paths:
      - 'trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'
      - 'janus_model/extensions/trump_shadow_compute.py'
      - 'tests/test_janus_trump_shadow_compute.py'
      - '.github/workflows/janus-trump-shadow-compute.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 */12 * * *'

concurrency:
  group: janus-trump-shadow-compute
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture source head
        id: source
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify shadow adapter Captain claim ceiling and CAS drift policy
        run: |
          python -m py_compile janus_model/extensions/trump_shadow_compute.py
          python -m unittest -v tests/test_janus_trump_shadow_compute.py
          python - <<'PY'
          def validate(paths):
              prefixes=(
                  'janus_model/state/',
                  'janus_model/receipts/',
                  'janus_model/outbox/',
                  'janus_model/checkpoints/',
              )
              exact={'janus_model/extensions/TRUMP_RESEARCH_WAKE.json'}
              bad=[p for p in paths if p and p not in exact and not p.startswith(prefixes)]
              if bad:
                  raise RuntimeError('TRUMP_SHADOW_NONBENIGN_MAIN_DRIFT:'+','.join(sorted(bad)))
              return paths
          validate(['janus_model/state/JANUS_TRUMP_RESEARCH_CONTEXT.json'])
          validate(['janus_model/extensions/TRUMP_RESEARCH_WAKE.json'])
          try:
              validate(['trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'])
          except RuntimeError:
              pass
          else:
              raise SystemExit('TRUMP_SHADOW_CAS_POLICY_FAILED_TO_REJECT_OBJECTIVE_DRIFT')
          try:
              validate(['janus_model/extensions/trump_shadow_compute.py'])
          except RuntimeError:
              pass
          else:
              raise SystemExit('TRUMP_SHADOW_CAS_POLICY_FAILED_TO_REJECT_CODE_DRIFT')
          print('JANUS_TRUMP_SHADOW_CAS_POLICY=PASS')
          PY
          echo 'JANUS_TRUMP_SHADOW_CAPTAIN_KERNEL=PASS'

      - name: Fetch byte-pinned C025 runtime candidate
        run: |
          mkdir -p runtime
          git init -q runtime/fundamentum-c025
          git -C runtime/fundamentum-c025 remote add origin https://github.com/Hawkar-usls/Janus-Fundamentum.git
          git -C runtime/fundamentum-c025 fetch -q --depth 1 origin 377668585178995217b681d5ddb1b34b0f8dc386
          git -C runtime/fundamentum-c025 checkout -q --detach FETCH_HEAD
          test "$(git -C runtime/fundamentum-c025 rev-parse HEAD)" = "377668585178995217b681d5ddb1b34b0f8dc386"
          test "$(git -C runtime/fundamentum-c025 hash-object experiments/direct/janus_unified_proof_carrying_akinator_jec.py)" = "230ca949bb51f6eeb5e7dbeea364a0752f9d0636"
          echo 'JANUS_TRUMP_C025_PIN=PASS'

      - name: Run repeated exact shadow benchmark
        run: |
          python -m janus_model.extensions.trump_shadow_compute \
            --candidate runtime/fundamentum-c025/experiments/direct/janus_unified_proof_carrying_akinator_jec.py \
            --out runtime/JANUS_TRUMP_SHADOW_COMPUTE.json \
            --repeats 5

      - name: Shadow scientific self-use and proof-scope gate
        run: |
          python - <<'PY'
          import json
          x=json.load(open('runtime/JANUS_TRUMP_SHADOW_COMPUTE.json'))
          assert x['P_VS_NP']=='OPEN'
          assert x['performance_reference']['solver']=='DETERMINISTIC_EXACT_DPLL'
          assert x['performance_reference']['truth_oracle']=='EXHAUSTIVE_ENUMERATION_NOT_TIMED_AS_PERFORMANCE_BASELINE'
          assert x['summary']['highest_proof_scope'] in {'NONE','L1_LOCAL_FINITE_INSTANCE_ONLY'}
          assert x['summary']['universal_coverage_proved'] is False
          assert x['summary']['uniform_total_resolver_proved'] is False
          assert x['summary']['general_acceleration_proved'] is False
          assert x['summary']['polynomial_bound_proved'] is False
          assert x['summary']['P_equals_NP_proved'] is False
          assert x['self_use_gate']['candidate_SAT_may_short_circuit_baseline_only_after_witness_verification'] is True
          assert x['self_use_gate']['candidate_SAT_may_short_circuit_only_for_persisted_speedup_eligible_workload'] is True
          assert x['self_use_gate']['candidate_UNSAT_may_short_circuit_baseline'] is False
          assert x['self_use_gate']['candidate_OPEN_may_short_circuit_baseline'] is False
          assert x['self_use_gate']['unlisted_workload_may_assume_speedup'] is False
          assert x['self_use_gate']['local_fast_path_is_universal_solver_claim'] is False
          assert x['self_use_gate']['local_fast_path_is_polynomial_bound_claim'] is False
          assert x['self_use_gate']['fallback_to_reference_dpll_required'] is True
          assert x['self_use_gate']['authority_delta']==0
          assert x['summary']['exact_terminal_equivalence_count'] >= 2
          for row in x['workloads']:
              assert row['reference_status']==row['oracle_status']
              assert row['universal_coverage_proved'] is False
              assert row['uniform_resolver_proved'] is False
              assert row['worst_case_polynomial_bound_proved'] is False
              if row['candidate_status']=='SAT' and row['exact_terminal_equivalence']:
                  assert row['candidate_witness_verified'] is True
                  assert row['proof_scope']=='L1_LOCAL_FINITE_INSTANCE_ONLY'
              if row['id'] in x['summary']['verified_sat_fast_path_workloads']:
                  assert row['repeated_resource_win'] is True
                  assert row['candidate_status']=='SAT'
                  assert row['candidate_witness_verified'] is True
          print(json.dumps({
            'status':x['status'],
            'exact':x['summary']['exact_terminal_equivalence_count'],
            'wins_vs_dpll':x['summary']['repeated_resource_win_count'],
            'highest_proof_scope':x['summary']['highest_proof_scope'],
            'sat_fast_paths':x['summary']['verified_sat_fast_path_workloads'],
            'receipt_sha256':x['receipt_sha256'],
            'P_VS_NP':x['P_VS_NP'],
          },indent=2))
          PY

      - name: Upload shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: janus-trump-shadow-compute
          path: runtime/JANUS_TRUMP_SHADOW_COMPUTE.json
          if-no-files-found: error

      - name: Persist latest shadow receipt with bounded compare-and-swap
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'janus-trump-shadow-compute'
          git config user.email 'janus-trump-shadow-compute@users.noreply.github.com'
          SOURCE='${{ steps.source.outputs.head }}'

          validate_drift_file() {
            python - "$1" <<'PY'
          import sys
          from pathlib import Path
          paths=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          prefixes=(
              'janus_model/state/',
              'janus_model/receipts/',
              'janus_model/outbox/',
              'janus_model/checkpoints/',
          )
          exact={'janus_model/extensions/TRUMP_RESEARCH_WAKE.json'}
          bad=[p for p in paths if p and p not in exact and not p.startswith(prefixes)]
          if bad:
              raise SystemExit('TRUMP_SHADOW_NONBENIGN_MAIN_DRIFT:'+','.join(sorted(bad)))
          print('JANUS_TRUMP_SHADOW_BENIGN_DRIFT=' + ','.join(paths))
          PY
          }

          revalidate_receipt() {
            python - <<'PY'
          import json
          x=json.load(open('runtime/JANUS_TRUMP_SHADOW_COMPUTE.json'))
          assert x['P_VS_NP']=='OPEN'
          assert x['summary']['highest_proof_scope'] in {'NONE','L1_LOCAL_FINITE_INSTANCE_ONLY'}
          assert x['summary']['universal_coverage_proved'] is False
          assert x['summary']['uniform_total_resolver_proved'] is False
          assert x['summary']['polynomial_bound_proved'] is False
          assert x['summary']['P_equals_NP_proved'] is False
          assert x['self_use_gate']['authority_delta']==0
          print('JANUS_TRUMP_SHADOW_RECEIPT_REVALIDATION=PASS')
          PY
          }

          rebuild_commit_on_current_main() {
            git reset --hard origin/main
            revalidate_receipt
            cp runtime/JANUS_TRUMP_SHADOW_COMPUTE.json janus_model/state/JANUS_TRUMP_SHADOW_COMPUTE.json
            git add -f janus_model/state/JANUS_TRUMP_SHADOW_COMPUTE.json
            if git diff --cached --quiet; then
              echo 'JANUS_TRUMP_SHADOW_NO_CHANGE'
              return 2
            fi
            git commit -m 'JANUS TRUMP: persist exact DPLL-referenced shadow receipt'
            return 0
          }

          git fetch origin main
          CURRENT=$(git rev-parse origin/main)
          if [ "$SOURCE" != "$CURRENT" ]; then
            git diff --name-only "$SOURCE" "$CURRENT" > runtime/trump-shadow-preflight-drift.txt
            validate_drift_file runtime/trump-shadow-preflight-drift.txt
          fi

          set +e
          rebuild_commit_on_current_main
          BUILD_RC=$?
          set -e
          if [ "$BUILD_RC" -eq 2 ]; then
            exit 0
          elif [ "$BUILD_RC" -ne 0 ]; then
            exit "$BUILD_RC"
          fi

          PUSHED=false
          for ATTEMPT in 1 2 3; do
            echo "JANUS_TRUMP_SHADOW_CAS_ATTEMPT=$ATTEMPT"
            if git push origin HEAD:main; then
              PUSHED=true
              echo "JANUS_TRUMP_SHADOW_CAS_PUSH=PASS:$ATTEMPT"
              break
            fi

            git fetch origin main
            LOCAL_PARENT=$(git rev-parse HEAD^)
            CURRENT=$(git rev-parse origin/main)
            if [ "$LOCAL_PARENT" = "$CURRENT" ]; then
              echo 'JANUS_TRUMP_SHADOW_PUSH_FAILED_WITHOUT_REMOTE_ADVANCE'
              exit 24
            fi
            git diff --name-only "$LOCAL_PARENT" "$CURRENT" > runtime/trump-shadow-cas-drift.txt
            validate_drift_file runtime/trump-shadow-cas-drift.txt

            set +e
            rebuild_commit_on_current_main
            BUILD_RC=$?
            set -e
            if [ "$BUILD_RC" -eq 2 ]; then
              echo 'JANUS_TRUMP_SHADOW_REMOTE_ALREADY_EQUIVALENT=PASS'
              PUSHED=true
              break
            elif [ "$BUILD_RC" -ne 0 ]; then
              exit "$BUILD_RC"
            fi
          done
          if [ "$PUSHED" != true ]; then
            echo 'JANUS_TRUMP_SHADOW_CAS_RETRY_EXHAUSTED'
            exit 25
          fi
          echo 'JANUS_TRUMP_SHADOW_PERSIST=PASS'

      - name: Branch proof has zero persistence authority
        if: github.ref_name != 'main'
        run: echo 'JANUS_TRUMP_SHADOW_BRANCH_PROOF_READ_ONLY=PASS'
