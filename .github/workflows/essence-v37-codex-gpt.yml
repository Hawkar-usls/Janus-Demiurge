name: ESSENCE v3.7 CODEX GPT bounded neural donor

on:
  pull_request:
    paths:
      - 'tools/essence_v37_codex_gpt.py'
      - 'tests/test_essence_v37_codex_gpt.py'
      - '.github/workflows/essence-v37-codex-gpt.yml'
      - 'tools/essence_v30_active_evolution.py'
      - 'tests/test_essence_v30_active_evolution.py'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v37_codex_gpt.py'
      - 'tests/test_essence_v37_codex_gpt.py'
      - '.github/workflows/essence-v37-codex-gpt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v37-codex-gpt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codex-gpt-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify bounded CODEX donor and original JUXTAPOSE exact veto
        run: |
          python -m py_compile tools/essence_v37_codex_gpt.py
          python -m unittest -v tests.test_essence_v37_codex_gpt tests.test_essence_v36_juxtapose_exact
      - name: Run actual ephemeral neural training and quant shadow on disjoint repository files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
        run: |
          python -m tools.essence_v37_codex_gpt --repo-root . --steps 12 --out runtime/essence/v37-codex-gpt.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.essence_v37_codex_gpt import seal
          d=json.loads(Path("runtime/essence/v37-codex-gpt.json").read_text())
          assert d["receipt_sha256"] == seal({k:v for k,v in d.items() if k!="receipt_sha256"})
          assert d["actual_ephemeral_neural_weight_updates"] is True
          assert d["juxtapose_exact_receipt_sha256"]
          assert d["production_weights_modified"] is False
          assert d["production_authority"] is False
          assert d["new_generation_promoted"] is False
          assert d["quantization"]["native_int8_speed_proven"] is False
          print("CODEX donor: ephemeral train and exact veto PASS; production HOLD")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v37-codex-gpt-${{ github.run_id }}
          path: runtime/essence/v37-codex-gpt.json
          if-no-files-found: warn
          retention-days: 90
