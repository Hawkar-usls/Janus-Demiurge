name: JANUS-010K Pinned Author Code Leakage Audit
on:
  pull_request:
    paths:
      - 'experiments/ocean_transformer/late_choice_010/nist_kshalm_provenance_010k.py'
      - 'experiments/ocean_transformer/late_choice_010/test_nist_kshalm_provenance_010k.py'
      - '.github/workflows/janus-010k-kshalm-code-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-010k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: AST parser and leakage gate tests
        run: |
          set -euo pipefail
          python -m unittest discover -v -s experiments/ocean_transformer/late_choice_010 -p 'test_nist_kshalm_provenance_010k.py'
      - name: Audit six SHA-pinned public author source files, do not execute them
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nist010k"
          python experiments/ocean_transformer/late_choice_010/nist_kshalm_provenance_010k.py --output "$RUNNER_TEMP/nist010k/nist_010k_source_provenance.json"
      - name: Archive only source hashes and call-graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-nist-010k-${{ github.run_id }}
          path: ${{ runner.temp }}/nist010k/*.json
          retention-days: 60
          if-no-files-found: warn
