name: JANUS-010E NIST Real RNG and Detector Ordering
on:
  pull_request:
    paths:
      - 'experiments/ocean_transformer/late_choice_010/nist_cycle_order_010e.py'
      - 'experiments/ocean_transformer/late_choice_010/test_nist_cycle_order_010e.py'
      - '.github/workflows/janus-010e-nist-event-order.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-nist-010e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-physical-event-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Raw-time chronology contract checks
        run: |
          set -euo pipefail
          python -m unittest discover -v -s experiments/ocean_transformer/late_choice_010 -p 'test_nist_cycle_order_010e.py'
          python -m unittest discover -v -s experiments/ocean_transformer/late_choice_010 -p 'test_nist_sync_010d.py'
      - name: Actual NIST station 00_03: zero-adjustable sync-to-sync event ordering
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nist010e"
          python experiments/ocean_transformer/late_choice_010/nist_cycle_order_010e.py --output "$RUNNER_TEMP/nist010e/nist_010e_timing_result.json"
      - name: Retain aggregated source SHA and clock diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-nist-010e-event-order-${{ github.run_id }}
          path: ${{ runner.temp }}/nist010e/nist_010e_timing_result.json
          retention-days: 60
          if-no-files-found: warn
