name: JANUS Native Intensive Wake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-native-intensive-wake.yml'
  schedule:
    - cron: '2,32 * * * *'
  workflow_dispatch:

concurrency:
  group: janus-native-intensive-wake
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch JANUS Native Model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run janus-native-model.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f mode=train_and_run \
            -f force_train=true \
            -f prompt='JANUS 30-minute exploratory wake: train a fresh trajectory, evaluate against frozen gates, preserve only verified improvement.'
          echo 'JANUS_NATIVE_30M_EXPLORATORY_WAKE=DISPATCHED'
