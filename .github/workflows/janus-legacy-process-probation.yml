name: JANUS Legacy Module Process Probation

on:
  pull_request:
    paths:
      - 'restored/legacy_probation_worker.py'
      - 'restored/legacy_process_probation.py'
      - 'tests/test_legacy_process_probation.py'
      - 'demiurge/LEGACY_PROCESS_PROBATION_POLICY.json'
      - 'docs/LEGACY_PROCESS_PROBATION.md'
      - '.github/workflows/janus-legacy-process-probation.yml'
  push:
    branches: [main]
    paths:
      - 'restored/legacy_probation_worker.py'
      - 'restored/legacy_process_probation.py'
      - 'tests/test_legacy_process_probation.py'
      - 'demiurge/LEGACY_PROCESS_PROBATION_POLICY.json'
      - 'docs/LEGACY_PROCESS_PROBATION.md'
      - '.github/workflows/janus-legacy-process-probation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile only modern trusted worker/parent
        run: python -m py_compile restored/legacy_probation_worker.py restored/legacy_process_probation.py
      - name: Pinned policy and real subprocess end-to-end synthetic tests
        run: python -m unittest discover -s tests -p 'test_legacy_process_probation.py' -v
      - name: Keep historical read-only organ and ABI tests passing
        run: |
          python -m unittest discover -s tests -p 'test_legacy_nexus_conductor.py' -v
          python -m unittest discover -s tests -p 'test_legacy_core_graph_query_port.py' -v
