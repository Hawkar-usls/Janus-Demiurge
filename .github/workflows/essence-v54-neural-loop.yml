name: ESSENCE v5.4 bounded prospective shadow neural generations

on:
  pull_request:
    paths:
      - 'tools/essence_v54_neural_loop.py'
      - 'tests/test_essence_v54_neural_loop.py'
      - 'research/essence/peer_v54/FROZEN_LOCK.json'
      - '.github/workflows/essence-v54-neural-loop.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v54_neural_loop.py'
      - 'tests/test_essence_v54_neural_loop.py'
      - 'research/essence/peer_v54/FROZEN_LOCK.json'
      - '.github/workflows/essence-v54-neural-loop.yml'
  # Poll source commits every five minutes; train only on a new, verified cohort.
  # Offset from minute 0 reduces GitHub Actions scheduled-run congestion.
  schedule:
    - cron: '6-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v54-single-shadow-writer
  cancel-in-progress: false

env:
  ROOT: runtime/essence/v54
  LOCK: research/essence/peer_v54/FROZEN_LOCK.json
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify immutable research lock, live-source planning and malicious packet rejection
        run: |
          python -m py_compile tools/essence_v54_neural_loop.py tests/test_essence_v54_neural_loop.py
          python -m unittest -v tests.test_essence_v54_neural_loop

  preregister-new-source:
    needs: offline-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true' && vars.ESSENCE_V54_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.freeze.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v54/state
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Fetch four verified training sources; read only withheld peer HEAD SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/sources"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/iNaiHR.git "$ROOT/sources/inaihr"
          git -C "$ROOT/sources/inaihr" sparse-checkout set --no-cone PROJECT_STATUS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/aura-oracle-tg.git "$ROOT/sources/aura"
          git -C "$ROOT/sources/aura" sparse-checkout set --no-cone PROJECT_STATUS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/Simptomat.git "$ROOT/sources/simptomat"
          git -C "$ROOT/sources/simptomat" sparse-checkout set --no-cone PROJECT_STATUS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/SCOBY-D0.git "$ROOT/sources/scoby"
          git -C "$ROOT/sources/scoby" sparse-checkout set --no-cone PROJECT_STATUS.json
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          repos={"inaihr":"BFain","aura":"Janus",
                 "simptomat":"Janus_Genesis","scoby":"Janus-HELIOS"}
          heads={}
          for sid,repo in repos.items():
              result=subprocess.check_output(
                  ["git","ls-remote",f"https://github.com/Hawkar-usls/{repo}.git","HEAD"],
                  text=True,timeout=30).split()
              if not result or not re.fullmatch("[0-9a-f]{40}",result[0]):
                  raise SystemExit("V54_UNFROZEN_HOLDOUT_HEAD")
              heads[sid]=result[0]
          Path("runtime/essence/v54/holdout-commits.json").write_text(
              json.dumps(heads,sort_keys=True,indent=2))
          PY
      - name: Seal at most one fresh paired source against previous receipts and withheld SHA
        id: freeze
        run: |
          set -euo pipefail
          python -m tools.essence_v54_neural_loop plan \
            --state "$ROOT/state" \
            --sources "$ROOT/sources" \
            --holdout-commits "$ROOT/holdout-commits.json" \
            --memory "$ROOT/state/research/essence/peer_v48_state/ledger.json" \
            --out "$ROOT/plan.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=json.loads(Path("runtime/essence/v54/plan.json").read_text())
          print("ready="+str(p["action"]=="TRAIN_SHADOW").lower())
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=json.loads(Path("runtime/essence/v54/plan.json").read_text())
          print("### ESSENCE v5.4 source commitment")
          print("Decision:",p["action"])
          print("Parent:",p.get("parent_generation","unchanged"))
          print("Source:",p.get("source_repo","none"))
          print("Withheld peer repo content unread until the separate exam job.")
          print("No auto-promotion to production or Sentinel.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v54-plan-${{ github.run_id }}
          path: runtime/essence/v54/plan.json
          retention-days: 90
          if-no-files-found: error

  learn-inherited-weights:
    needs: preregister-new-source
    if: needs.preregister-new-source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v54/state
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v54-plan-${{ github.run_id }}
          path: runtime/essence/v54
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Bind precommitted training peer and SHA-verified inherited model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          from tools import essence_v54_neural_loop as m
          p=m.verify_plan(m.state.load("runtime/essence/v54/plan.json"),m.LOCK)
          parent=Path("runtime/essence/v54/state")/p["parent_path"]
          m.state.check_model(parent,p["parent_adapter_sha256"],p["parent_lineage_sha256"])
          print("V54_PARENT="+str(parent))
          print("V54_TRAIN_ID="+p["source_id"])
          print("V54_TRAIN_COMMIT="+p["source_commit"])
          PY
      - name: Fetch pinned training source only, no access to withheld peer
        shell: bash
        run: |
          set -euo pipefail
          case "$V54_TRAIN_ID" in
            inaihr) repo=iNaiHR ;;
            aura) repo=aura-oracle-tg ;;
            simptomat) repo=Simptomat ;;
            scoby) repo=SCOBY-D0 ;;
            *) echo 'UNTRUSTED_TRAIN_SOURCE'; exit 1 ;;
          esac
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/Hawkar-usls/$repo.git" "$ROOT/source"
          git -C "$ROOT/source" fetch --quiet --depth 1 origin "$V54_TRAIN_COMMIT"
          git -C "$ROOT/source" checkout --quiet --detach "$V54_TRAIN_COMMIT"
          git -C "$ROOT/source" sparse-checkout set --no-cone PROJECT_STATUS.json
          test "$(git -C "$ROOT/source" rev-parse HEAD)" = "$V54_TRAIN_COMMIT"
      - name: Install fixed CPU-only LoRA trainer, not arbitrary peer requirements
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Train 96 bounded real LoRA steps with verified replay
        run: |
          python -m tools.essence_v54_neural_loop train \
            --plan "$ROOT/plan.json" --parent "$V54_PARENT" \
            --source "$ROOT/source" --child "$ROOT/child" \
            --out "$ROOT/train.json"
          echo 'REAL_WEIGHT_UPDATE_SEALED_BEFORE_HOLDOUT=TRUE' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v54-candidate-${{ github.run_id }}
          path: |
            runtime/essence/v54/child/
            runtime/essence/v54/train.json
          retention-days: 90
          if-no-files-found: error

  first-look-independent-job-exam:
    needs: [preregister-new-source,learn-inherited-weights]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v54/state
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v54-plan-${{ github.run_id }}
          path: runtime/essence/v54
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v54-candidate-${{ github.run_id }}
          path: runtime/essence/v54
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Open fresh peer holdout only after weights sealed by previous job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          from tools import essence_v54_neural_loop as m
          p=m.verify_plan(m.state.load("runtime/essence/v54/plan.json"),m.LOCK)
          parent=Path("runtime/essence/v54/state")/p["parent_path"]
          m.state.check_model(parent,p["parent_adapter_sha256"],p["parent_lineage_sha256"])
          print("V54_PARENT="+str(parent))
          print("V54_HOLDOUT_COMMIT="+p["holdout_commit"])
          print("V54_HOLDOUT_ID="+p["source_id"])
          PY
      - name: Fetch only source-pinned withheld peer in examiner job
        shell: bash
        run: |
          set -euo pipefail
          case "$V54_HOLDOUT_ID" in
            inaihr) repo=BFain ;;
            aura) repo=Janus ;;
            simptomat) repo=Janus_Genesis ;;
            scoby) repo=Janus-HELIOS ;;
            *) echo 'UNTRUSTED_HOLDOUT_SOURCE'; exit 1 ;;
          esac
          git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/Hawkar-usls/$repo.git" "$ROOT/holdout"
          git -C "$ROOT/holdout" fetch --quiet --depth 1 origin "$V54_HOLDOUT_COMMIT"
          git -C "$ROOT/holdout" checkout --quiet --detach "$V54_HOLDOUT_COMMIT"
          git -C "$ROOT/holdout" sparse-checkout set --no-cone PROJECT_STATUS.json
          test "$(git -C "$ROOT/holdout" rev-parse HEAD)" = "$V54_HOLDOUT_COMMIT"
      - name: Install fixed CPU-only examiner
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Pair parent/child on new source, fresh peer and old retention; restore parent
        run: |
          python -m tools.essence_v54_neural_loop exam \
            --plan "$ROOT/plan.json" --parent "$V54_PARENT" \
            --child "$ROOT/child" --holdout "$ROOT/holdout" \
            --out "$ROOT/exam.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("runtime/essence/v54/exam.json"))
          print("### ESSENCE v5.4 real neural paired examination")
          print("Status:",p["status"])
          for k,v in p["metrics"].items():
              print(k,v)
          print("Parent restored after model exam:",p["parent_restored_after_shadow_exam"])
          print("Withheld peer:",p["holdout_repo"])
          print("Training time (seconds):",p["training_seconds"])
          print("Exam time (seconds):",p["exam_seconds"])
          print("Internal paired shadow research, not independent external validation.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v54-exam-${{ github.run_id }}
          path: runtime/essence/v54/exam.json
          retention-days: 90
          if-no-files-found: error

  persist-shadow-lineage:
    needs: [preregister-new-source,learn-inherited-weights,first-look-independent-job-exam]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v54/state
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v54-plan-${{ github.run_id }}
          path: runtime/essence/v54
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v54-candidate-${{ github.run_id }}
          path: runtime/essence/v54
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v54-exam-${{ github.run_id }}
          path: runtime/essence/v54
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Accept better research weights or record immutable HOLD without production rights
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.essence_v54_neural_loop publish \
            --state "$ROOT/state" --plan "$ROOT/plan.json" \
            --exam "$ROOT/exam.json" --child "$ROOT/child" \
            --out "$ROOT/publish.json"
          cd "$ROOT/state"
          git config user.name "ESSENCE prospective research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/essence/peer_v54_state/ledger.json
          git add -f research/essence/peer_v54_state/attempts/*.json
          shopt -s nullglob
          candidate_files=(models/v54gen*/*)
          if (("${#candidate_files[@]}" > 0)); then
            git add -f "${candidate_files[@]}"
          fi
          git diff --cached --check
          git diff --cached --name-only > /tmp/v54-staged-paths.txt
          python - <<'PY'
          import re
          from pathlib import Path
          paths=Path("/tmp/v54-staged-paths.txt").read_text().splitlines()
          allowed=re.compile(r"^(?:research/essence/peer_v54_state/(?:ledger\.json|attempts/[0-9a-f]{24}\.json)|models/v54gen[0-9]{4}/(?:adapter_config\.json|adapter_model\.safetensors|lineage\.json|README\.md))$")
          if not paths or any(not allowed.fullmatch(x) for x in paths):
              raise SystemExit("V54_UNAUTHORIZED_BRANCH_WRITE")
          PY
          git commit -m "ESSENCE v5.4: one paired shadow neural attempt and verified parent lineage"
          git pull --rebase origin essence-peer-shadow-state
          git push origin HEAD:refs/heads/essence-peer-shadow-state
          echo 'V54_RESEARCH_GENERATION_LEDGER_PERSISTED=TRUE' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: essence-v54-persistence-${{ github.run_id }}
          path: runtime/essence/v54/publish.json
          if-no-files-found: warn
          retention-days: 90

  # This job never trusts model prose to initiate Actions. It is a bounded,
  # fixed-endpoint continuation of the SOURCE-verified research state only.
  # A fresh copy of the authoritative state branch is read after persistence.
  continue-from-verified-state:
    needs: [preregister-new-source, learn-inherited-weights, first-look-independent-job-exam, persist-shadow-lineage]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.persist-shadow-lineage.result == 'success' && vars.ESSENCE_EVOLUTION_PAUSED != 'true' && vars.ESSENCE_V54_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v54/continuation/state
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Read only four fixed peer source files and SHA heads of independent holdouts
        shell: bash
        run: |
          set -euo pipefail
          root=runtime/essence/v54/continuation
          mkdir -p "$root/sources"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/iNaiHR.git "$root/sources/inaihr"
          git -C "$root/sources/inaihr" sparse-checkout set --no-cone PROJECT_STATUS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/aura-oracle-tg.git "$root/sources/aura"
          git -C "$root/sources/aura" sparse-checkout set --no-cone PROJECT_STATUS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/Simptomat.git "$root/sources/simptomat"
          git -C "$root/sources/simptomat" sparse-checkout set --no-cone PROJECT_STATUS.json
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Hawkar-usls/SCOBY-D0.git "$root/sources/scoby"
          git -C "$root/sources/scoby" sparse-checkout set --no-cone PROJECT_STATUS.json
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          fixed={"inaihr":"BFain","aura":"Janus",
                 "simptomat":"Janus_Genesis","scoby":"Janus-HELIOS"}
          heads={}
          for sid,repo in fixed.items():
              raw=subprocess.check_output(
                  ["git","ls-remote",f"https://github.com/Hawkar-usls/{repo}.git","HEAD"],
                  text=True,timeout=30).split()
              if not raw or not re.fullmatch("[0-9a-f]{40}",raw[0]):
                  raise SystemExit("V54_CONTINUATION_HOLDOUT_UNVERIFIED")
              heads[sid]=raw[0]
          Path("runtime/essence/v54/continuation/holdouts.json").write_text(
              json.dumps(heads,sort_keys=True,indent=2))
          PY
      - name: Replan against PERSISTED ledger and ask only one fixed same-repo research workflow to wake
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Hawkar-usls/Janus-Demiurge"
          root=runtime/essence/v54/continuation
          python -m tools.essence_v54_neural_loop plan \
            --state "$root/state" \
            --sources "$root/sources" \
            --holdout-commits "$root/holdouts.json" \
            --memory "$root/state/research/essence/peer_v48_state/ledger.json" \
            --out "$root/next-plan.json"
          DECISION="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("runtime/essence/v54/continuation/next-plan.json").read_text())
          print(p["action"])
          PY
          )"
          echo "ESSENCE v5.4 next verified cohort: $DECISION" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DECISION" == "TRAIN_SHADOW" ]]; then
            python - <<'PY'
          from tools import essence_v54_neural_loop as m
          base="runtime/essence/v54/continuation"
          ledger=m.ledger_at(base+"/state")
          plan=m.state.load(base+"/next-plan.json")
          m.verify_plan(plan,m.LOCK,ledger)
          if len(ledger["attempts"])>=m.LOCK["max_attempts"]:
              raise SystemExit("V54_ATTEMPT_BUDGET_EXHAUSTED")
          if len(ledger["admitted"])>=m.LOCK["max_accepted_generations"]:
              raise SystemExit("V54_GENERATION_BUDGET_EXHAUSTED")
          PY
            gh api --method POST \
              repos/Hawkar-usls/Janus-Demiurge/actions/workflows/essence-v54-neural-loop.yml/dispatches \
              -f ref=main >/dev/null
            echo "BOUNDED_NEXT_RESEARCH_RUN_DISPATCH_ACCEPTED=true" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DECISION" == "NO_FRESH_PAIRED_SOURCE_FACTS" || "$DECISION" == "HOLD_BUDGET" ]]; then
            echo "BOUNDED_NEXT_RESEARCH_RUN_SKIPPED_NO_NEW_WORK=true" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "V54_UNKNOWN_NEXT_ACTION"; exit 1
          fi
