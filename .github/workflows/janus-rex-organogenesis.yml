name: JANUS Rex Organogenesis v1.2.2

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Tracked Rex ModuleSpec path'
        required: true
        default: 'rex/specs/rex_heartbeat.json'
      target_sha:
        description: 'Exact repository SHA containing the requested ModuleSpec'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'rex/specs/*.json'
      - 'rex/specs/generated/*.json'
      - 'rex/policy.json'
      - 'rex/nexus_policy.json'
      - 'tools/demiurge_rex.py'
      - 'tools/demiurge_rex_lifecycle.py'
      - 'tests/test_rex_v1.py'
      - 'tests/test_rex_director_v1_1.py'
      - 'tests/test_rex_lifecycle_v1_2.py'
      - '.github/workflows/janus-rex-organogenesis.yml'

concurrency:
  group: janus-rex-organogenesis
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  create-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Bind checkout to requested provenance
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ -n "${REQUESTED_SHA:-}" ] && [ "$ACTUAL_SHA" != "$REQUESTED_SHA" ]; then
            echo "ORGANOGENESIS_SHA_MISMATCH requested=$REQUESTED_SHA actual=$ACTUAL_SHA" >&2
            exit 2
          fi
          echo "REX_ORGANOGENESIS_INPUT_SHA=$ACTUAL_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Rex contract tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_rex_v1.py tests/test_rex_director_v1_1.py tests/test_rex_lifecycle_v1_2.py
      - name: Resolve bounded spec path
        id: spec
        shell: bash
        env:
          REQUESTED_SPEC: ${{ github.event.inputs.spec_path }}
        run: |
          set -euo pipefail
          SPEC="${REQUESTED_SPEC:-rex/specs/rex_heartbeat.json}"
          case "$SPEC" in rex/specs/*.json|rex/specs/generated/*.json) ;; *) echo 'Refusing untracked/non-Rex spec path' >&2; exit 2;; esac
          test -f "$SPEC"
          SPEC="$SPEC" python - <<'PY'
          import json, os
          p=os.environ['SPEC']; obj=json.load(open(p))
          mid=obj.get('module_id',''); nx=obj.get('nexus') or {}
          if not isinstance(nx,dict): raise SystemExit('nexus field must be object')
          life=obj.get('lifecycle')
          lifecycle=isinstance(life,dict) and life.get('enabled') is True
          autorun=nx.get('request_autorun') is True
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"path={p}\n")
              fh.write(f"module_id={mid}\n")
              fh.write("autorun=" + ('true' if autorun else 'false') + "\n")
              fh.write("lifecycle=" + ('true' if lifecycle else 'false') + "\n")
              fh.write("need_admission=" + ('true' if (autorun or lifecycle) else 'false') + "\n")
          PY
      - name: Rex creates candidate
        run: python tools/demiurge_rex.py build --policy rex/policy.json --spec '${{ steps.spec.outputs.path }}' --out-root rex/candidates
      - name: Auditor gates candidate
        shell: bash
        env:
          MODULE_ID: ${{ steps.spec.outputs.module_id }}
        run: |
          set -euo pipefail
          python tools/demiurge_rex.py audit --candidate-dir "rex/candidates/$MODULE_ID"
          python - <<PY
          import json
          p='rex/candidates/$MODULE_ID/audit.json'
          a=json.load(open(p))
          assert a['status']=='PASS' and a['admission']=='NOT_GRANTED' and a['authority_delta']==0
          PY
      - name: Validate external Nexus low-risk policy
        if: steps.spec.outputs.need_admission == 'true'
        id: nexus
        shell: bash
        env:
          MODULE_ID: ${{ steps.spec.outputs.module_id }}
          SPEC_PATH: ${{ steps.spec.outputs.path }}
          AUTORUN: ${{ steps.spec.outputs.autorun }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          spec=json.load(open(os.environ['SPEC_PATH']))
          pol=json.load(open('rex/nexus_policy.json'))
          audit=json.load(open(f"rex/candidates/{os.environ['MODULE_ID']}/audit.json"))
          if pol.get('schema')!='janus.nexus.rex_low_risk_policy.v1' or pol.get('enabled') is not True:
              raise SystemExit('NEXUS_POLICY_DISABLED')
          if spec.get('template') not in set(pol.get('allowed_autorun_templates') or []):
              raise SystemExit('NEXUS_TEMPLATE_NOT_ALLOWED')
          if audit.get('status')!='PASS' or audit.get('authority_delta')!=0:
              raise SystemExit('NEXUS_AUDIT_GATE_FAIL')
          if os.environ.get('AUTORUN') == 'true':
              nx=spec.get('nexus') or {}
              obj=nx.get('input',{})
              if not isinstance(obj,dict): raise SystemExit('NEXUS_INPUT_NOT_OBJECT')
              raw=(json.dumps(obj,ensure_ascii=False,sort_keys=True)+'\n').encode()
              if len(raw)>int(pol['limits']['max_input_bytes']): raise SystemExit('NEXUS_INPUT_TOO_LARGE')
              pathlib.Path('/tmp/rex_input.json').write_bytes(raw)
          print('NEXUS_LOW_RISK_POLICY=PASS')
          PY
          SOURCE_SHA="$(sha256sum "rex/candidates/$MODULE_ID/module.py" | awk '{print $1}')"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: External Nexus exact-SHA code admission
        if: steps.spec.outputs.need_admission == 'true'
        shell: bash
        env:
          MODULE_ID: ${{ steps.spec.outputs.module_id }}
          SOURCE_SHA: ${{ steps.nexus.outputs.source_sha }}
        run: |
          set -euo pipefail
          python tools/demiurge_rex.py admit \
            --candidate-dir "rex/candidates/$MODULE_ID" \
            --admissions-dir rex/admissions \
            --source-sha256 "$SOURCE_SHA" \
            --authority EXPLICIT_EXTERNAL_GATE
      - name: Optional birth autorun
        if: steps.spec.outputs.autorun == 'true'
        shell: bash
        env:
          MODULE_ID: ${{ steps.spec.outputs.module_id }}
          SOURCE_SHA: ${{ steps.nexus.outputs.source_sha }}
        run: |
          set -euo pipefail
          python tools/demiurge_rex.py run \
            --candidate-dir "rex/candidates/$MODULE_ID" \
            --admissions-dir rex/admissions \
            --input /tmp/rex_input.json \
            --timeout 8 \
            --max-input-bytes 10000 > /tmp/rex_result.json
          python - <<'PY'
          import json, os, pathlib
          mid=os.environ['MODULE_ID']; result=json.load(open('/tmp/rex_result.json'))
          if result.get('authority_delta') != 0: raise SystemExit('MODULE_AUTHORITY_DELTA_FAIL')
          receipt={
            'schema':'janus.rex.run_receipt.v1','workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'module_id':mid,'source_sha256':os.environ['SOURCE_SHA'],'admission':'NEXUS_LOW_RISK_EXACT_SHA',
            'result':result,'authority_delta':0,'law':'REX_CAN_CREATE_NE_REX_CAN_CROWN'
          }
          p=pathlib.Path('rex/runs')/mid/f"{os.environ['GITHUB_RUN_ID']}.json"; p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False))
          PY
      - name: External Nexus lifecycle admission
        if: steps.spec.outputs.lifecycle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/demiurge_rex_lifecycle.py register \
            --spec '${{ steps.spec.outputs.path }}' \
            --nexus-policy rex/nexus_policy.json \
            --candidate-root rex/candidates \
            --admissions-dir rex/admissions \
            --registry-dir rex/lifecycle
      - name: Persist candidate, audit, admissions, lifecycle and run receipts
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          find rex/candidates -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          find rex/candidates -type f -name '*.pyc' -delete 2>/dev/null || true
          git config user.name 'janus-rex-organogenesis'
          git config user.email 'janus-rex-organogenesis@users.noreply.github.com'
          git add -f rex/candidates rex/admissions rex/runs rex/lifecycle 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git commit -m 'Rex: materialize audited organ, Nexus admission and lifecycle receipts'
          git pull --rebase origin main
          PUSHED_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "pushed_sha=$PUSHED_SHA" >> "$GITHUB_OUTPUT"
          echo "REX_ORGANOGENESIS_PUSHED_SHA=$PUSHED_SHA"
      - name: Bootstrap newly admitted lifecycle organ
        if: steps.spec.outputs.lifecycle == 'true' && steps.persist.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODULE_ID: ${{ steps.spec.outputs.module_id }}
          TARGET_SHA: ${{ steps.persist.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          gh workflow run janus-rex-lifecycle.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f trigger_mode=schedule \
            -f module_id="$MODULE_ID" \
            -f target_sha="$TARGET_SHA"
          echo "REX_LIFECYCLE_BOOTSTRAP_DISPATCHED=$MODULE_ID@$TARGET_SHA"
