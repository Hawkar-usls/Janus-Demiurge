name: AUTODIDACT R1.17 native neural core
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/autodidact-r117-native-neural-core.yml'
permissions:
  contents: read
jobs:
  reference:
    if: github.repository == 'Hawkar-usls/Janus-Demiurge' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/autodidact-r117-native-neural-core-20261127' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fc4293c972c231e9b06dd286a74c840b69131baa
          path: brain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: experiment
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install temporary numerical reference
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compare archive identity without executing archive
        working-directory: brain
        run: |
          test "$(git rev-parse HEAD)" = fc4293c972c231e9b06dd286a74c840b69131baa
          test "$(git hash-object archaeology/nas_early_cores_20261031/microgpt.py)" = 1a734747ab0ccb3c9aff378d5de2d1af74e5a868
      - name: Generate bounded float64 reference tensors
        working-directory: brain
        run: PYTHONPATH="$PWD" python ../experiment/research/autodidact_r117/reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: r117-temporary-numeric-reference
          path: ${{ runner.temp }}/r117-reference/
          if-no-files-found: error
          retention-days: 1
  native:
    needs: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fresh runtime with NumPy only
        run: |
          python -m venv "$RUNNER_TEMP/r117-venv"
          "$RUNNER_TEMP/r117-venv/bin/python" -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: r117-temporary-numeric-reference
          path: ${{ runner.temp }}/r117-reference
      - name: Native forward, backward, AdamW, generation and rollback
        run: |
          "$RUNNER_TEMP/r117-venv/bin/python" research/autodidact_r117/exam.py
      - uses: actions/upload-artifact@v4
        with:
          name: autodidact-r117-metrics-only
          path: ${{ runner.temp }}/r117-result.json
          if-no-files-found: error
          retention-days: 30
