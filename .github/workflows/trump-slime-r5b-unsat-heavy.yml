name: TRUMP Slime R5B UNSAT-Heavy Frozen Gate

on:
  pull_request:
    paths:
      - 'trump/TRUMP_SLIME_R5B_UNSAT_HEAVY_OR_LIFT_FROZEN_BENCH_V1.json'
      - 'trump/run_trump_slime_r5b_unsat_heavy_benchmark.py'
      - 'tests/test_trump_slime_r5b_unsat_heavy.py'
      - '.github/workflows/trump-slime-r5b-unsat-heavy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-r5b-unsat-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify unchanged merged R5 runtime blob
        run: |
          test "$(git hash-object trump/trump_slime_preelim_compression_r5.py)" = "bb9471e3e3c7129ec394ad02f727d9ca6691439b"
      - name: Compile R5B
        run: |
          python -m py_compile trump/run_trump_slime_r5b_unsat_heavy_benchmark.py
          python -m py_compile tests/test_trump_slime_r5b_unsat_heavy.py
      - name: Validate frozen R5B spec
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('trump/TRUMP_SLIME_R5B_UNSAT_HEAVY_OR_LIFT_FROZEN_BENCH_V1.json').read_text())
          assert s['status']=='FROZEN_BEFORE_R5B_IMPLEMENTATION'
          assert s['winner_preregistered'] is False
          assert s['runtime_under_test']['R5_runtime_modification_allowed'] is False
          assert s['profile']=={'cap_exponent':1,'extension_exponent':0,'bounded_resolution_width':3}
          assert s['holdout']['formula_count']==24
          assert len(s['formula_families']['PHP_4_INTO_3']['seeds'])==12
          assert len(s['formula_families']['K4_THREE_COLOR']['seeds'])==12
          assert s['gate']['strict_UNSAT_rescue_required_for_PASS'].startswith('at least one')
          print('PASS frozen R5B spec')
          PY
      - name: Benchmark truth and generator adversarial tests
        run: pytest -q tests/test_trump_slime_r5b_unsat_heavy.py
      - name: Execute frozen R5B holdout
        run: |
          python trump/run_trump_slime_r5b_unsat_heavy_benchmark.py \
            --output trump-slime-r5b-unsat-heavy-result.json \
            --require-pass
      - name: Upload frozen R5B result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trump-slime-r5b-unsat-heavy-frozen-result
          path: trump-slime-r5b-unsat-heavy-result.json
          if-no-files-found: warn
          retention-days: 30
