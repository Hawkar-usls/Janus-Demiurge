name: JANUS R3.5 dispatch credential read-only witness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/janus-dispatch-credential-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-dispatch-credential-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Hawkar-usls/Janus-Demiurge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check fixed GitHub API endpoints with existing dispatch credential
        env:
          DISPATCH_CREDENTIAL: ${{ secrets.JANUS_MESH_DISPATCH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          from datetime import datetime,timezone
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          token=os.environ.get('DISPATCH_CREDENTIAL','')
          receipt={'schema':'janus.eye.r35.dispatch_credential_probe.v1','run_id':os.environ['GITHUB_RUN_ID'],'observed_utc':datetime.now(timezone.utc).isoformat(),'token_present':bool(token),'method':'GET_ONLY','dispatch_attempted':False,'write_permission_proven':False,'results':{}}
          def get(path):
              req=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'JANUS-read-only-probe'},method='GET')
              try:
                  with opener.open(req,timeout=12) as r:
                      return {'http_status':r.status}
              except urllib.error.HTTPError as e:
                  return {'http_status':e.code}
              except (OSError,TimeoutError,urllib.error.URLError):
                  return {'status':'NETWORK_HOLD'}
          if token:
              receipt['identity_endpoint']=get('user')
              for repo in ('Janus-Demiurge','Janus_Genesis','janus-meta-registry'):
                  base='repos/Hawkar-usls/'+repo
                  receipt['results'][repo]={'repository':get(base),'sentinel_workflow':get(base+'/actions/workflows/janus-sentinel-mesh.yml')}
          Path('dispatch-probe.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-dispatch-credential-probe
          path: dispatch-probe.json
          retention-days: 14
