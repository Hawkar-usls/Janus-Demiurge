name: JANUS CAUSAL_ACK Genome

on:
  pull_request:
    branches: [main]
    paths:
      - 'swarm_causal_ack_ledger.py'
      - 'tests/test_swarm_causal_ack_ledger.py'
      - '.github/workflows/janus-causal-ack-genome.yml'
  push:
    branches: [main]
    paths:
      - 'swarm_causal_ack_ledger.py'
      - 'tests/test_swarm_causal_ack_ledger.py'
      - 'scout_swarm/orchestrator/outbox/**'
      - '.github/workflows/janus-causal-ack-genome.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: janus-causal-ack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  causal_ack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard persistence-only retrigger
        id: guard
        shell: bash
        run: |
          MSG="$(git log -1 --pretty=%s)"
          if [[ "$MSG" == Causal\ ACK\ genome:\ persist* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate CAUSAL_ACK laws
        if: steps.guard.outputs.skip != 'true'
        run: |
          python swarm_causal_ack_ledger.py --self-test
          python -m unittest tests.test_swarm_causal_ack_ledger

      - name: Locate latest complete orchestrator run
        if: steps.guard.outputs.skip != 'true'
        id: latest
        shell: bash
        run: |
          LATEST=$(python - <<'PY'
          import json
          from pathlib import Path
          roots=[]
          base=Path('scout_swarm/orchestrator/outbox')
          if base.exists():
              for p in base.rglob('ORCHESTRATOR_RESULT.json'):
                  try:
                      obj=json.loads(p.read_text())
                  except Exception:
                      continue
                  if obj.get('status') != 'COMPLETE':
                      continue
                  run_dir=p.parent
                  if not (run_dir/'agents').exists() or not (run_dir/'inboxes').exists():
                      continue
                  run_id=str(obj.get('run_id') or run_dir.name)
                  try: order=int(run_id)
                  except Exception: order=-1
                  roots.append((order, str(run_dir)))
          if roots:
              print(sorted(roots)[-1][1])
          PY
          )
          if [[ -n "$LATEST" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_dir=$LATEST" >> "$GITHUB_OUTPUT"
            echo "LATEST_CAUSAL_ACK_INPUT=$LATEST"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "NO_COMPLETE_ORCHESTRATOR_RUN_AVAILABLE"
          fi

      - name: Build real-run CAUSAL_ACK genome
        if: steps.guard.outputs.skip != 'true' && steps.latest.outputs.found == 'true'
        shell: bash
        run: |
          RUN_DIR='${{ steps.latest.outputs.run_dir }}'
          python swarm_causal_ack_ledger.py \
            --run-dir "$RUN_DIR" \
            --output runtime/CAUSAL_ACK_GENOME.json
          python - <<'PY'
          import json
          x=json.load(open('runtime/CAUSAL_ACK_GENOME.json'))
          print('JANUS_CAUSAL_ACK_REAL_RUN=PASS')
          print(json.dumps(x['stats'], sort_keys=True))
          assert x['epistemic_boundary']['complete_trace_proves_scientific_truth'] is False
          assert x['epistemic_boundary']['peer_message_is_empirical_evidence'] is False
          PY

      - name: Upload CAUSAL_ACK genome
        if: steps.guard.outputs.skip != 'true' && steps.latest.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: janus-causal-ack-genome
          path: runtime/CAUSAL_ACK_GENOME.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist append-only CAUSAL_ACK genome beside orchestrator run
        if: github.event_name == 'push' && steps.guard.outputs.skip != 'true' && steps.latest.outputs.found == 'true'
        shell: bash
        run: |
          RUN_DIR='${{ steps.latest.outputs.run_dir }}'
          TARGET="$RUN_DIR/CAUSAL_ACK_GENOME.json"
          if [[ -f "$TARGET" ]]; then
            echo "CAUSAL_ACK_ALREADY_PERSISTED=$TARGET"
            exit 0
          fi
          cp runtime/CAUSAL_ACK_GENOME.json "$TARGET"
          git config user.name "janus-causal-ack"
          git config user.email "janus-causal-ack@users.noreply.github.com"
          git add -f "$TARGET"
          git commit -m "Causal ACK genome: persist $(basename "$RUN_DIR")"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "JANUS_CAUSAL_ACK_PERSIST=PASS"
