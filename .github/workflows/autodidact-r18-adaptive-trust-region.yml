name: AUTODIDACT R1.8 adaptive trust region
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/autodidact-r18-adaptive-trust-region.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: autodidact-r18-trust
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'Hawkar-usls/Janus-Demiurge' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/autodidact-r18-adaptive-trust-region-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fc4293c972c231e9b06dd286a74c840b69131baa
          path: brain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 106463de92f57fb21785c59146b63e3013aaaa62
          path: registry
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Demiurge
          run-id: 45886857861
          name: autodidact-r15-evidence-only
          path: question-evidence
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Demiurge
          run-id: 45888341165
          name: autodidact-r16a-metrics-only
          path: gradient-evidence
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Hawkar-usls/Janus-Demiurge
          run-id: 45888778318
          name: autodidact-r17-metrics-only
          path: geometry-evidence
      - name: Bounded multistep trust-region comparison (metrics only)
        working-directory: brain
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,random,subprocess,math,statistics,time,copy
          from pathlib import Path
          import torch
          import torch.nn.functional as F
          from janus_model.corpus import scrub
          from janus_model.train_registry import batch_from,eval_loss,load_checkpoint
          from janus_model.model import ByteTokenizer
          def sha(b): return hashlib.sha256(b).hexdigest()
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          torch.set_num_threads(2)
          torch.set_num_interop_threads(1)
          root=Path('../registry').resolve()
          parent=Path('janus_model/checkpoints/promoted.pt')
          parent_sha='06d7e6228ca9aef2dc58eb55fe1c805aa3b66e4f8fb90b0e946ce6af47b1a662'
          require(sha(parent.read_bytes())==parent_sha,'PARENT_HASH')
          mp=Path('janus_model/state/LAST_CORPUS_MANIFEST.json')
          m=json.loads(mp.read_text())
          commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          require(commit==m['source_commit']=='106463de92f57fb21785c59146b63e3013aaaa62','SOURCE_IDENTITY')
          # Historical train-labeled data only; no production anchor or holdout.
          # Hash buckets are proxies for adaptation and retention, not chronology.
          # Document hashes are disjoint; near-duplicate semantics and parent exposure remain possible.
          keys=['adapt_fit','adapt_eval','retain_fit','retain_eval']
          docs={k:[] for k in keys}; ids={k:[] for k in keys}
          protected={r['sha256'] for r in m['records'] if r['split']=='holdout'}
          seen=set()
          for row in sorted(m['records'],key=lambda x:x['path']):
              if row['split']!='train': continue
              h=row['sha256']
              require(h not in protected and int(h[:8],16)%10!=0,'PROTECTED_SOURCE')
              if h in seen: continue
              seen.add(h)
              p=root/row['path']
              require(p.resolve().is_relative_to(root) and p.is_file() and not p.is_symlink(),'SOURCE_PATH')
              raw=p.read_bytes()
              require(sha(raw)==h and len(raw)==row['bytes'],'SOURCE_BYTES')
              text=scrub(raw.decode('utf-8',errors='replace')).encode()[:65536].decode('utf-8',errors='ignore')
              # Fixed 40/10/40/10 partition by independent salted content hash.
              bucket=int(sha(('r12-preservation:'+h).encode())[:8],16)%10
              key=keys[0 if bucket<4 else 1 if bucket==4 else 2 if bucket<9 else 3]
              docs[key].append(text); ids[key].append(h)
          require(sum(map(len,ids.values()))==len(seen),'DUPLICATE')
          data={k:'\n\n'.join(v) for k,v in docs.items()}
          streams={k:torch.tensor(ByteTokenizer.encode(v,bos=True,eos=True),dtype=torch.long) for k,v in data.items()}
          require(min(map(len,ids.values()))>=10 and min(x.numel() for x in streams.values())>10000,'DATA_TOO_SMALL')
          teacher,_=load_checkpoint(parent,expected_sha256=parent_sha)
          teacher.eval()
          question_raw=Path('../question-evidence/r15-report.json').read_bytes()
          question=json.loads(question_raw)
          require(question['schema']=='janus.autodidact.r15.question_engine.v1' and question['root']=='1f84a30d18544bba266bbfb08c6db4674b53375a8065fffdda6066b5c59ac350','QUESTION_IDENTITY')
          require(question['proposal']['next_question']=='GRADIENT_COSINE' and question['captain']=='ADMIT_REPORT_ONLY' and question['proposal']['training_allowed'] is False,'QUESTION_SCOPE')
          require(question['proposal']['ranking'][0]['fingerprint']=='b7052e63b171197e65b2930f7cf350d85157606de773090a63a5b3b90f436356','QUESTION_FINGERPRINT')
          require(question['scope']['parent_sha256']==parent_sha and question['scope']['registry_commit']==commit and question['scope']['seeds']==[27021,27022],'QUESTION_SOURCE')
          # Read-only autograd. No optimizer, no backward accumulation, no checkpoint output.
          params=dict(teacher.named_parameters())
          require(all(v.requires_grad for v in params.values()),'GRADIENT_PARAMS')
          # Hash logical tensor bytes directly via PyTorch, without NumPy or serialization metadata.
          def tensor_digest(state):
              h=hashlib.sha256()
              for k,v in sorted(state.items()):
                  t=v.detach().cpu().contiguous()
                  meta=json.dumps([k,str(t.dtype),list(t.shape)],separators=(',',':')).encode()
                  raw=bytes(t.reshape(-1).view(torch.uint8).tolist())
                  h.update(len(meta).to_bytes(8,'big')); h.update(meta)
                  h.update(len(raw).to_bytes(8,'big')); h.update(raw)
              return h.hexdigest()
          def state_digest(): return tensor_digest(teacher.state_dict())
          hash_control=torch.tensor([0.,1.],dtype=torch.float32)
          require(tensor_digest({'x':hash_control})==tensor_digest({'x':hash_control.clone()}),'HASH_STABLE')
          changed=hash_control.clone(); changed[0]=2.
          require(tensor_digest({'x':hash_control})!=tensor_digest({'x':changed}),'HASH_MUTATION')
          require(tensor_digest({'x':hash_control})!=tensor_digest({'x':hash_control.reshape(1,2)}),'HASH_SHAPE')
          require(tensor_digest({'x':hash_control})!=tensor_digest({'y':hash_control}),'HASH_NAME')
          before=state_digest()
          prior_raw=Path('../gradient-evidence/autodidact-r16a.json').read_bytes()
          prior=json.loads(prior_raw)
          require(prior['schema']=='janus.autodidact.r16.gradient_conflict.v1' and prior['parent_sha256']==parent_sha and prior['registry_commit']==commit,'GRADIENT_IDENTITY')
          require(prior['decision']=='NONNEGATIVE_ALIGNMENT_OBSERVED' and prior['state_digest']==before and prior['question_fingerprint']==question['proposal']['ranking'][0]['fingerprint'],'GRADIENT_SCOPE')
          require(prior['claim_ceiling']['weights_changed'] is False and prior['claim_ceiling']['optimizer_steps']==0,'GRADIENT_AUTHORITY')
          require(all(sha(data[k].encode())==prior['splits'][k]['text_sha256'] for k in keys),'COHORT_IDENTITY')
          geometry_raw=Path('../geometry-evidence/autodidact-r17.json').read_bytes()
          geometry=json.loads(geometry_raw)
          require(geometry['schema']=='janus.autodidact.r17.learning_step_geometry.v1' and geometry['parent_sha256']==parent_sha and geometry['state_digest']==before and geometry['registry_commit']==commit,'GEOMETRY_IDENTITY')
          require(geometry['restored_probes']==24 and geometry['claim_ceiling']['parent_weights_changed'] is False,'GEOMETRY_SCOPE')
          require(all(geometry['splits'][k]==sha(data[k].encode()) for k in keys),'GEOMETRY_COHORTS')
          # Document-level train/gate split within historical fit pools; R17 eval pools
          # never used to choose steps. They are retrospective, not independent new knowledge.
          subdocs={}; subids={}
          for cohort in ('adapt_fit','retain_fit'):
              for suffix in ('train','gate'):
                  subdocs[cohort+'_'+suffix]=[]; subids[cohort+'_'+suffix]=[]
              for doc,h in zip(docs[cohort],ids[cohort]):
                  suffix='gate' if int(sha(('r18-gate:'+h).encode())[:8],16)%5==0 else 'train'
                  subdocs[cohort+'_'+suffix].append(doc); subids[cohort+'_'+suffix].append(h)
          for k in ('adapt_eval','retain_eval'):
              subdocs[k]=docs[k]; subids[k]=ids[k]
          all_ids=[h for v in subids.values() for h in v]
          require(len(all_ids)==len(set(all_ids)) and len(all_ids)==len(seen),'COHORT_OVERLAP')
          streams18={k:torch.tensor(ByteTokenizer.encode('\n\n'.join(v),bos=True,eos=True),dtype=torch.long) for k,v in subdocs.items()}
          require(min(map(len,subids.values()))>=10 and min(v.numel() for v in streams18.values())>10000,'GATE_TOO_SMALL')
          # Akinator: derive bounded menu from observed dual-gain R17 points; no new open-ended search.
          menu=[.0001,.00003,.00001]
          observed={x['lr']:x for x in geometry['summary']}
          require(all(observed[lr]['dual_gain_seed_count']==2 for lr in menu),'MENU_EVIDENCE')
          seeds=[27021,27022]; attempts=60
          arms=['fixed_3e-4','fixed_1e-4','trust_region']
          gate_keys=['adapt_fit_gate','retain_fit_gate']
          final_keys=['adapt_eval','retain_eval']
          gate_seed=78131; gate_batches=8; final_seed=46117; final_batches=24
          step_radius=.07; total_radius=.5
          # Descriptive strict gate: improve adaptation by >= 1e-6 relative to current,
          # no increase in retention versus current or parent, no increase versus parent
          # on adaptation. Three explicit deterministic views, not learned critics.
          def views(current,candidate,parent_gate,step_norm,total_norm):
              valid=all(math.isfinite(v) and v>0 for v in candidate.values())
              return {'adaptation':valid and candidate[gate_keys[0]]<=current[gate_keys[0]]*(1-1e-6) and candidate[gate_keys[0]]<=parent_gate[gate_keys[0]],'retention':valid and candidate[gate_keys[1]]<=current[gate_keys[1]] and candidate[gate_keys[1]]<=parent_gate[gate_keys[1]],'geometry':math.isfinite(step_norm) and math.isfinite(total_norm) and step_norm<=step_radius and total_norm<=total_radius}
          def captain(v,cur,cand,par,step_norm,total_norm):
              a,b=gate_keys
              ok=(all(math.isfinite(x) and x>0 for x in cand.values()) and (cur[a]-cand[a])>=cur[a]*1e-6 and cand[a]<=par[a] and cand[b]<=min(cur[b],par[b]) and 0<=step_norm<=step_radius and 0<=total_norm<=total_radius)
              return all(v.values())==ok and set(v)=={'adaptation','retention','geometry'} and ok
          def evaluate(model,keys,batches,seed):
              model.eval()
              out={k:eval_loss(model,streams18[k],batches,8,seed) for k in keys}
              require(all(math.isfinite(v) and v>0 for v in out.values()),'INVALID_EVAL')
              return out
          def l2_dist(a,b):
              return math.sqrt(sum(float((a[k].detach().double()-b[k].detach().double()).square().sum()) for k in a))
          def opt_seal(opt):
              # Include tensor values and all optimizer scalar/group state in rollback proof.
              ts={}; 
              def encode(v,p):
                  if isinstance(v,torch.Tensor):
                      ts[p]=v; return {'tensor':p}
                  if isinstance(v,dict): return {str(k):encode(x,p+'/'+str(k)) for k,x in sorted(v.items(),key=lambda a:str(a[0]))}
                  if isinstance(v,(tuple,list)): return [encode(x,p+'/'+str(i)) for i,x in enumerate(v)]
                  return v
              obj=encode(opt.state_dict(),'optimizer')
              return sha((json.dumps(obj,sort_keys=True,allow_nan=False)+tensor_digest(ts)).encode())
          parent_gate=evaluate(teacher,gate_keys,gate_batches,gate_seed)
          baseline=evaluate(teacher,final_keys,final_batches,final_seed)
          # Negative controls use explicit fake metrics only; real rollback control below.
          good={gate_keys[0]:parent_gate[gate_keys[0]]*.99,gate_keys[1]:parent_gate[gate_keys[1]]*.99}
          require(captain(views(parent_gate,good,parent_gate,.01,.02),parent_gate,good,parent_gate,.01,.02),'GOOD_GATE')
          for bad,n,t in [({**good,gate_keys[1]:parent_gate[gate_keys[1]]*1.01},.01,.02),(good,.071,.02),(good,.01,.501),({**good,gate_keys[0]:float('nan')},.01,.02)]:
              require(not captain(views(parent_gate,bad,parent_gate,n,t),parent_gate,bad,parent_gate,n,t),'BAD_GATE')
          require(not captain({'adaptation':True,'retention':True,'geometry':True},parent_gate,good,parent_gate,.071,.02),'FORGED_VIEWS')
          runs=[]; started=time.monotonic()
          for seed in seeds:
              for arm in arms:
                  model,_=load_checkpoint(parent,expected_sha256=parent_sha)
                  model.eval()
                  ps=dict(model.named_parameters())
                  parent_ref={k:v.detach().clone() for k,v in ps.items()}
                  require(tensor_digest(model.state_dict())==before,'ARM_PARENT')
                  opt=torch.optim.AdamW(model.parameters(),lr=.0003,weight_decay=.01)
                  g=torch.Generator().manual_seed(seed+1)
                  current=dict(parent_gate); accepted=0; rejected=0; trial_steps=0; rollback_checks=0; forced_rollback=0; history=[]
                  for attempt in range(attempts):
                      x,y=batch_from(streams18['adapt_fit_train'],8,model.config.context_length,g)
                      opt.zero_grad(set_to_none=True)
                      _,loss=model(x,y); require(bool(torch.isfinite(loss)),'FIT_LOSS')
                      loss.backward()
                      require(all(v.grad is not None and bool(torch.isfinite(v.grad).all()) for v in ps.values()),'GRAD')
                      torch.nn.utils.clip_grad_norm_(model.parameters(),1.0,error_if_nonfinite=True)
                      if arm!='trust_region':
                          lr=.0003 if arm=='fixed_3e-4' else .0001
                          for group in opt.param_groups: group['lr']=lr
                          opt.step(); accepted+=1; trial_steps+=1
                          require(all(bool(torch.isfinite(p).all()) for p in ps.values()),'FIXED_NONFINITE')
                          continue
                      old={k:v.detach().clone() for k,v in model.state_dict().items()}
                      oldp={k:v.detach().clone() for k,v in ps.items()}
                      oldopt=copy.deepcopy(opt.state_dict())
                      oldhash=tensor_digest(old); oldoh=opt_seal(opt)
                      def restore():
                          model.load_state_dict(old,strict=True)
                          opt.load_state_dict(copy.deepcopy(oldopt))
                          require(tensor_digest(model.state_dict())==oldhash and opt_seal(opt)==oldoh,'ROLLBACK_MISMATCH')
                      # Real optimizer-state rollback witness, with no impact on subsequent comparison.
                      if attempt==0:
                          for group in opt.param_groups: group['lr']=menu[0]
                          opt.step()
                          require(tensor_digest(model.state_dict())!=oldhash and opt_seal(opt)!=oldoh,'ROLLBACK_CONTROL_NO_CHANGE')
                          restore(); forced_rollback+=1
                      selected=None
                      for lr in menu:
                          for group in opt.param_groups: group['lr']=lr
                          opt.step(); trial_steps+=1
                          step_norm=l2_dist(ps,oldp); total_norm=l2_dist(ps,parent_ref)
                          # Candidate metrics stay confined to historical gate cohorts.
                          if not all(bool(torch.isfinite(v).all()) for v in ps.values()):
                              cand={k:float('inf') for k in gate_keys}
                          else: cand=evaluate(model,gate_keys,gate_batches,gate_seed)
                          v=views(current,cand,parent_gate,step_norm,total_norm)
                          admit=captain(v,current,cand,parent_gate,step_norm,total_norm)
                          if admit:
                              # Captain replays the actual same frozen gate batches.
                              recheck=evaluate(model,gate_keys,gate_batches,gate_seed)
                              require(all(abs(recheck[k]-cand[k])<=1e-10 for k in gate_keys),'CAPTAIN_REPLAY')
                              current=cand; selected=lr; accepted+=1
                          else:
                              restore(); rejected+=1; rollback_checks+=1
                          history.append({'attempt':attempt,'lr':lr,'decision':'SHADOW_COMMIT' if admit else 'ROLLBACK','views':v,'step_norm':step_norm,'total_norm':total_norm,'gate':{k:x if math.isfinite(x) else None for k,x in cand.items()}})
                          if admit: break
                      if selected is None: require(tensor_digest(model.state_dict())==oldhash and opt_seal(opt)==oldoh,'ABSTAIN_MUTATION')
                  opt.zero_grad(set_to_none=True)
                  gate=evaluate(model,gate_keys,gate_batches,gate_seed)
                  final=evaluate(model,final_keys,final_batches,final_seed)
                  row={'seed':seed,'arm':arm,'attempts':attempts,'accepted':accepted,'abstained':attempts-accepted,'rejected_trials':rejected,'trial_optimizer_steps':trial_steps,'rollback_checks':rollback_checks,'forced_rollback_control':forced_rollback,'final_displacement':l2_dist(ps,parent_ref),'gate':gate,'final':final,'relative_delta':{k:final[k]/baseline[k]-1 for k in final_keys},'history':history}
                  require(sha(parent.read_bytes())==parent_sha and state_digest()==before,'PARENT_CHANGED')
                  if arm=='trust_region':
                      require(rollback_checks==rejected and forced_rollback==1 and row['final_displacement']<=total_radius and all(gate[k]<=parent_gate[k] for k in gate_keys),'TRUST_INVARIANT')
                  runs.append(row)
                  print('AUTODIDACT_R18_ARM',json.dumps({k:v for k,v in row.items() if k!='history'},sort_keys=True,allow_nan=False),flush=True)
                  del model,opt
          require(len(runs)==6 and len({(r['seed'],r['arm']) for r in runs})==6,'ARM_COUNT')
          summary=[]
          for arm in arms:
              rs=[r for r in runs if r['arm']==arm]
              summary.append({'arm':arm,'mean_relative_delta':{k:statistics.mean(r['relative_delta'][k] for r in rs) for k in final_keys},'dual_gain_seeds':sum(all(r['relative_delta'][k]<0 for k in final_keys) for r in rs),'accepted_steps':sum(r['accepted'] for r in rs),'rollback_checks':sum(r['rollback_checks'] for r in rs),'trial_optimizer_steps':sum(r['trial_optimizer_steps'] for r in rs)})
          result={'schema':'janus.autodidact.r18.adaptive_trust_region.v1','prior_run':45888778318,'prior_sha256':sha(geometry_raw),'parent_sha256':parent_sha,'parent_state_digest':before,'registry_commit':commit,'cohorts':{k:{'documents':len(v),'id_digest':sha('\n'.join(sorted(v)).encode())} for k,v in subids.items()},'design':{'seeds':seeds,'attempts':attempts,'menu':menu,'step_radius':step_radius,'total_radius':total_radius,'gate_seed':gate_seed,'gate_batches':gate_batches,'final_seed':final_seed,'final_batches':final_batches,'mode':'eval dropout disabled with real AdamW, same training batches per seed across arms; gate extra compute'},'parent_gate':parent_gate,'baseline':baseline,'runs':runs,'summary':summary,'gate_controls':6,'elapsed_seconds':time.monotonic()-started,'sovereign':'HOLD_INDEPENDENT_EXAM','claim_ceiling':{'historical_proxy_cohorts':True,'independent_semantic_exam_passed':False,'causal_root_proven':False,'parent_weights_changed':False,'production_changed':False,'candidate_weights_exported':False,'promotion_authority':False,'automatic_dispatch':False}}
          out=Path(os.environ['RUNNER_TEMP'])/'autodidact-r18.json'
          out.write_text(json.dumps(result,indent=2,sort_keys=True,allow_nan=False)+'\n')
          print('AUTODIDACT_R18_RESULT',json.dumps({k:v for k,v in result.items() if k!='runs'},sort_keys=True,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autodidact-r18-metrics-only
          path: ${{ runner.temp }}/autodidact-r18.json
          if-no-files-found: error
          retention-days: 30
