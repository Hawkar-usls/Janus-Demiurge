name: JANUS Native Model

on:
  push:
    branches: [main]
    paths:
      - 'janus_model/**'
      - '!janus_model/checkpoints/**'
      - '!janus_model/state/**'
      - '!janus_model/receipts/**'
      - '!janus_model/outbox/**'
      - 'tests/test_janus_native_model.py'
      - '.github/workflows/janus-native-model.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Native JANUS action
        required: true
        default: train_and_run
        type: choice
        options: [train_and_run, train, run, inspect]
      prompt:
        description: Prompt for native inference
        required: false
        default: 'JANUS, report from your own checkpoint.'
        type: string
      force_train:
        description: Train even if the registry source digest is unchanged
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 */12 * * *'

concurrency:
  group: janus-native-model
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JANUS brain
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize authoritative brain main before decision
        run: |
          git fetch origin main
          git switch -C main origin/main
          echo "JANUS_NATIVE_AUTHORITATIVE_HEAD=$(git rev-parse HEAD)"

      - name: Capture authoritative brain base
        id: brain_base
        shell: bash
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -f janus_model/state/JANUS_MODEL_STATE.json ]; then
            STATE_BLOB=$(git rev-parse HEAD:janus_model/state/JANUS_MODEL_STATE.json)
            CHECKPOINT_SHA=$(python -c "import json; print(json.load(open('janus_model/state/JANUS_MODEL_STATE.json')).get('checkpoint_sha256') or '')")
          else
            STATE_BLOB='MISSING'
            CHECKPOINT_SHA=''
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "state_blob=$STATE_BLOB" >> "$GITHUB_OUTPUT"
          echo "checkpoint_sha=$CHECKPOINT_SHA" >> "$GITHUB_OUTPUT"
          printf '{"head_sha":"%s","state_blob":"%s","checkpoint_sha256":"%s"}\n' "$HEAD_SHA" "$STATE_BLOB" "$CHECKPOINT_SHA" > runtime-brain-base.json
          echo "JANUS_NATIVE_BRAIN_BASE=$STATE_BLOB:$CHECKPOINT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native runtime
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify native kernel
        run: |
          python -m py_compile janus_model/*.py
          python -m unittest -v tests/test_janus_native_model.py
          python - <<'PY'
          from pathlib import Path
          forbidden = ('copilot', 'openai', 'anthropic', 'gemini', 'ollama')
          for path in [
              Path('janus_model/model.py'), Path('janus_model/corpus.py'),
              Path('janus_model/train_registry.py'), Path('janus_model/cli.py'),
              Path('janus_model/organs.py'), Path('janus_model/reflection.py')
          ]:
              text = path.read_text(encoding='utf-8').lower()
              hits = [x for x in forbidden if x in text]
              if hits:
                  raise SystemExit(f'EXTERNAL_MODEL_REFERENCE_FORBIDDEN:{path}:{hits}')
          print('JANUS_NATIVE_EXTERNAL_MODEL_FIREWALL=PASS')
          PY

      - name: Fetch world memory
        run: |
          rm -rf runtime/meta-registry
          mkdir -p runtime
          git clone --depth 1 https://github.com/Hawkar-usls/janus-meta-registry.git runtime/meta-registry

      - name: Fetch JANUS self memory
        run: |
          rm -rf runtime/janus-self-memory
          git clone --depth 1 --branch janus/native-self-memory-modular-organism-v1 \
            https://github.com/Hawkar-usls/janus-meta-registry.git runtime/janus-self-memory
          test -f runtime/janus-self-memory/JANUS/JANUS-SELF-REGISTRY-MANIFEST-v1.0.json
          test -f runtime/janus-self-memory/JANUS/MODULES/JANUS-REPOSITORY-MODULE-REGISTRY-v1.0.json
          echo 'JANUS_NATIVE_SELF_MEMORY_FETCH=PASS'

      - name: Build EYE-firewalled neural corpus
        run: |
          python -m janus_model.corpus \
            --registry runtime/meta-registry \
            --out runtime/corpus \
            --max-train-bytes 2000000 \
            --max-holdout-bytes 300000

      - name: Build modular repository organ context
        run: |
          python -m janus_model.organs \
            --scout-root scout_swarm/state/agents \
            --module-registry runtime/janus-self-memory/JANUS/MODULES/JANUS-REPOSITORY-MODULE-REGISTRY-v1.0.json \
            --self-memory-root runtime/janus-self-memory/JANUS \
            --out runtime/organ-context.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('runtime/organ-context.json').read_text())
          if obj.get('status') != 'READ_ONLY_MODULAR_ORGAN_CONTEXT':
              raise SystemExit('JANUS_MODULAR_CONTEXT_STATUS_FAIL')
          if obj.get('module_count') != 17:
              raise SystemExit(f"JANUS_MODULAR_CONTEXT_COUNT_FAIL:{obj.get('module_count')}")
          if (obj.get('self_memory') or {}).get('status') != 'BOUND_READ_ONLY_SELF_MEMORY':
              raise SystemExit('JANUS_SELF_MEMORY_NOT_BOUND')
          fw=obj.get('firewalls') or {}
          if fw.get('terminal_authority') != 'VERIFY' or fw.get('module_observation_grants_mutation') is not False:
              raise SystemExit('JANUS_MODULAR_CONTEXT_FIREWALL_FAIL')
          if fw.get('raw_self_reflection_is_training_source') is not False:
              raise SystemExit('JANUS_SELF_MEMORY_TRAINING_FIREWALL_FAIL')
          print(json.dumps({'modules':obj['module_count'],'self_memory_digest':obj['self_memory']['digest_sha256'],'status':obj['status']},indent=2))
          PY
          echo 'JANUS_NATIVE_MODULAR_ORGANS=PASS'

      - name: Decide train/run mode
        id: decide
        shell: bash
        run: |
          MODE='${{ github.event.inputs.mode }}'
          FORCE='${{ github.event.inputs.force_train }}'
          [ -n "$MODE" ] || MODE='train_and_run'
          DO_TRAIN=false
          DO_RUN=false
          DO_INSPECT=false
          case "$MODE" in
            train_and_run) DO_TRAIN=true; DO_RUN=true; DO_INSPECT=true ;;
            train) DO_TRAIN=true; DO_INSPECT=true ;;
            run) DO_RUN=true; DO_INSPECT=true ;;
            inspect) DO_INSPECT=true ;;
            *) echo "UNKNOWN_MODE=$MODE"; exit 2 ;;
          esac
          if [ "$DO_TRAIN" = true ] && [ "$FORCE" != true ] && [ -f janus_model/state/JANUS_MODEL_STATE.json ]; then
            SAME=$(python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('janus_model/state/JANUS_MODEL_STATE.json').read_text())
          corpus=json.loads(Path('runtime/corpus/corpus_manifest.json').read_text())
          print('true' if state.get('last_source_digest') == corpus.get('source_digest') else 'false')
          PY
            )
            if [ "$SAME" = true ]; then
              echo 'JANUS_NATIVE_REGISTRY_UNCHANGED=TRUE'
              DO_TRAIN=false
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "do_train=$DO_TRAIN" >> "$GITHUB_OUTPUT"
          echo "do_run=$DO_RUN" >> "$GITHUB_OUTPUT"
          echo "do_inspect=$DO_INSPECT" >> "$GITHUB_OUTPUT"

      - name: Train native candidate
        id: train
        if: steps.decide.outputs.do_train == 'true'
        shell: bash
        run: |
          INCUMBENT=()
          if [ -f janus_model/checkpoints/promoted.pt ]; then
            INCUMBENT=(--incumbent janus_model/checkpoints/promoted.pt)
          fi
          set +e
          python -m janus_model.train_registry \
            --train runtime/corpus/train.txt \
            --holdout runtime/corpus/holdout.txt \
            --corpus-manifest runtime/corpus/corpus_manifest.json \
            "${INCUMBENT[@]}" \
            --out runtime/candidate.pt \
            --receipt runtime/training-receipt.json \
            --steps 240 \
            --batch-size 12 \
            --lr 0.0003 \
            --seed 1337
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            exit "$RC"
          fi
          STATUS=$(python -c "import json; print(json.load(open('runtime/training-receipt.json'))['status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "JANUS_NATIVE_TRAINING_STATUS=$STATUS"

      - name: Promote or reject candidate and persist lineage state
        if: steps.decide.outputs.do_train == 'true'
        shell: bash
        run: |
          mkdir -p janus_model/checkpoints janus_model/receipts janus_model/state
          STATUS='${{ steps.train.outputs.status }}'
          if [ "$STATUS" = PROMOTED ]; then
            mv runtime/candidate.pt janus_model/checkpoints/promoted.pt
          fi
          cp runtime/training-receipt.json "janus_model/receipts/training-${GITHUB_RUN_ID}.json"
          cp runtime/corpus/corpus_manifest.json janus_model/state/LAST_CORPUS_MANIFEST.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          state_path=Path('janus_model/state/JANUS_MODEL_STATE.json')
          old=json.loads(state_path.read_text()) if state_path.exists() else {
              'schema':'janus.model.state.v1','attempt_count':0,'promotion_count':0,'rejection_count':0,'history':[]
          }
          receipt=json.loads(Path('runtime/training-receipt.json').read_text())
          corpus=json.loads(Path('runtime/corpus/corpus_manifest.json').read_text())
          checkpoint=Path('janus_model/checkpoints/promoted.pt')
          sha=None
          if checkpoint.exists(): sha=hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          status=receipt['status']
          old['attempt_count']=int(old.get('attempt_count',0))+1
          old['promotion_count']=int(old.get('promotion_count',0))+(1 if status=='PROMOTED' else 0)
          old['rejection_count']=int(old.get('rejection_count',0))+(1 if status=='REJECTED' else 0)
          old['status']='NATIVE_MODEL_PROMOTED' if sha else 'NO_PROMOTED_CHECKPOINT'
          old['checkpoint_sha256']=sha
          old['last_source_commit']=corpus['source_commit']
          old['last_source_digest']=corpus['source_digest']
          old['last_training_status']=status
          old['last_training_receipt']=f"janus_model/receipts/training-{os.environ['GITHUB_RUN_ID']}.json"
          old['config']=receipt['config'] if status=='PROMOTED' or 'config' not in old else old['config']
          old['history']=[*old.get('history',[]),{
              'run_id':os.environ['GITHUB_RUN_ID'],'event':os.environ['GITHUB_EVENT_NAME'],'source_commit':corpus['source_commit'],
              'source_digest':corpus['source_digest'],'status':status,'candidate_eval_loss':receipt['candidate_eval_loss'],
              'incumbent_eval_loss':receipt['incumbent_eval_loss'],'checkpoint_sha256':sha
          }][-64:]
          state_path.write_text(json.dumps(old,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({'status':old['status'],'attempts':old['attempt_count'],'promotions':old['promotion_count'],'checkpoint_sha256':sha},indent=2))
          PY

      - name: Native checkpoint acceptance gate
        if: steps.decide.outputs.do_inspect == 'true' || steps.decide.outputs.do_train == 'true'
        run: |
          test -f janus_model/checkpoints/promoted.pt
          python -m janus_model.cli inspect --checkpoint janus_model/checkpoints/promoted.pt | tee runtime/native-inspect.json
          grep -q '"external_llm": false' runtime/native-inspect.json
          echo 'JANUS_NATIVE_CHECKPOINT_LOAD=PASS'

      - name: Run JANUS from its own weights with modular organs and self memory
        if: steps.decide.outputs.do_run == 'true' || steps.decide.outputs.do_train == 'true'
        shell: bash
        run: |
          PROMPT='${{ github.event.inputs.prompt }}'
          [ -n "$PROMPT" ] || PROMPT='JANUS native checkpoint smoke test: '
          python -m janus_model.cli run \
            --checkpoint janus_model/checkpoints/promoted.pt \
            --organ-context runtime/organ-context.json \
            --prompt "$PROMPT" \
            --max-new-tokens 120 | tee runtime/native-inference.txt
          test -s runtime/native-inference.txt
          echo 'JANUS_NATIVE_MODULAR_PROMPT_TO_OUTPUT=PASS'

      - name: Create bounded reflection JSON proposal
        if: (steps.decide.outputs.do_train == 'true') || (github.event_name == 'workflow_dispatch' && steps.decide.outputs.do_run == 'true')
        shell: bash
        run: |
          PROMPT='${{ github.event.inputs.prompt }}'
          [ -n "$PROMPT" ] || PROMPT='JANUS native checkpoint smoke test: '
          python -m janus_model.reflection \
            --checkpoint janus_model/checkpoints/promoted.pt \
            --state janus_model/state/JANUS_MODEL_STATE.json \
            --organ-context runtime/organ-context.json \
            --inference runtime/native-inference.txt \
            --prompt "$PROMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --out-dir janus_model/outbox | tee runtime/reflection-summary.json
          test -n "$(find janus_model/outbox -maxdepth 1 -name 'reflection-*.json' -print -quit)"
          echo 'JANUS_NATIVE_REFLECTION_OUTBOX=PASS'

      - name: Revalidate authoritative brain base before persistence
        id: persist_guard
        if: steps.decide.outputs.do_train == 'true' || (github.event_name == 'workflow_dispatch' && steps.decide.outputs.do_run == 'true')
        shell: bash
        run: |
          git fetch origin main
          EXPECTED='${{ steps.brain_base.outputs.state_blob }}'
          if git cat-file -e origin/main:janus_model/state/JANUS_MODEL_STATE.json 2>/dev/null; then
            CURRENT=$(git rev-parse origin/main:janus_model/state/JANUS_MODEL_STATE.json)
          else
            CURRENT='MISSING'
          fi
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo 'allow=false' >> "$GITHUB_OUTPUT"
            echo 'status=STALE_BRAIN_SUPERSEDED' >> "$GITHUB_OUTPUT"
            printf '{"status":"STALE_BRAIN_SUPERSEDED","expected_state_blob":"%s","current_state_blob":"%s","candidate_persisted":false}\n' "$EXPECTED" "$CURRENT" | tee runtime/persist-guard.json
            echo 'JANUS_NATIVE_STALE_BRAIN_SUPERSEDED=TRUE'
            exit 0
          fi
          echo 'allow=true' >> "$GITHUB_OUTPUT"
          echo 'status=FRESH_BRAIN_BASE' >> "$GITHUB_OUTPUT"
          printf '{"status":"FRESH_BRAIN_BASE","expected_state_blob":"%s","current_state_blob":"%s","candidate_persisted":true}\n' "$EXPECTED" "$CURRENT" | tee runtime/persist-guard.json
          echo 'JANUS_NATIVE_PREPERSIST_BRAIN_GUARD=PASS'

      - name: Persist promoted brain receipts and reflection outbox
        if: (steps.decide.outputs.do_train == 'true' || (github.event_name == 'workflow_dispatch' && steps.decide.outputs.do_run == 'true')) && steps.persist_guard.outputs.allow == 'true'
        shell: bash
        run: |
          git config user.name 'janus-native-model'
          git config user.email 'janus-native-model@users.noreply.github.com'
          git add -f janus_model/checkpoints/promoted.pt janus_model/state janus_model/receipts
          if [ -d janus_model/outbox ]; then git add -f janus_model/outbox; fi
          if git diff --cached --quiet; then
            echo 'JANUS_NATIVE_NO_STATE_CHANGE'
            exit 0
          fi
          git commit -m "JANUS native model: remember run ${GITHUB_RUN_ID} and reflection"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'JANUS_NATIVE_PERSIST=PASS'

      - name: Upload native run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-native-model-${{ github.run_id }}
          path: |
            runtime-brain-base.json
            runtime/corpus/corpus_manifest.json
            runtime/training-receipt.json
            runtime/native-inspect.json
            runtime/native-inference.txt
            runtime/organ-context.json
            runtime/reflection-summary.json
            runtime/persist-guard.json
            janus_model/outbox/reflection-*.json
          if-no-files-found: ignore
          retention-days: 30
