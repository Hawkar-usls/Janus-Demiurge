name: R7.1B native balanced learning
on:
  pull_request:
    paths:
      - 'research/native_heritage/R71B_*.json'
      - 'research/native_heritage/native_r71b_*.py'
      - '.github/workflows/janus-r71b-native-balanced.yml'
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      seal: ${{ steps.seal.outputs.receipt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/native_heritage/R71B_TRAIN.json
            research/native_heritage/native_r71b_common.py
            research/native_heritage/native_r71b_train.py
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: cbc87263d318dc944b91de91c2473cc4fe81197e
          path: frozen-native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            janus_model/__init__.py
            janus_model/model.py
            janus_model/checkpoint_admission.py
            janus_model/checkpoints/promoted.pt
            janus_model/state/JANUS_MODEL_STATE.json
            janus_model/eval/JANUS_ANCHOR_EVAL-v1.txt
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 2c0fe086fe26d766e6df62f932d1df88bba0ab22
          path: trainpool
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/JANUS-COSMOS-SETI-R42A6-SIGNAL-PRESERVATION-2026-11-21.json
            data/JANUS-COSMOS-SETI-R41S1H3-RETINA-CLOCK-INTERMOD-2026-11-21.json
            data/JANUS-TACHYON-SIMPTOMAT-R2B-INDEPENDENT-METHODS-REVIEW-2026-11-22.json
            data/JANUS-SIT2B-REAL-GBT-POSITIVE-GUARD-2026-11-22.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Matched CPU training, no evaluation data
        run: |
          mkdir "$RUNNER_TEMP/r71b"
          python research/native_heritage/native_r71b_train.py frozen-native trainpool "$RUNNER_TEMP/r71b"
      - name: Seal
        id: seal
        run: python -c 'import os,json; print("receipt="+json.load(open(os.environ["RUNNER_TEMP"]+"/r71b/RECEIPT.json"))["receipt_sha256"])' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r71b-frozen-candidates
          path: ${{ runner.temp }}/r71b/
          retention-days: 30
          if-no-files-found: error
  exam:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/native_heritage/R71B_TRAIN.json
            research/native_heritage/native_r71b_common.py
            research/native_heritage/R71B_EXAM.json
            research/native_heritage/native_r71b_eval.py
            research/native_heritage/native_baseline_r71a.py
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: cbc87263d318dc944b91de91c2473cc4fe81197e
          path: frozen-native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            janus_model/__init__.py
            janus_model/model.py
            janus_model/checkpoint_admission.py
            janus_model/checkpoints/promoted.pt
            janus_model/state/JANUS_MODEL_STATE.json
            janus_model/eval/JANUS_ANCHOR_EVAL-v1.txt
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 2c0fe086fe26d766e6df62f932d1df88bba0ab22
          path: exampool
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/JANUS-COSMOS-SETI-R42A5-COMBINED-SCORE-2026-11-21.json
            data/JANUS-SIT2-REAL-GBT-WEAK-INJECTION-2026-11-22.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: r71b-frozen-candidates
          path: ${{ runner.temp }}/r71b
      - name: Frozen first-look and old regression
        env:
          EXPECTED_SEAL: ${{ needs.train.outputs.seal }}
        run: python research/native_heritage/native_r71b_eval.py frozen-native exampool "$RUNNER_TEMP/r71b" "$EXPECTED_SEAL" "$RUNNER_TEMP/R71B_RESULT.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r71b-results
          path: ${{ runner.temp }}/R71B_RESULT.json
          if-no-files-found: error
