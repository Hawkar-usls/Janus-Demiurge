name: ESSENCE v4.6 real Qwen LoRA oracle pilot (development only)

on:
  pull_request:
    paths:
      - 'tools/essence_v46_oracle_descendant.py'
      - 'tests/test_essence_v46_oracle_descendant.py'
      - 'research/essence/peer_v46/oracle_lock.json'
      - '.github/workflows/essence-v46-oracle-descendant.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v46_oracle_descendant.py'
      - 'tests/test_essence_v46_oracle_descendant.py'
      - 'research/essence/peer_v46/oracle_lock.json'
      - '.github/workflows/essence-v46-oracle-descendant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v46-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze-oracle-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-network oracle, source-separation and authority tests
        run: |
          python -m py_compile tools/essence_v46_oracle_descendant.py
          python -m unittest -v tests.test_essence_v46_oracle_descendant
      - name: Freeze fixed seed, complete train and unseen holdout commitments
        run: |
          python tools/essence_v46_oracle_descendant.py freeze \
            --lock research/essence/peer_v46/oracle_lock.json \
            --out runtime/essence/v46/freeze.json
      - name: Preserve commitment, no holdout text, no model access
        uses: actions/upload-artifact@v4
        with:
          name: essence-v46-oracle-lock-${{ github.run_id }}
          path: runtime/essence/v46/freeze.json
          if-no-files-found: error
          retention-days: 90

  train-real-lora:
    if: github.event_name != 'pull_request' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    needs: freeze-oracle-cohort
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v46-oracle-lock-${{ github.run_id }}
          path: runtime/essence/v46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU neural training libraries
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Inherit actual Qwen 0.5B weights and train 20 LoRA steps
        run: |
          python tools/essence_v46_oracle_descendant.py train \
            --lock research/essence/peer_v46/oracle_lock.json \
            --freeze runtime/essence/v46/freeze.json \
            --weights runtime/essence/v46/child \
            --out runtime/essence/v46/train-receipt.json
          test -f runtime/essence/v46/child/adapter_model.safetensors
          test -f runtime/essence/v46/child/lineage.json
          python - <<'PY'
          import json
          p=json.load(open('runtime/essence/v46/child/lineage.json'))
          assert p['holdout_exam_performed'] is False
          assert p['automatic_promotion'] is False
          assert p['sentinel_dispatch'] is False
          assert p['steps']==20
          print('Real LoRA safetensors saved: lineage-only, not promoted')
          PY
      - name: Seal separate child checkpoint before exam job
        uses: actions/upload-artifact@v4
        with:
          name: essence-v46-oracle-child-${{ github.run_id }}
          path: |
            runtime/essence/v46/child/
            runtime/essence/v46/train-receipt.json
          retention-days: 90
          if-no-files-found: error

  independent-job-paired-exam:
    needs: [freeze-oracle-cohort, train-real-lora]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v46-oracle-lock-${{ github.run_id }}
          path: runtime/essence/v46
      - uses: actions/download-artifact@v4
        with:
          name: essence-v46-oracle-child-${{ github.run_id }}
          path: runtime/essence/v46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU neural examination libraries
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: First use of holdout inputs after model checkpoint is sealed
        run: |
          python tools/essence_v46_oracle_descendant.py exam \
            --lock research/essence/peer_v46/oracle_lock.json \
            --freeze runtime/essence/v46/freeze.json \
            --weights runtime/essence/v46/child \
            --out runtime/essence/v46/paired-exam.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          v=json.load(open('runtime/essence/v46/paired-exam.json'))
          print('### ESSENCE v4.6: real weights, synthetic oracle')
          print('- Status: '+v['label'])
          print('- Parent token NLL:',v['parent_mean_token_nll'])
          print('- Child token NLL:',v['child_mean_token_nll'])
          print('- Paired difference:',v['paired_nll_improvement'])
          print('- Parent exact accuracy:',v['parent_exact_accuracy'])
          print('- Child exact accuracy:',v['child_exact_accuracy'])
          print('- Total CPU wall seconds:',v['total_cpu_wall_seconds'])
          print('**DEVELOPMENT ONLY**: no outside examiner, no JANUS/Sentinel promotion.')
          PY
      - name: Save immutable experimental paired exam receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v46-first-paired-oracle-exam-${{ github.run_id }}
          path: runtime/essence/v46/paired-exam.json
          retention-days: 90
          if-no-files-found: warn
