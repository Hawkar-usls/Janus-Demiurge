name: ESSENCE v1.6.6 Real GPT Research Shadow Canary

on:
  pull_request:
    paths:
      - 'tools/essence_v166_shadow_canary.py'
      - 'tests/test_essence_v166_shadow_canary.py'
      - 'research/essence/v166/**'
      - '.github/workflows/essence-v166-shadow-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-int8-shadow-only-fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.7.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Refuse forged authority and unsafe research shadow outputs
        run: python -m unittest -v tests/test_essence_v166_shadow_canary.py
      - name: Execute actual trained original and native INT8 candidate in read-only shadow
        run: python tools/essence_v166_shadow_canary.py
      - name: Upload proof of injected failure and exact FP32 in-process fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essence-v166-research-shadow-fallback
          path: runtime/essence_v166/shadow_canary.json
          if-no-files-found: warn
          retention-days: 30
