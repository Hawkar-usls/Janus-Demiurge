name: JANUS Retro Lab - Calibrator History-Only Regression Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-retro-calibration-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Verify deterministic history-only calibration against synthetic fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed and temporal holdout unit tests (no torch required)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -v             -s experiments/ocean_transformer             -p 'test_retro_calibrator.py'
          echo 'All calibrator tests pass. Synthetic fixtures are not evidence of backwards-time messages.' >> "$GITHUB_STEP_SUMMARY"
