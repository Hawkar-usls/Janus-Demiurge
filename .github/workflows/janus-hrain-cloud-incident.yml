name: JANUS HRAiN Cloud Incident Escalation
on:
  workflow_run:
    workflows:
      - JANUS HRAiN Unattended Integrity Gate
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/janus_hrain_cloud_incident.cjs'
      - 'tests/janus_hrain_cloud_incident.test.cjs'
      - '.github/workflows/janus-hrain-cloud-incident.yml'
permissions:
  contents: read
concurrency:
  group: janus-hrain-safety-incident-once
  cancel-in-progress: false
jobs:
  classifier-unit:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/janus_hrain_cloud_incident.cjs
            tests/janus_hrain_cloud_incident.test.cjs
          sparse-checkout-cone-mode: false
      - run: node --test tests/janus_hrain_cloud_incident.test.cjs
  issue-on-new-failure:
    permissions:
      contents: read
      issues: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch classifier only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/janus_hrain_cloud_incident.cjs
            tests/janus_hrain_cloud_incident.test.cjs
          sparse-checkout-cone-mode: false
      - name: Test incident classifier first
        run: node --test tests/janus_hrain_cloud_incident.test.cjs
      - name: Create at most one deduplicated incident
        uses: actions/github-script@v7
        with:
          script: |
            const { classify } = require('./tools/janus_hrain_cloud_incident.cjs');
            const decision = classify(context.payload.workflow_run, context.repo);
            if (!decision) { core.info('Ignored: not a verified main-branch safety failure'); return; }
            const previous = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            if (previous.some(item => !item.pull_request && item.title === decision.title)) {
              core.info('Deduplicated: an integrity incident already exists');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: decision.title,
              body: decision.body
            });
