name: JANUS Keymaster Attribution

on:
  workflow_run:
    workflows: ["JANUS Native Model"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: janus-keymaster-attribution
  cancel-in-progress: false

jobs:
  attribution:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authoritative brain
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize main and capture checkpoint
        id: base
        shell: bash
        run: |
          git fetch origin main
          git switch -C main origin/main
          test -f janus_model/checkpoints/promoted.pt
          CHECKPOINT_SHA=$(python - <<'PY'
          import hashlib
          from pathlib import Path
          print(hashlib.sha256(Path('janus_model/checkpoints/promoted.pt').read_bytes()).hexdigest())
          PY
          )
          STATE_SHA=$(python -c "import json; print(json.load(open('janus_model/state/JANUS_MODEL_STATE.json'))['checkpoint_sha256'])")
          test "$CHECKPOINT_SHA" = "$STATE_SHA"
          echo "checkpoint_sha=$CHECKPOINT_SHA" >> "$GITHUB_OUTPUT"
          echo "JANUS_ATTRIBUTION_BASE_CHECKPOINT=$CHECKPOINT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native runtime
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify Keymaster attribution kernel
        run: |
          python -m py_compile janus_model/keymaster.py janus_model/corpus.py janus_model/attribution.py
          python -m unittest -v tests/test_janus_keymaster.py tests/test_janus_attribution.py

      - name: Fetch world memory
        run: |
          rm -rf runtime/meta-registry
          mkdir -p runtime
          git clone --depth 1 https://github.com/Hawkar-usls/janus-meta-registry.git runtime/meta-registry

      - name: Build exact 8-of-8 corpus and packs
        run: |
          python -m janus_model.corpus \
            --registry runtime/meta-registry \
            --out runtime/corpus \
            --max-train-bytes 2000000 \
            --max-holdout-bytes 300000

      - name: Decide whether this checkpoint/source pair is new
        id: decide
        shell: bash
        run: |
          RUN=true
          SOURCE_DIGEST=$(python -c "import json; print(json.load(open('runtime/corpus/corpus_manifest.json'))['source_digest'])")
          if [ -f janus_model/state/KEYMASTER_ATTRIBUTION_LATEST.json ]; then
            SAME=$(python - <<'PY'
          import json
          latest=json.load(open('janus_model/state/KEYMASTER_ATTRIBUTION_LATEST.json'))
          corpus=json.load(open('runtime/corpus/corpus_manifest.json'))
          state=json.load(open('janus_model/state/JANUS_MODEL_STATE.json'))
          ok=(latest.get('source_digest')==corpus.get('source_digest') and latest.get('checkpoint_sha256')==state.get('checkpoint_sha256'))
          print('true' if ok else 'false')
          PY
            )
            if [ "$SAME" = true ]; then RUN=false; fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "source_digest=$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "JANUS_ATTRIBUTION_NEW_PAIR=$RUN:$SOURCE_DIGEST"

      - name: Run full/core leave-one-out attribution matrix
        if: steps.decide.outputs.run == 'true'
        run: |
          python -m janus_model.attribution \
            --registry-train runtime/corpus/registry_train.txt \
            --holdout runtime/corpus/holdout.txt \
            --keymaster-dir runtime/keymaster \
            --corpus-manifest runtime/corpus/corpus_manifest.json \
            --incumbent janus_model/checkpoints/promoted.pt \
            --out runtime/keymaster-attribution.json \
            --steps 80 \
            --batch-size 12 \
            --lr 0.0003 \
            --seed 7331

      - name: Verify attribution claim ceiling
        if: steps.decide.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          x=json.load(open('runtime/keymaster-attribution.json'))
          assert x['schema']=='janus.keymaster.attribution_ablation_ledger.v1'
          assert x['status']=='COMPLETE_SINGLE_SEED_DIAGNOSTIC'
          assert x['variant_count']==17
          assert len(x['attribution'])==8
          ids={v['variant_id'] for v in x['variants']}
          assert 'FULL_8_OF_8' in ids and 'CORE_5_OF_5' in ids and 'EXTENDED_3_OF_3' in ids
          assert sum(v['kind']=='FULL_LEAVE_ONE_OUT' for v in x['variants'])==8
          assert sum(v['kind']=='CORE_LEAVE_ONE_OUT' for v in x['variants'])==5
          c=x['claim_ceiling']
          assert c['single_seed_establishes_causality'] is False
          assert c['ablation_signal_grants_authority'] is False
          assert c['automatic_contributor_removal'] is False
          assert c['automatic_weighting_change'] is False
          assert c['authority_delta']==0
          print('JANUS_KEYMASTER_ATTRIBUTION_17_VARIANTS=PASS')
          PY

      - name: Revalidate checkpoint before persistence
        id: fresh
        if: steps.decide.outputs.run == 'true'
        shell: bash
        run: |
          git fetch origin main
          CURRENT=$(git show origin/main:janus_model/state/JANUS_MODEL_STATE.json | python -c "import json,sys; print(json.load(sys.stdin)['checkpoint_sha256'])")
          EXPECTED='${{ steps.base.outputs.checkpoint_sha }}'
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo 'allow=false' >> "$GITHUB_OUTPUT"
            echo "JANUS_ATTRIBUTION_STALE_CHECKPOINT=$EXPECTED:$CURRENT"
          else
            echo 'allow=true' >> "$GITHUB_OUTPUT"
            echo 'JANUS_ATTRIBUTION_CHECKPOINT_FRESH=PASS'
          fi

      - name: Persist attribution ledger
        if: steps.decide.outputs.run == 'true' && steps.fresh.outputs.allow == 'true'
        shell: bash
        run: |
          mkdir -p janus_model/state janus_model/receipts
          cp runtime/keymaster-attribution.json janus_model/state/KEYMASTER_ATTRIBUTION_LATEST.json
          cp runtime/keymaster-attribution.json "janus_model/receipts/keymaster-attribution-${GITHUB_RUN_ID}.json"
          git config user.name 'janus-keymaster-attribution'
          git config user.email 'janus-keymaster-attribution@users.noreply.github.com'
          git add -f janus_model/state/KEYMASTER_ATTRIBUTION_LATEST.json "janus_model/receipts/keymaster-attribution-${GITHUB_RUN_ID}.json"
          if git diff --cached --quiet; then
            echo 'JANUS_ATTRIBUTION_NO_STATE_CHANGE'
            exit 0
          fi
          git commit -m "JANUS Keymaster attribution: remember run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          CURRENT=$(python -c "import json; print(json.load(open('janus_model/state/JANUS_MODEL_STATE.json'))['checkpoint_sha256'])")
          EXPECTED='${{ steps.base.outputs.checkpoint_sha }}'
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo 'JANUS_ATTRIBUTION_REBASE_SUPERSEDED_CHECKPOINT'
            exit 0
          fi
          git push origin HEAD:main
          echo 'JANUS_KEYMASTER_ATTRIBUTION_PERSIST=PASS'

      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-keymaster-attribution-${{ github.run_id }}
          path: |
            runtime/corpus/corpus_manifest.json
            runtime/keymaster/manifest.json
            runtime/keymaster-attribution.json
          if-no-files-found: ignore
          retention-days: 30
