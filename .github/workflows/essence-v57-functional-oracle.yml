name: ESSENCE v5.7 functional replay and fresh mathematical LoRA experiment

on:
  pull_request:
    paths:
      - 'tools/essence_v57_functional_lora.py'
      - 'tests/test_essence_v57_functional_lora.py'
      - 'research/essence/functional_v57/FROZEN_LOCK.json'
      - '.github/workflows/essence-v57-functional-oracle.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v57_functional_lora.py'
      - 'tests/test_essence_v57_functional_lora.py'
      - 'research/essence/functional_v57/FROZEN_LOCK.json'
      - '.github/workflows/essence-v57-functional-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v57-one-shot-function-oracle
  cancel-in-progress: false

env:
  ROOT: runtime/essence/v57
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'

jobs:
  offline-frozen-oracle-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify G3 parent lock, disjoint oracle domains, fail-closed admission
        run: |
          python -m py_compile tools/essence_v57_functional_lora.py tests/test_essence_v57_functional_lora.py
          python -m unittest -v tests.test_essence_v57_functional_lora

  freeze-source-before-train:
    needs: offline-frozen-oracle-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true' && vars.ESSENCE_V57_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.preregister.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v57/state
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Commit training source oracle only, no heldout sample creation
        id: preregister
        run: |
          python -m tools.essence_v57_functional_lora plan \
            --state "$ROOT/state" --code-root . --out "$ROOT/plan.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("runtime/essence/v57/plan.json"))
          print("ready="+str(p["action"]=="TRAIN_SHADOW").lower())
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("runtime/essence/v57/plan.json"))
          print("### ESSENCE v5.7 oracle training plan")
          print("Action:",p["action"])
          print("Parent:",p.get("parent_generation"))
          print("Training count:",p.get("training_count"))
          print("Holdout bytes created during plan:",not p.get("holdout_rows_not_generated",True))
          print("No production or Sentinel mutation.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v57-plan-${{ github.run_id }}
          path: runtime/essence/v57/plan.json
          retention-days: 90
          if-no-files-found: error

  train-functional-g3-child:
    needs: freeze-source-before-train
    if: needs.freeze-source-before-train.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v57/state
          persist-credentials: false
          sparse-checkout: |
            models/v54gen0003
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v57-plan-${{ github.run_id }}
          path: runtime/essence/v57
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install fixed CPU LoRA dependencies, never peer requirements
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Train genuine G3 LoRA on 96 new functional, 72 rehearsal and old-skill examples
        run: |
          python -m tools.essence_v57_functional_lora train \
            --plan "$ROOT/plan.json" \
            --parent "$ROOT/state/models/v54gen0003" \
            --child "$ROOT/child" \
            --out "$ROOT/train.json"
          test -s "$ROOT/child/adapter_model.safetensors"
          test -s "$ROOT/child/lineage.json"
          echo "V57_REAL_ORACLE_TRAINING_COMPLETED_BEFORE_HELDOUT=true" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v57-functional-child-${{ github.run_id }}
          path: |
            runtime/essence/v57/child/
            runtime/essence/v57/train.json
          retention-days: 90
          if-no-files-found: error

  first-look-distinct-functional-exam:
    needs: [freeze-source-before-train,train-functional-g3-child]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v57/state
          persist-credentials: false
          sparse-checkout: |
            models/v54gen0003
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v57-plan-${{ github.run_id }}
          path: runtime/essence/v57
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v57-functional-child-${{ github.run_id }}
          path: runtime/essence/v57
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install pinned read-only Qwen examiner
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Open untouched 48-task exam; compare G3 vs functional-replay candidate and old-skill retention
        run: |
          python -m tools.essence_v57_functional_lora exam \
            --plan "$ROOT/plan.json" \
            --parent "$ROOT/state/models/v54gen0003" \
            --child "$ROOT/child" \
            --out "$ROOT/exam.json"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("runtime/essence/v57/exam.json"))
          print("### ESSENCE v5.7 first-look mathematical neural test")
          print("Verdict:",d["status"])
          print("Unseen 48-task results:",d["metric"]["fresh_functional"])
          print("Old retention:",d["metric"]["old_skill_retention"])
          print("Newly correct:",d["newly_correct"])
          print("Previously correct lost:",d["previously_correct_lost"])
          print("Internal prospective same-owner research only.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v57-functional-exam-${{ github.run_id }}
          path: runtime/essence/v57/exam.json
          retention-days: 90
          if-no-files-found: error

  persist-one-shot-research-verdict:
    needs: [freeze-source-before-train,train-functional-g3-child,first-look-distinct-functional-exam]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-peer-shadow-state
          path: runtime/essence/v57/state
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v57-plan-${{ github.run_id }}
          path: runtime/essence/v57
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v57-functional-child-${{ github.run_id }}
          path: runtime/essence/v57
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v57-functional-exam-${{ github.run_id }}
          path: runtime/essence/v57
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Revalidate received sealed exam and persist only one bounded shadow verdict
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.essence_v57_functional_lora publish \
            --state "$ROOT/state" --plan "$ROOT/plan.json" \
            --child "$ROOT/child" --exam "$ROOT/exam.json" \
            --out "$ROOT/decision.json"
          cd "$ROOT/state"
          git config user.name 'ESSENCE v5.7 research ledger[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/essence/functional_v57_state/ledger.json
          if [[ -d models/v57funcgen0004 ]]; then
            git add -f models/v57funcgen0004
          fi
          git diff --cached --check
          git diff --cached --name-only > /tmp/v57-staged.txt
          python - <<'PY'
          import re
          from pathlib import Path
          names=Path("/tmp/v57-staged.txt").read_text().splitlines()
          allowed=re.compile(r"^(?:research/essence/functional_v57_state/ledger\.json|models/v57funcgen0004/(?:adapter_model\.safetensors|adapter_config\.json|lineage\.json|README\.md))$")
          if "research/essence/functional_v57_state/ledger.json" not in names:
              raise SystemExit("V57_MISSING_VERDICT")
          if len(names)>5 or any(not allowed.fullmatch(x) for x in names):
              raise SystemExit("V57_UNAUTHORIZED_GITHUB_WRITE")
          PY
          git commit -m 'ESSENCE v5.7: one prospective functional oracle exam and optional accepted shadow child'
          git pull --rebase origin essence-peer-shadow-state
          git push origin HEAD:refs/heads/essence-peer-shadow-state
          echo "V57_PROSPECTIVE_FUNCTIONAL_VERDICT_SAVED=true" >> "$GITHUB_STEP_SUMMARY"
