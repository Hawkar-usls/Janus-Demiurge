name: ESSENCE v4.0 original Physarum + CODEX GPT research microcore

on:
  pull_request:
    paths:
      - 'tools/essence_v40_physarum_bridge.py'
      - 'tests/test_essence_v40_physarum_bridge.py'
      - '.github/workflows/essence-v40-physarum-bridge.yml'
      - 'tools/essence_v30_active_evolution.py'
      - 'tests/test_essence_v30_active_evolution.py'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v40_physarum_bridge.py'
      - 'tests/test_essence_v40_physarum_bridge.py'
      - '.github/workflows/essence-v40-physarum-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v40-physarum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-pinned-physarum-and-sibling-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded CPU Torch, no original Physarum execution
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Adversarial tests original source derivation, Tero flow, Jones swarm and G3 tensor inheritance
        run: |
          python -m py_compile tools/essence_v40_physarum_bridge.py
          python -m unittest -v \
            tests.test_essence_v40_physarum_bridge \
            tests.test_essence_v39_g3 \
            tests.test_essence_v38_inheritance \
            tests.test_essence_v37_codex_gpt \
            tests.test_essence_v36_juxtapose_exact
      - name: Download preserved real G3 weights and original G2 source freeze
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: essence-v39-g3-checkpoint-43649912620
          run-id: 43649912620
          github-token: ${{ github.token }}
          path: runtime/essence/v40/g3
      - name: Download pinned G1/G2/G3 development corpus lock
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: essence-v38-freeze-43648008998
          run-id: 43648008998
          github-token: ${{ github.token }}
          path: runtime/essence/v40
      - name: Run actual G3-based CODEX sibling trial and source-derived Physarum hyperparameter search
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
        run: |
          python -m tools.essence_v40_physarum_bridge \
            --repo-root . \
            --g3-dir runtime/essence/v40/g3 \
            --freeze runtime/essence/v40/freeze.json \
            --out-dir runtime/essence/v40/physarum-trial
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.essence_v38_inheritance import sha
          d=json.loads(Path('runtime/essence/v40/physarum-trial/physarum-development-trial.json').read_text())
          assert d['receipt_sha256'] == sha({k:v for k,v in d.items() if k!='receipt_sha256'})
          assert d['measured_train_steps_including_probes'] == 22
          assert d['sibling_results']['physarum']['actual_neural_update'] is True
          assert d['sibling_results']['control']['actual_neural_update'] is True
          assert d['g3_external_cohort_consumed'] is False
          assert d['future_blind_generalization_proven'] is False
          assert d['production_authority'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as s:
              s.write('### Original Physarum + CODEX GPT G3 sibling development trial\n')
              s.write('Selected: '+str(d['decision']['selected'])+'\n')
              for name, row in d['sibling_results'].items():
                  s.write(name+' development loss: '+str(row['development_validation_loss'])+'\n')
              s.write('Total training work including probes: 22 steps; no G3 external holdout reused.\n')
              s.write('No independent external gain or production promotion claimed.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v40-physarum-research-${{ github.run_id }}
          path: runtime/essence/v40/physarum-trial/
          if-no-files-found: warn
          retention-days: 90
