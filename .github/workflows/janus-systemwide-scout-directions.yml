name: JANUS Whole-System Scout Directions 17

on:
  pull_request:
    branches: [main]
    paths:
      - 'scout_swarm/missions/JANUS_FULL_SYSTEM_SCOUT_DIRECTIONS-2026-08-22-v1.json'
      - 'tools/demiurge_systemwide_scout_runner.py'
      - 'tools/demiurge_systemwide_independent_evidence.py'
      - 'tools/demiurge_systemwide_frontier_gates.py'
      - '.github/workflows/janus-systemwide-scout-directions.yml'
  push:
    branches: [main]
    paths:
      - 'scout_swarm/missions/JANUS_FULL_SYSTEM_SCOUT_DIRECTIONS-2026-08-22-v1.json'
      - 'tools/demiurge_systemwide_scout_runner.py'
      - 'tools/demiurge_systemwide_independent_evidence.py'
      - 'tools/demiurge_systemwide_frontier_gates.py'
      - '.github/workflows/janus-systemwide-scout-directions.yml'
  workflow_dispatch:

concurrency:
  group: janus-whole-system-scout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Validate whole-system mission and frontier gates
        run: |
          python tools/demiurge_systemwide_scout_runner.py --self-test
          python tools/demiurge_systemwide_frontier_gates.py --self-test
      - name: Build 17-Scout matrix
        id: matrix
        shell: bash
        run: |
          MATRIX=$(python tools/demiurge_systemwide_scout_runner.py --matrix)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  scout:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Run ${{ matrix.id }} / ${{ matrix.track }}
        run: |
          mkdir -p runtime/${{ matrix.id }}
          python tools/demiurge_systemwide_scout_runner.py \
            --run-agent '${{ matrix.id }}' \
            --output runtime/${{ matrix.id }}/report.json
      - name: Expand deterministic public evidence
        run: |
          python tools/demiurge_systemwide_independent_evidence.py \
            --report runtime/${{ matrix.id }}/report.json
      - name: Run high-information frontier gates
        run: |
          python tools/demiurge_systemwide_frontier_gates.py \
            --report runtime/${{ matrix.id }}/report.json
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-systemwide-${{ matrix.id }}
          path: runtime/${{ matrix.id }}/report.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always()
    needs: [plan, scout]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mission branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Download Scout reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: janus-systemwide-*
          path: runtime/reports
      - name: Consolidate whole-system spiral turn
        run: |
          python tools/demiurge_systemwide_scout_runner.py \
            --consolidate runtime/reports \
            --run-id '${{ github.run_id }}' \
            --sha '${{ github.sha }}'
      - name: Persist append-only result
        shell: bash
        run: |
          BRANCH='${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}'
          git config user.name "janus-whole-system-scout"
          git config user.email "janus-whole-system-scout@users.noreply.github.com"
          git add -f scout_swarm/outbox/public_research scout_swarm/state/public_research
          if git diff --cached --quiet; then
            echo "JANUS_SYSTEMWIDE_NO_CHANGES"
            exit 0
          fi
          git commit -m "Whole-system scout: persist spiral turn ${{ github.run_id }}"
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
          echo "JANUS_SYSTEMWIDE_PERSIST=PASS"
