name: JANUS SENTINEL shared A/B/C recovery membrane

on:
  workflow_call:
    inputs:
      role:
        type: string
        required: true
      recovery_only:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  guardian:
    if: vars.SENTINEL_PAUSED != 'true' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: janus-sentinel-${{ inputs.role }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: sentinel-state
          path: runtime/sentinel/state
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact shared Torch CPU runtime only if A/B checkpoint exists
        if: inputs.role != 'C'
        run: |
          if [ -f runtime/sentinel/state/sentinel/model/checkpoint.json ]; then
            python -m pip install --disable-pip-version-check \
              torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          else
            echo "NO_MODEL_YET — deterministic guardian monitoring active"
          fi
      - name: Verify exact data-only GitHub branch state
        run: |
          set -euo pipefail
          test -f runtime/sentinel/state/sentinel/recovery.json
          test ! -L runtime/sentinel/state/sentinel/recovery.json
          python - <<'PY'
          from tools.sentinel_core import read_json,state_check
          state=state_check(read_json("runtime/sentinel/state/sentinel/recovery.json"))
          assert state["production_model_updates"] is False
          print("SENTINEL_DATA_ONLY_STATE_VERIFIED; epoch",state["epoch"])
          PY
      - name: Observe peer workers and GitHub Actions state (read-only)
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          SENTINEL_ROLE: ${{ inputs.role }}
          SENTINEL_RECOVERY_ONLY: ${{ inputs.recovery_only }}
        run: |
          set -euo pipefail
          mkdir -p runtime/sentinel/output
          python -m tools.sentinel_core observe \
            --role "$SENTINEL_ROLE" \
            --run-id "${{ github.run_id }}" \
            --state runtime/sentinel/state/sentinel/recovery.json \
            --out runtime/sentinel/output/plan.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path("runtime/sentinel/output/plan.json").read_text())
          assert p["production_model_updates"] is False
          assert p["model_has_dispatch_authority"] is False
          assert p["recovery_actions_at_most_one"] is True
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("target="+(p["target"] or "")+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### JANUS SENTINEL "+p["role"]+"\n")
              for role,item in p["statuses"].items():
                  f.write(f"- {role}: {item['status']} (run {item['last_run_id']})\n")
              f.write("Recovery proposed: "+str(p["target"])+"\n")
              f.write("OBSERVE_ONLY if this is an automated recovery request: "+os.environ["SENTINEL_RECOVERY_ONLY"]+"\n")
              f.write("No model autonomy / no production authority / no 24-hour uptime guarantee.\n")
          PY
      - name: Atomically claim at most one recovery by Git ref CAS (NO force/rebase)
        id: claim
        if: steps.observe.outputs.target != '' && !inputs.recovery_only
        env:
          CHECKOUT: runtime/sentinel/state
        run: |
          set -euo pipefail
          python -m tools.sentinel_core claim \
            --plan runtime/sentinel/output/plan.json \
            --state "$CHECKOUT/sentinel/recovery.json" \
            --out runtime/sentinel/output/claim.json
          cp runtime/sentinel/output/claim.json "$CHECKOUT/sentinel/recovery.json"
          git -C "$CHECKOUT" config user.name "github-actions[bot]"
          git -C "$CHECKOUT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$CHECKOUT" add -f sentinel/recovery.json
          git -C "$CHECKOUT" commit -m "JANUS SENTINEL: fenced one-target recovery claim on run ${{ github.run_id }}"
          # Ordinary non-force push is our atomic compare-and-swap.
          # In a race, the loser fails closed and cannot dispatch.
          if git -C "$CHECKOUT" push origin HEAD:refs/heads/sentinel-state; then
            echo "won=true" >> "$GITHUB_OUTPUT"
          else
            # A different guardian won the non-force CAS. No dispatch is
            # authorized; this is an expected split-brain fence, not uptime.
            echo "SENTINEL_HOLD_CAS_LOST_NO_DISPATCH" >> "$GITHUB_STEP_SUMMARY"
            echo "won=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify claim and dispatch exactly one preallowed same-repo workflow
        if: steps.claim.outputs.won == 'true' && !inputs.recovery_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.sentinel_core dispatch \
            --plan runtime/sentinel/output/plan.json \
            --state runtime/sentinel/state/sentinel/recovery.json \
            --out runtime/sentinel/output/dispatch.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path("runtime/sentinel/output/dispatch.json").read_text())
          assert report["accepted"] is True and report["status"]==204
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Recovery dispatch submitted (NOT proof of target recovery).\n")
          PY
      - name: Persist observation, claim and dispatch outcomes as bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-sentinel-${{ inputs.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/sentinel/output/
          retention-days: 30
          if-no-files-found: warn
