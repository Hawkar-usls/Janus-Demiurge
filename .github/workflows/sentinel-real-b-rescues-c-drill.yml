name: JANUS SENTINEL bounded real B-to-C failover drill

on:
  pull_request:
    paths:
      - 'tools/sentinel_core.py'
      - 'tools/sentinel_live_failover_drill.py'
      - 'tests/test_sentinel_core.py'
      - 'tests/test_sentinel_live_failover_drill.py'
      - '.github/workflows/sentinel-real-b-rescues-c-drill.yml'
  push:
    branches: [main]
    paths:
      - 'research/sentinel/locks/b-to-c-minute-one-shot-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-sentinel-one-real-recovery-drill
  cancel-in-progress: false

jobs:
  negative-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify cooldown, real GH identity and no arbitrary workflows
        run: |
          python -m py_compile tools/sentinel_core.py tools/sentinel_live_failover_drill.py
          python -m unittest -v tests.test_sentinel_core tests.test_sentinel_live_failover_drill

  b-restores-c-real:
    if: github.event_name != 'pull_request' && github.run_attempt == 1 && vars.SENTINEL_PAUSED != 'true' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 57
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run safety negative controls
        run: |
          python -m py_compile tools/sentinel_core.py tools/sentinel_live_failover_drill.py
          python -m unittest -v tests.test_sentinel_core tests.test_sentinel_live_failover_drill
      - name: Prove actual failed C, Git CAS claim from B, and exact new successful C
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime/sentinel/b-to-c
          python -m tools.sentinel_live_failover_drill \
            --mode CB \
            --run-id "${{ github.run_id }}" \
            --out runtime/sentinel/b-to-c/failover-drill-receipt.json
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          from tools.sentinel_live_failover_drill import canonical,SCHEMA
          data=json.loads(Path('runtime/sentinel/b-to-c/failover-drill-receipt.json').read_text())
          assert data['schema']==SCHEMA
          assert data['status']=='PASS_REAL_GH_B_RESCUES_C'
          assert data['drill_mode']=='CB'
          assert data['claims']['C']['issuer']=='B'
          assert data['actual_git_cas_claims_observed']==1
          assert data['recovery_runs_verified']==1
          assert data['production_authority'] is False
          assert data['touches_live_production'] is False
          assert data['receipt_sha256']==hashlib.sha256(canonical(
              {k:v for k,v in data.items() if k!='receipt_sha256'}
          )).hexdigest()
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### SENTINEL: genuine B → C rescue PASS\n')
              f.write('Original C failure: '+str(data['faults']['C'])+'\n')
              f.write('CAS claim issued by B: '+str(data['claims']['C'])+'\n')
              f.write('New successful C: '+str(data['recovery_runs']['C'])+'\n')
              f.write('Receipt SHA256: '+data['receipt_sha256']+'\n')
              f.write('Single bounded test; GitHub common failure domain persists.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-sentinel-real-b-rescues-c-${{ github.run_id }}
          path: runtime/sentinel/b-to-c/failover-drill-receipt.json
          retention-days: 90
          if-no-files-found: warn
