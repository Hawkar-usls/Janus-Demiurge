name: JANUS Activator Credentialless Mailbox

on:
  pull_request:
    branches: [main]
    paths:
      - 'protocol/ACTIVATOR_CREDENTIALLESS_MAILBOX-v1.0.json'
      - 'protocol/ACTIVATOR_OIDC_MAILBOX_IDENTITY-v1.1.json'
      - 'tools/activator_mailbox_poller.py'
      - 'tools/activator_mailbox_worker.py'
      - 'tools/activator_oidc_identity.py'
      - 'tests/test_activator_mailbox.py'
      - 'tests/test_activator_oidc_identity.py'
      - 'tests/test_activator_oidc_mailbox.py'
      - '.github/workflows/janus-activator-credentialless-mailbox.yml'
  push:
    branches: [main]
    paths:
      - 'protocol/ACTIVATOR_CREDENTIALLESS_MAILBOX-v1.0.json'
      - 'protocol/ACTIVATOR_OIDC_MAILBOX_IDENTITY-v1.1.json'
      - 'tools/activator_mailbox_poller.py'
      - 'tools/activator_mailbox_worker.py'
      - 'tools/activator_oidc_identity.py'
      - 'tests/test_activator_mailbox.py'
      - 'tests/test_activator_oidc_identity.py'
      - 'tests/test_activator_oidc_mailbox.py'
      - '.github/workflows/janus-activator-credentialless-mailbox.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: janus-activator-credentialless-mailbox
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and OIDC crypto dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.10,<3'
      - name: Compile mailbox, OIDC verifier and adversarial tests
        run: |
          python -m compileall -q \
            tools/activator_mailbox_poller.py \
            tools/activator_mailbox_worker.py \
            tools/activator_oidc_identity.py \
            tests/test_activator_mailbox.py \
            tests/test_activator_oidc_identity.py \
            tests/test_activator_oidc_mailbox.py
      - name: Validate v1.0 firewall and OIDC v1.1 constitution
        run: |
          python -m json.tool protocol/ACTIVATOR_CREDENTIALLESS_MAILBOX-v1.0.json >/dev/null
          python -m json.tool protocol/ACTIVATOR_OIDC_MAILBOX_IDENTITY-v1.1.json >/dev/null
          python - <<'PY'
          import json
          v10=json.load(open('protocol/ACTIVATOR_CREDENTIALLESS_MAILBOX-v1.0.json'))
          assert v10['execution_firewall']['credentialless_v1_0_execution_enabled'] is False
          assert v10['execution_firewall']['execution_claim_allowed_before_identity_verification'] is False
          v11=json.load(open('protocol/ACTIVATOR_OIDC_MAILBOX_IDENTITY-v1.1.json'))
          assert v11['status'] == 'PACKET_ACK_IDENTITY_GATE_ONLY'
          assert v11['stage_v1_1']['accepted_object_kinds'] == ['DISPATCH_PACKET']
          assert v11['stage_v1_1']['execution_grant_enabled'] is False
          assert v11['stage_v1_1']['execution_claim_enabled'] is False
          assert v11['subject_policy']['exact_sub_match_required'] is False
          assert v11['historical_attestation_semantics']['jwt_is_bearer_authorization'] is False
          print('MAILBOX_V10_FIREWALL=PASS')
          print('MAILBOX_OIDC_V11_PACKET_ACK_GATE=PASS')
          PY
      - name: Run legacy firewall and OIDC identity adversarial tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_activator_mailbox.py \
            tests/test_activator_oidc_identity.py \
            tests/test_activator_oidc_mailbox.py

  poll-and-respond:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out canonical Demiurge control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OIDC signature verifier
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.10,<3'

      - name: Pull HOME mailbox and verify OIDC source identities before materialization
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          rm -rf runtime/activator-mailbox
          python tools/activator_mailbox_poller.py \
            --out-dir runtime/activator-mailbox/requests

      - name: Enforce packet-only stage before worker
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'runtime/activator-mailbox/requests/*.grant.envelope.json' >/dev/null; then
            echo 'CREDENTIALLESS_GRANT_REACHED_V11_PACKET_WORKER_BOUNDARY=TRUE'
            exit 1
          fi
          echo 'CREDENTIALLESS_V11_EXECUTION_CLAIM_ATTEMPTED=FALSE'
          echo 'CREDENTIALLESS_V11_EXECUTION_ENABLED=FALSE'

      - name: Process legacy ACKs and independently reverify/sign OIDC ACKs
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          target_head_sha="$(git rev-parse HEAD)"
          mkdir -p runtime/activator-mailbox/responses
          shopt -s nullglob
          for envelope in runtime/activator-mailbox/requests/*.packet.envelope.json runtime/activator-mailbox/requests/*.oidc-packet.envelope.json; do
            python tools/activator_mailbox_worker.py \
              --envelope "$envelope" \
              --repo-root . \
              --target-head-sha "$target_head_sha" \
              --out-dir runtime/activator-mailbox/responses
          done
          echo "TARGET_CHECKED_OUT_SHA=$target_head_sha"
          echo "TARGET_EXECUTION_PERFORMED=FALSE"
          echo "CROSS_REPOSITORY_WRITE=FALSE"
          echo "TARGET_MAILBOX_WRITE_USES_LOCAL_GITHUB_TOKEN_ONLY=TRUE"
          echo "OIDC_RESPONSE_TOKEN_USED_AS_BEARER_AUTHORIZATION=FALSE"

      - name: Preserve response set outside mailbox branch
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/janus-mailbox-responses"
          mkdir -p "$export_dir"
          cp -a runtime/activator-mailbox/responses/. "$export_dir/" 2>/dev/null || true
          echo "JANUS_MAILBOX_RESPONSES=$export_dir" >> "$GITHUB_ENV"

      - name: Publish append-only ACKs to Demiurge-owned mailbox branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JANUS Demiurge Mailbox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin janus/activator-mailbox:refs/remotes/origin/janus/activator-mailbox
          git switch --create janus/activator-mailbox --track origin/janus/activator-mailbox
          mkdir -p .janus/mailbox/inbox
          shopt -s nullglob
          for response in "$JANUS_MAILBOX_RESPONSES"/*.json; do
            name="$(basename "$response")"
            if [ ! -e ".janus/mailbox/inbox/$name" ]; then
              cp "$response" ".janus/mailbox/inbox/$name"
            fi
          done
          git add .janus/mailbox/inbox
          if git diff --cached --quiet; then
            echo "MAILBOX_RESPONSE_DELTA=NONE"
          else
            git commit -m "Activator mailbox: publish credentialless ACK ${GITHUB_RUN_ID}"
            git push origin HEAD:janus/activator-mailbox
            echo "MAILBOX_RESPONSE_DELTA=PUBLISHED"
          fi
