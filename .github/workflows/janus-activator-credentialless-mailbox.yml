name: JANUS Activator Credentialless Mailbox

on:
  pull_request:
    branches: [main]
    paths:
      - 'protocol/ACTIVATOR_CREDENTIALLESS_MAILBOX-v1.0.json'
      - 'tools/activator_mailbox_poller.py'
      - 'tools/activator_mailbox_worker.py'
      - 'tools/activator_execution_claim.py'
      - 'tests/test_activator_mailbox.py'
      - 'tests/test_activator_execution_claim.py'
      - '.github/workflows/janus-activator-credentialless-mailbox.yml'
  push:
    branches: [main]
    paths:
      - 'protocol/ACTIVATOR_CREDENTIALLESS_MAILBOX-v1.0.json'
      - 'tools/activator_mailbox_poller.py'
      - 'tools/activator_mailbox_worker.py'
      - 'tools/activator_execution_claim.py'
      - 'tests/test_activator_mailbox.py'
      - 'tests/test_activator_execution_claim.py'
      - '.github/workflows/janus-activator-credentialless-mailbox.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: janus-activator-credentialless-mailbox
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile mailbox transport and cross-lane claim
        run: |
          python -m compileall -q \
            tools/activator_mailbox_poller.py \
            tools/activator_mailbox_worker.py \
            tools/activator_execution_claim.py \
            tests/test_activator_mailbox.py \
            tests/test_activator_execution_claim.py
      - name: Validate mailbox constitution
        run: python -m json.tool protocol/ACTIVATOR_CREDENTIALLESS_MAILBOX-v1.0.json >/dev/null
      - name: Run mailbox and exactly-once adversarial tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_activator_mailbox.py tests/test_activator_execution_claim.py

  poll-and-respond:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out canonical Demiurge control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull HOME mailbox through public read-only boundary
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          rm -rf runtime/activator-mailbox
          python tools/activator_mailbox_poller.py \
            --out-dir runtime/activator-mailbox/requests

      - name: Process packet ACKs and exactly-once execution requests
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_head_sha="$(git rev-parse HEAD)"
          test "$target_head_sha" = "$(git rev-parse HEAD)"
          mkdir -p runtime/activator-mailbox/responses runtime/activator-mailbox/claims runtime/activator-mailbox/grants
          shopt -s nullglob
          for envelope in runtime/activator-mailbox/requests/*.envelope.json; do
            if [[ "$envelope" == *.grant.envelope.json ]]; then
              base="$(basename "$envelope" .grant.envelope.json)"
              grant="runtime/activator-mailbox/grants/${base}.json"
              python - "$envelope" "$grant" <<'PY'
          import json,sys
          env=json.load(open(sys.argv[1], encoding='utf-8'))
          json.dump(env['object'], open(sys.argv[2], 'w', encoding='utf-8'), ensure_ascii=False, indent=2, sort_keys=True)
          PY
              claim="runtime/activator-mailbox/claims/${base}.json"
              python tools/activator_execution_claim.py \
                --grant "$grant" \
                --transport-lane CREDENTIALLESS_PULL_MAILBOX \
                --workflow-run-id "$GITHUB_RUN_ID" \
                --output "$claim"
              permitted="$(python - "$claim" <<'PY'
          import json,sys
          row=json.load(open(sys.argv[1]))
          print('true' if row.get('execution_permitted') is True else 'false')
          PY
              )"
              if [ "$permitted" != "true" ]; then
                echo "MAILBOX_GRANT_SUPPRESSED_BY_CROSS_LANE_CLAIM=$base"
                continue
              fi
            fi
            python tools/activator_mailbox_worker.py \
              --envelope "$envelope" \
              --repo-root . \
              --target-head-sha "$target_head_sha" \
              --out-dir runtime/activator-mailbox/responses
          done
          echo "TARGET_CHECKED_OUT_SHA=$target_head_sha"
          echo "CROSS_REPOSITORY_WRITE=FALSE"
          echo "TARGET_MAILBOX_WRITE_USES_LOCAL_GITHUB_TOKEN_ONLY=TRUE"

      - name: Preserve response set outside mailbox branch
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/janus-mailbox-responses"
          mkdir -p "$export_dir"
          cp -a runtime/activator-mailbox/responses/. "$export_dir/" 2>/dev/null || true
          echo "JANUS_MAILBOX_RESPONSES=$export_dir" >> "$GITHUB_ENV"

      - name: Publish append-only responses to Demiurge-owned mailbox branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JANUS Demiurge Mailbox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin janus/activator-mailbox:refs/remotes/origin/janus/activator-mailbox
          git switch --create janus/activator-mailbox --track origin/janus/activator-mailbox
          mkdir -p .janus/mailbox/inbox
          shopt -s nullglob
          for response in "$JANUS_MAILBOX_RESPONSES"/*.json; do
            name="$(basename "$response")"
            if [ ! -e ".janus/mailbox/inbox/$name" ]; then
              cp "$response" ".janus/mailbox/inbox/$name"
            fi
          done
          git add .janus/mailbox/inbox
          if git diff --cached --quiet; then
            echo "MAILBOX_RESPONSE_DELTA=NONE"
          else
            git commit -m "Activator mailbox: publish credentialless response ${GITHUB_RUN_ID}"
            git push origin HEAD:janus/activator-mailbox
            echo "MAILBOX_RESPONSE_DELTA=PUBLISHED"
          fi
