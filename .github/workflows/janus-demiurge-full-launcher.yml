name: JANUS Demiurge Full Launcher v1.1

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan the full wake without dispatching child workflows'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'demiurge/FULL_WAKE_REQUEST.json'

concurrency:
  group: janus-demiurge-full-launcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout launcher source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate proof-carrying wake request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          p='demiurge/FULL_WAKE_REQUEST.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['schema']=='janus.demiurge.full_wake_request.v1'
          assert x['armed'] is True
          assert x['mode']=='FULL_DEMIURGE_WAKE'
          assert isinstance(x['request_id'],str) and re.fullmatch(r'[A-Za-z0-9._:-]{8,128}',x['request_id'])
          assert x['authority_delta']==0
          assert x['grants_admission'] is False
          assert x['grants_lifecycle'] is False
          print(f"JANUS_DEMIURGE_WAKE_REQUEST=PASS:{x['request_id']}")
          PY

      - name: Bind launcher source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "JANUS_DEMIURGE_LAUNCH_SOURCE_SHA=$SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify full-launcher contract
        run: |
          python -m pip install pytest
          pytest -q tests/test_demiurge_full_launcher.py
          python -m py_compile tools/demiurge_full_launcher.py

      - name: Launch every active manual Demiurge surface
        id: launch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          ARGS=(
            --policy demiurge/DEMIURGE_LAUNCHER_POLICY.json
            --repo "$GITHUB_REPOSITORY"
            --source-sha "$SOURCE_SHA"
            --workflow-dir .github/workflows
            --out runtime/DEMIURGE_FULL_LAUNCH_RECEIPT.json
          )
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python tools/demiurge_full_launcher.py "${ARGS[@]}"

      - name: Validate receipt authority ceiling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime/DEMIURGE_FULL_LAUNCH_RECEIPT.json
          python - <<'PY'
          import json
          p='runtime/DEMIURGE_FULL_LAUNCH_RECEIPT.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['schema']=='janus.demiurge.full_launcher_receipt.v1'
          assert x['authority_delta']==0
          a=x['authority']
          assert a['launcher_is_admission'] is False
          assert a['launcher_grants_code_admission'] is False
          assert a['launcher_grants_lifecycle'] is False
          assert a['launcher_grants_evidence_status'] is False
          assert a['launcher_bypasses_nexus'] is False
          assert a['launcher_bypasses_auditor'] is False
          assert x['law']=='LAUNCHER_MAY_WAKE_NE_LAUNCHER_MAY_CROWN'
          print('JANUS_DEMIURGE_FULL_LAUNCHER_AUTHORITY_CEILING=PASS')
          print(f"JANUS_DEMIURGE_FULL_LAUNCHABLE={x['manual_active_launchable']}")
          print(f"JANUS_DEMIURGE_FULL_DISPATCHED={x['dispatched_count']}")
          print(f"JANUS_DEMIURGE_FULL_FAILURES={x['dispatch_failure_count']}")
          PY

      - name: Upload full-launch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-demiurge-full-launch-${{ github.run_id }}
          path: runtime/DEMIURGE_FULL_LAUNCH_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
