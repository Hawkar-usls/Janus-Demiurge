name: ESSENCE v4.3 isolated real HTTP canary and rollback rehearsal

on:
  pull_request:
    paths:
      - 'tools/essence_v43_staging_rollback.py'
      - 'tests/test_essence_v43_staging_rollback.py'
      - '.github/workflows/essence-v43-staging-http-rollback.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v43_staging_rollback.py'
      - 'tests/test_essence_v43_staging_rollback.py'
      - '.github/workflows/essence-v43-staging-http-rollback.yml'

permissions:
  contents: read

concurrency:
  group: essence-v43-staging-rollback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Negative-control routing tests (no checkpoint download)
        run: |
          python -m py_compile tools/essence_v43_staging_rollback.py
          python -m unittest -v tests.test_essence_v43_staging_rollback

  real-local-service-rehearsal:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: essence-v40-physarum-research-43650540561
          run-id: 43650540561
          github-token: ${{ github.token }}
          path: runtime/essence/v43/g4
      - uses: actions/download-artifact@v4
        with:
          name: essence-v42-sealed-cost-checkpoints-43652825898
          run-id: 43652825898
          github-token: ${{ github.token }}
          path: runtime/essence/v43/budget14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify and serve exact unchanged models in isolated loopback HTTP process, inject fault and rollback
        run: |
          python -m tools.essence_v43_staging_rollback rehearse \
            --baseline14-dir runtime/essence/v43/budget14/baseline14 \
            --physarum-dir runtime/essence/v43/g4/physarum \
            --stage-dir runtime/essence/v43/staging-ephemeral \
            --out runtime/essence/v43/rehearsal-receipt.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.essence_v43_staging_rollback import sha,SCHEMA,ALLOWED
          result=json.loads(Path('runtime/essence/v43/rehearsal-receipt.json').read_text())
          assert result['schema']==SCHEMA
          assert result['receipt_sha256']==sha({
             k:v for k,v in result.items() if k!='receipt_sha256'})
          assert result['status']=='PASS_REAL_ISOLATED_HTTP_CANARY_FAULT_AND_ROLLBACK'
          assert result['canary_real_inference_requests']==100
          assert result['post_rollback_real_inference_requests']==100
          assert result['observed_candidate_fault_http_status']==503
          assert result['original_checkpoint']['sha256']==ALLOWED['baseline14']['sha256']
          assert result['candidate_checkpoint']['sha256']==ALLOWED['physarum']['sha256']
          assert result['pid_preserved'] is True
          assert result['before_after_baseline_byte_identical'] is True
          assert result['actual_production_service_modified'] is False
          assert result['real_production_rollback_proven'] is False
          assert result['production_authority'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report:
              report.write('### ESSENCE actual HTTP staging rollout and rollback\n')
              report.write('100 true Physarum inference HTTP requests; injected HTTP 503; ')
              report.write('100 true fixed-baseline HTTP requests on the SAME live PID.\n')
              report.write('Exact baseline output digest restored: YES.\n')
              report.write('Average request times: '+str(result['candidate_http_latency'])+' / ')
              report.write(str(result['restored_http_latency'])+'\n')
              report.write('ISOLATED STAGING ONLY — NO PRODUCTION ROLLBACK PROVEN; SCIENCE HOLD.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essence-v43-stage-http-rollback-${{ github.run_id }}
          path: runtime/essence/v43/rehearsal-receipt.json
          if-no-files-found: warn
          retention-days: 90
