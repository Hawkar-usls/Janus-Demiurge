name: AUTODIDACT R1.1 bounded profile diagnostic
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/autodidact-r11-profile-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: autodidact-r11-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'Hawkar-usls/Janus-Demiurge' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/autodidact-r11-profile-diagnostic-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fc4293c972c231e9b06dd286a74c840b69131baa
          path: brain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 106463de92f57fb21785c59146b63e3013aaaa62
          path: registry
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fixed paired retrospective diagnostic (no checkpoint output)
        working-directory: brain
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, random, statistics, subprocess
          from pathlib import Path
          import torch
          from janus_model.corpus import scrub
          from janus_model.train_registry import batch_from, eval_loss, load_checkpoint
          from janus_model.model import ByteTokenizer
          def sha(b): return hashlib.sha256(b).hexdigest()
          def require(ok, msg):
              if not ok: raise RuntimeError(msg)
          torch.set_num_threads(2)
          torch.set_num_interop_threads(1)
          root=Path('../registry').resolve()
          parent=Path('janus_model/checkpoints/promoted.pt')
          parent_sha='06d7e6228ca9aef2dc58eb55fe1c805aa3b66e4f8fb90b0e946ce6af47b1a662'
          require(sha(parent.read_bytes()) == parent_sha,'PARENT_HASH')
          manifest_path=Path('janus_model/state/LAST_CORPUS_MANIFEST.json')
          manifest=json.loads(manifest_path.read_text())
          source_commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          require(source_commit == manifest['source_commit'] == '106463de92f57fb21785c59146b63e3013aaaa62','SOURCE_IDENTITY')
          # Only historical train-labeled records; no production holdout or anchor
          # is read by this diagnostic. This is NOT a fresh independent exam.
          protected={r['sha256'] for r in manifest['records'] if r['split']=='holdout'}
          seen=set(); parts={'fit':[],'development':[]}; ids={'fit':[],'development':[]}
          for row in sorted(manifest['records'],key=lambda x:x['path']):
              if row['split']!='train': continue
              h=row['sha256']
              require(h not in protected and int(h[:8],16)%10 != 0,'PROTECTED_SOURCE')
              if h in seen: continue
              seen.add(h)
              p=root/row['path']
              require(p.resolve().is_relative_to(root) and p.is_file() and not p.is_symlink(),'SOURCE_PATH')
              raw=p.read_bytes()
              require(sha(raw)==h and len(raw)==row['bytes'],'SOURCE_BYTES')
              text=scrub(raw.decode('utf-8',errors='replace'))
              # Frozen, capped diagnostic subset; not the full production corpus.
              text=text.encode()[:65536].decode('utf-8',errors='ignore')
              key='development' if int(sha(('autodidact-r11-development:'+h).encode())[:8],16)%5==0 else 'fit'
              parts[key].append(text); ids[key].append(h)
          require(not set(ids['fit'])&set(ids['development']),'SPLIT_OVERLAP')
          data={k:'\n\n'.join(v) for k,v in parts.items()}
          streams={k:torch.tensor(ByteTokenizer.encode(v,bos=True,eos=True),dtype=torch.long) for k,v in data.items()}
          require(len(ids['fit'])>=30 and len(ids['development'])>=10 and min(x.numel() for x in streams.values())>10000,'DATA_TOO_SMALL')
          # Fixed arms and paired training seeds, no hyperparameter selection or promotion.
          profiles=[('historical_1',240,0.0003),('historical_2',320,0.0002),('historical_3',180,0.0004),('short_conservative',60,0.00003)]
          seeds=[17021,17022]
          evaluation_seed=38117
          baseline,_=load_checkpoint(parent,expected_sha256=parent_sha)
          before={k:eval_loss(baseline,s,24,8,evaluation_seed) for k,s in streams.items()}
          rows=[{'profile':'no_update_control','steps':0,'fit_loss':before['fit'],'development_loss':before['development'],'relative_development_delta':0.0}]
          del baseline
          for seed in seeds:
              for label,steps,lr in profiles:
                  random.seed(seed); torch.manual_seed(seed)
                  model,_=load_checkpoint(parent,expected_sha256=parent_sha)
                  model.train()
                  opt=torch.optim.AdamW(model.parameters(),lr=lr,weight_decay=.01)
                  g=torch.Generator().manual_seed(seed+1)
                  for i in range(steps):
                      x,y=batch_from(streams['fit'],12,model.config.context_length,g)
                      _,loss=model(x,y)
                      require(bool(torch.isfinite(loss).item()),'NONFINITE_LOSS')
                      opt.zero_grad(set_to_none=True); loss.backward()
                      torch.nn.utils.clip_grad_norm_(model.parameters(),1.0)
                      opt.step()
                  metrics={k:eval_loss(model,s,24,8,evaluation_seed) for k,s in streams.items()}
                  row={'profile':label,'seed':seed,'steps':steps,'lr':lr,'fit_loss':metrics['fit'],'development_loss':metrics['development'],'relative_development_delta':metrics['development']/before['development']-1}
                  rows.append(row); print('AUTODIDACT_R11_ARM',json.dumps(row,sort_keys=True),flush=True)
                  del model,opt
          require(sha(parent.read_bytes())==parent_sha,'PARENT_CHANGED')
          result={'schema':'janus.autodidact.r11.retrospective_profile_diagnostic.v1','parent_sha256':parent_sha,'source_commit':source_commit,'manifest_sha256':sha(manifest_path.read_bytes()),'splits':{k:{'docs':len(ids[k]),'source_hashes':ids[k],'text_sha256':sha(data[k].encode()),'bytes':len(data[k].encode())} for k in data},'baseline':before,'rows':rows,'seeds':seeds,'evaluation_seed':evaluation_seed,'claim_ceiling':{'historical_training_subset_only':True,'fresh_independent_exam':False,'protected_exam_read':False,'production_changed':False,'candidate_weights_persisted':False,'promotion_authority':False,'causal_root_proven':False}}
          out=Path(os.environ['RUNNER_TEMP'])/'autodidact-r11.json'
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('AUTODIDACT_R11_COMPLETE',json.dumps({'arms':len(rows),'parent_unchanged':True,'independent_exam':'HOLD','promotion_authority':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autodidact-r11-metrics-only
          path: ${{ runner.temp }}/autodidact-r11.json
          if-no-files-found: error
          retention-days: 30
