name: JANUS Sentinel Alpha (SENTINEL A)
run-name: "JANUS SENTINEL A · ${{ inputs.drill_nonce || 'normal' }}"

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/sentinel_core.py'
      - '.github/workflows/sentinel-shared-guardian.yml'
      - '.github/workflows/sentinel-node-a.yml'
  workflow_dispatch:
    inputs:
      recovery_only:
        description: "True if invoked as a safety recovery; do not spawn another workflow"
        type: boolean
        required: false
        default: false
      fault_inject:
        description: "Controlled isolated Sentinel-only failure for recovery test"
        type: boolean
        required: false
        default: false
      drill_nonce:
        description: "Only non-secret sentinel-drill-v1-runID enables test failure"
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'tools/sentinel_core.py'
      - 'tools/sentinel_transformer.py'
      - 'tests/test_sentinel_core.py'
      - '.github/workflows/sentinel-shared-guardian.yml'
      - '.github/workflows/sentinel-node-a.yml'

permissions:
  contents: read

jobs:
  negative-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise A/B/C fault injection and fail-closed SHA/CAS guards
        run: |
          python -m py_compile tools/sentinel_core.py tools/sentinel_transformer.py
          python -m unittest -v tests.test_sentinel_core
  controlled-fault:
    if: github.event_name == 'workflow_dispatch' && inputs.fault_inject && startsWith(inputs.drill_nonce, 'sentinel-drill-v1-') && !inputs.recovery_only
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Fail only this ephemeral Sentinel Actions run; no state or production change
        run: |
          echo "::error::SENTINEL_CONTROLLED_GITHUB_FAULT -- deliberate research-only failure"
          exit 61
  guardian:
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.fault_inject && startsWith(inputs.drill_nonce, 'sentinel-drill-v1-'))
    uses: ./.github/workflows/sentinel-shared-guardian.yml
    with:
      role: 'A'
      recovery_only: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_only || false }}
    permissions:
      contents: write
      actions: write
