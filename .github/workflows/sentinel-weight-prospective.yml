name: JANUS SENTINEL prospective real-neural-weight research admission

on:
  pull_request:
    paths:
      - 'tools/sentinel_weight_gate.py'
      - 'tests/test_sentinel_weight_gate.py'
      - '.github/workflows/sentinel-weight-prospective.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sentinel_weight_gate.py'
      - '.github/workflows/sentinel-weight-prospective.yml'
  schedule:
    - cron: '6,36 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-sentinel-neural-weights-prospective
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse look-ahead, repeated outcomes and false neural weights
        run: |
          python -m py_compile tools/sentinel_weight_gate.py
          python -m unittest -v tests.test_sentinel_weight_gate tests.test_sentinel_forward_calibrate

  prospective-128-real-github-outcomes:
    if: github.event_name != 'pull_request' && vars.SENTINEL_PAUSED != 'true' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: sentinel-state
          path: runtime/sentinel/weight-state
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze new actual post-challenger run IDs and check prospective budget
        id: future
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=runtime/sentinel/weight-state
          FROZEN_AT="$(git -C "$ROOT" log -1 --format=%cI -- sentinel/model/pending-challenge.json)"
          if [ -z "$FROZEN_AT" ]; then
            FROZEN_AT="$(git -C "$ROOT" log -1 --format=%cI -- sentinel/model/checkpoint.json)"
          fi
          test -n "$FROZEN_AT"
          mkdir -p runtime/sentinel/weight-evidence
          echo "$FROZEN_AT" > runtime/sentinel/weight-evidence/frozen-at.txt
          python -m tools.sentinel_weight_gate freeze \
            --state "$ROOT" \
            --freeze-utc "$FROZEN_AT" \
            --out runtime/sentinel/weight-evidence/frozen
          python - <<'PY'
          import json,os
          from pathlib import Path
          info=json.loads(Path('runtime/sentinel/weight-evidence/frozen/preflight.json').read_text())
          assert info['production_authority'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('needs_torch='+str(info['needs_torch']).lower()+chr(10))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('SENTINEL candidate preflight: '+info['status']+chr(10))
              f.write('Truly new post-freeze runs: '+str(info['eligible'])+'/128'+chr(10))
          PY
      - name: Install CPU torch only for sufficient real forward data
        if: steps.future.outputs.needs_torch == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Paired forward test without access to training or future labels
        run: |
          set -euo pipefail
          python -m tools.sentinel_weight_gate assess \
            --state runtime/sentinel/weight-state \
            --freeze-utc "$(cat runtime/sentinel/weight-evidence/frozen-at.txt)" \
            --out runtime/sentinel/weight-evidence/frozen
      - name: Preserve PASS or HOLD and update ONLY shared research weights under non-force CAS
        env:
          ROOT: runtime/sentinel/weight-state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import sentinel_weight_gate as g
          from tools import sentinel_transformer as m
          out=Path('runtime/sentinel/weight-evidence/frozen')
          r=json.loads((out/'result.json').read_text())
          assert r['production_authority'] is False
          assert r['receipt_sha256']==m.digest({
              k:v for k,v in r.items() if k!='receipt_sha256'})
          if r.get('accepted'):
              current=g.frozen_models('runtime/sentinel/weight-state')
              assert current is not None
              winner=m.check_checkpoint(json.loads((out/'accepted.json').read_text()))
              assert winner['parent_checkpoint_sha256']==current[1]['checkpoint_sha256']
              assert winner['accepted_forward_receipt_sha256']==r['receipt_sha256']
          print('SENTINEL_WEIGHTS_RESULT',r['status'])
          PY
          RECORD=runtime/sentinel/weight-evidence/frozen/result.json
          if python -c 'import json;from pathlib import Path;p=Path("runtime/sentinel/weight-evidence/frozen/result.json");exit(0 if json.loads(p.read_text()).get("consumed") else 1)'; then
            mkdir -p "$ROOT/sentinel/model/weight_receipts" "$ROOT/sentinel/model/parents"
            cp "$RECORD" "$ROOT/sentinel/model/weight_receipts/${{ github.run_id }}.json"
            if [ -f runtime/sentinel/weight-evidence/frozen/accepted.json ]; then
              OLD_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/sentinel/weight-state/sentinel/model/checkpoint.json')
          print(json.loads(p.read_text())['checkpoint_sha256'])
          PY
          )"
              cp "$ROOT/sentinel/model/checkpoint.json" "$ROOT/sentinel/model/parents/$OLD_SHA.json"
              cp runtime/sentinel/weight-evidence/frozen/accepted.json "$ROOT/sentinel/model/checkpoint.json"
              echo "SENTINEL_RESEARCH_ONLY_PROSPECTIVE_WEIGHT_DESCENDANT" >> "$GITHUB_STEP_SUMMARY"
            fi
            git -C "$ROOT" rm sentinel/model/pending-challenge.json
            git -C "$ROOT" config user.name "github-actions[bot]"
            git -C "$ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$ROOT" add -f sentinel/model/
            git -C "$ROOT" commit -m "SENTINEL: consume frozen prospective weight gate ${{ github.run_id }}"
            if git -C "$ROOT" push origin HEAD:refs/heads/sentinel-state; then
              echo "SENTINEL_PAIRED_RESULT_GIT_CAS_COMMITTED" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "SENTINEL_HOLD_CONCURRENT_GIT_STATE_MOVED_NO_PROMOTION" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "SENTINEL_NO_NEW_UNSEEN_COHORT_NO_MUTATION" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-neural-weights-forward-${{ github.run_id }}
          path: runtime/sentinel/weight-evidence/
          retention-days: 90
          if-no-files-found: warn
