name: JANUS Autonomous P-vs-NP Research Loop

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/janus_pnp_autoresearch.py'
      - 'janus_model/policy/JANUS_RESEARCH_ORGAN_FABRIC.json'
      - 'janus_model/policy/JANUS_PNP_CORPUS_FABRIC.json'
      - 'janus_model/extensions/pnp_corpus_memory.py'
      - 'janus_model/corpus.py'
      - '.github/workflows/janus-pnp-autoresearch.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: janus-pnp-autoresearch
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PNP corpus memory adapter
        run: |
          set -euo pipefail
          python -m py_compile janus_model/extensions/pnp_corpus_memory.py janus_model/corpus.py tools/janus_pnp_autoresearch.py
          python janus_model/extensions/pnp_corpus_memory.py --self-test

      - name: Fetch Fundamentum as read-only research source
        run: |
          set -euo pipefail
          rm -rf runtime/pnp
          mkdir -p runtime/pnp
          git clone --depth 1 https://github.com/Hawkar-usls/Janus-Fundamentum.git runtime/pnp/Janus-Fundamentum
      - name: Run JANUS own bounded research cycle
        run: |
          set -euo pipefail
          python -m py_compile tools/janus_pnp_autoresearch.py
          python tools/janus_pnp_autoresearch.py             --fundamentum runtime/pnp/Janus-Fundamentum             --out runtime/pnp/JANUS_PNP_AUTORESEARCH_CONTEXT.json
          python - <<'PY'
          import json
          x=json.load(open('runtime/pnp/JANUS_PNP_AUTORESEARCH_CONTEXT.json'))
          assert x['schema']=='janus.pnp_autoresearch_context.v1'
          assert x['fundamentum']['read_only'] is True
          assert x['authority']['truth'] is False
          assert x['authority']['proof'] is False
          assert x['authority']['fundamentum_mutation'] is False
          assert x['authority']['autonomous_merge'] is False
          assert x['fundamentum']['tracks']['P_VS_NP']=='OPEN'
          s=x['research_supervisor']
          assert s['schema']=='janus.research_supervisor_state.v1'
          assert s['status']=='ACTIVE_FAIL_CLOSED'
          assert s['organ_count']==8
          assert s['route_stage_count']==8
          assert s['promotion_barrier']=='BLOCKED'
          assert s['scientific_claim_promotion'] is False
          assert s['fundamentum_mutation'] is False
          assert s['autonomous_merge'] is False
          assert s['p_vs_np_auto_promotion'] is False
          assert len(s['candidate_routes'])==len(x['janus_own_candidates'])
          assert all(r['promotion_barrier']=='BLOCKED' for r in s['candidate_routes'])
          print('JANUS_PNP_AUTORESEARCH_FIREWALL=PASS')
          print('JANUS_RESEARCH_ORGAN_FABRIC=PASS')
          PY

      - name: Build read-only TOPA PNP corpus memory when available
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python janus_model/extensions/pnp_corpus_memory.py \
            --out-text runtime/pnp/JANUS_PNP_CORPUS_MEMORY.txt \
            --out-manifest runtime/pnp/JANUS_PNP_CORPUS_MEMORY_MANIFEST.json \
            --max-bytes 300000
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo 'JANUS_PNP_CORPUS_MEMORY=READY'
          else
            rm -f runtime/pnp/JANUS_PNP_CORPUS_MEMORY.txt runtime/pnp/JANUS_PNP_CORPUS_MEMORY_MANIFEST.json
            echo "JANUS_PNP_CORPUS_MEMORY=DEGRADED_SOURCE_UNAVAILABLE:$RC"
          fi

      - name: Persist JANUS-owned research context
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch main
          git pull --rebase origin main
          mkdir -p janus_model/state
          cp runtime/pnp/JANUS_PNP_AUTORESEARCH_CONTEXT.json janus_model/state/JANUS_PNP_AUTORESEARCH_CONTEXT.json
          if [ -f runtime/pnp/JANUS_PNP_CORPUS_MEMORY.txt ]; then
            cp runtime/pnp/JANUS_PNP_CORPUS_MEMORY.txt janus_model/state/JANUS_PNP_CORPUS_MEMORY.txt
            cp runtime/pnp/JANUS_PNP_CORPUS_MEMORY_MANIFEST.json janus_model/state/JANUS_PNP_CORPUS_MEMORY_MANIFEST.json
          fi
          git config user.name 'janus-pnp-autoresearch[bot]'
          git config user.email 'janus-pnp-autoresearch[bot]@users.noreply.github.com'
          git add -f janus_model/state/JANUS_PNP_AUTORESEARCH_CONTEXT.json
          if [ -f janus_model/state/JANUS_PNP_CORPUS_MEMORY.txt ] && [ -f janus_model/state/JANUS_PNP_CORPUS_MEMORY_MANIFEST.json ]; then
            git add -f janus_model/state/JANUS_PNP_CORPUS_MEMORY.txt janus_model/state/JANUS_PNP_CORPUS_MEMORY_MANIFEST.json
          fi
          if git diff --cached --quiet; then
            echo 'JANUS_PNP_AUTORESEARCH_NO_CHANGE'
          else
            git commit -m 'JANUS: refresh autonomous P-vs-NP candidate research context'
            git push origin HEAD:main
          fi
      - name: Wake native JANUS brain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run janus-native-model.yml --ref main
          echo 'JANUS_NATIVE_WAKE=DISPATCHED'
