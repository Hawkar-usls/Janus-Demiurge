name: JANUS Autonomous P-vs-NP Research Loop

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/janus_pnp_autoresearch.py'
      - 'tools/pnp_content_evidence_bridge.py'
      - 'tests/test_pnp_content_evidence_bridge.py'
      - 'janus_model/policy/JANUS_RESEARCH_ORGAN_FABRIC.json'
      - '.github/workflows/janus-pnp-autoresearch.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: janus-pnp-autoresearch
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Fundamentum as read-only research source
        run: |
          set -euo pipefail
          rm -rf runtime/pnp
          mkdir -p runtime/pnp
          git clone --depth 1 https://github.com/Hawkar-usls/Janus-Fundamentum.git runtime/pnp/Janus-Fundamentum
      - name: Collect TOPA counterexample and exact Beetle processing ACK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Hawkar-usls/TOPA.git runtime/pnp/TOPA
          git fetch --no-tags --depth=1 origin beetle-memory
          BEETLE_SOURCE_HEAD=$(git rev-parse FETCH_HEAD)
          mkdir -p runtime/pnp/beetle
          git show "$BEETLE_SOURCE_HEAD:data/beetle-runtime/CONTEXT.json" \
            > runtime/pnp/beetle/CONTEXT.json
          git show "$BEETLE_SOURCE_HEAD:data/beetle-runtime/PROCESSING_ACK.json" \
            > runtime/pnp/beetle/PROCESSING_ACK.json
          python tools/pnp_content_evidence_bridge.py \
            --fundamentum runtime/pnp/Janus-Fundamentum \
            --topa runtime/pnp/TOPA \
            --beetle-context runtime/pnp/beetle/CONTEXT.json \
            --beetle-ack runtime/pnp/beetle/PROCESSING_ACK.json \
            --beetle-commit "$BEETLE_SOURCE_HEAD" \
            --out runtime/pnp/JANUS_PNP_CONTENT_EVIDENCE.json
          echo 'JANUS_PNP_CONTENT_SOURCE_REPLAY=PASS'
      - name: Run independent finite evidence and tamper regressions
        run: |
          python -m unittest -v tests/test_pnp_content_evidence_bridge.py
      - name: Run JANUS own bounded research cycle
        run: |
          set -euo pipefail
          python -m py_compile tools/janus_pnp_autoresearch.py
          python tools/janus_pnp_autoresearch.py             --fundamentum runtime/pnp/Janus-Fundamentum             --evidence-bundle runtime/pnp/JANUS_PNP_CONTENT_EVIDENCE.json             --out runtime/pnp/JANUS_PNP_AUTORESEARCH_CONTEXT.json
          python - <<'PY'
          import json
          x=json.load(open('runtime/pnp/JANUS_PNP_AUTORESEARCH_CONTEXT.json'))
          assert x['schema']=='janus.pnp_autoresearch_context.v1'
          assert x['fundamentum']['read_only'] is True
          assert x['authority']['truth'] is False
          assert x['authority']['proof'] is False
          assert x['authority']['fundamentum_mutation'] is False
          assert x['authority']['autonomous_merge'] is False
          assert x['fundamentum']['tracks']['P_VS_NP']=='OPEN'
          s=x['research_supervisor']
          assert s['schema']=='janus.research_supervisor_state.v1'
          assert s['status']=='ACTIVE_FAIL_CLOSED'
          assert s['organ_count']==8
          assert s['route_stage_count']==8
          assert s['promotion_barrier']=='BLOCKED'
          assert s['scientific_claim_promotion'] is False
          assert s['fundamentum_mutation'] is False
          assert s['autonomous_merge'] is False
          assert s['p_vs_np_auto_promotion'] is False
          e=s['content_evidence']
          assert e['status']=='FINITE_REPLAY_WITH_OPEN_GENERAL_GATES'
          assert e['may_satisfy_promotion_gate'] is False
          assert e['source_truth_independently_proven'] is False
          assert e['topa_finite_sink_pairs_checked']==331776
          assert e['a3_finite_combinatorial_cases_checked']==16
          assert x['content_evidence_bundle']['bundle_sha256']==e['bundle_sha256']
          assert all(r['content_evidence_verification']=='FINITE_ONLY_NO_PROMOTION' for r in s['candidate_routes'])
          assert len(s['candidate_routes'])==len(x['janus_own_candidates'])
          assert all(r['promotion_barrier']=='BLOCKED' for r in s['candidate_routes'])
          print('JANUS_PNP_AUTORESEARCH_FIREWALL=PASS')
          print('JANUS_RESEARCH_ORGAN_FABRIC=PASS')
          PY
      - name: Persist JANUS-owned research context
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch main
          git pull --rebase origin main
          mkdir -p janus_model/state
          cp runtime/pnp/JANUS_PNP_AUTORESEARCH_CONTEXT.json janus_model/state/JANUS_PNP_AUTORESEARCH_CONTEXT.json
          git config user.name 'janus-pnp-autoresearch[bot]'
          git config user.email 'janus-pnp-autoresearch[bot]@users.noreply.github.com'
          git add -f janus_model/state/JANUS_PNP_AUTORESEARCH_CONTEXT.json
          if git diff --cached --quiet; then
            echo 'JANUS_PNP_AUTORESEARCH_NO_CHANGE'
          else
            git commit -m 'JANUS: refresh autonomous P-vs-NP candidate research context'
            git push origin HEAD:main
          fi
      - name: Wake native JANUS brain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run janus-native-model.yml --ref main
          echo 'JANUS_NATIVE_WAKE=DISPATCHED'
