name: PROOF Semantic Synthesis Research Context

on:
  push:
    branches: [feature/janus-semantic-synthesis-research-context-v1]
    paths:
      - 'janus_model/extensions/semantic_synthesis_context.py'
      - 'janus_model/extensions/research_spine_v2.py'
      - 'tests/test_janus_semantic_synthesis_context.py'
      - '.github/workflows/janus-research-spine.yml'
      - '.github/workflows/_proof-semantic-synthesis-research-context.yml'

permissions:
  contents: read

jobs:
  live-handoff-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and adversarial unit gates
        run: |
          python -m py_compile janus_model/extensions/semantic_synthesis_context.py janus_model/extensions/research_spine_v2.py
          python -m unittest -v tests/test_janus_semantic_synthesis_context.py tests/test_janus_research_spine.py
      - name: Fetch live autonomous iNaiHR synthesis state
        run: |
          mkdir -p runtime/research
          curl --fail --location --retry 3 --max-time 30 \
            'https://raw.githubusercontent.com/Hawkar-usls/iNaiHR/main/janus-synth/state/JANUS_SYNTH_LATEST.json' \
            -o runtime/JANUS_INAIHR_SYNTH_SOURCE.json
          python -m janus_model.extensions.semantic_synthesis_context \
            --source runtime/JANUS_INAIHR_SYNTH_SOURCE.json \
            --out runtime/JANUS_SEMANTIC_SYNTHESIS_CONTEXT.json \
            --max-candidates 12 --max-routes 8
      - name: Build live org surface and bounded Wikipedia context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m janus_model.extensions.org_surface \
            --owner Hawkar-usls --out runtime/JANUS_ORG_SURFACE.json \
            --private-unmounted-count 3 --baseline-inventory-total 50 --workers 8 --timeout 12
          set +e
          python -m janus_model.extensions.wikipedia_trunk \
            --decision janus_model/state/JANUS_LATEST_DECISION.json \
            --research janus_model/state/JANUS_RESEARCH_SPINE.json \
            --out runtime/JANUS_WIKIPEDIA_TRUNK.json \
            --max-topics 6 --max-pages-per-topic 1 --timeout 8
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 3 ]; then exit "$RC"; fi
      - name: Fetch required read-only research organs
        run: |
          git clone --depth 1 https://github.com/Hawkar-usls/TOPA.git runtime/research/TOPA
          git clone --depth 1 https://github.com/Hawkar-usls/Demi_Head.git runtime/research/Demi_Head
          git clone --depth 1 https://github.com/Hawkar-usls/Janus-Fundamentum.git runtime/research/Janus-Fundamentum
      - name: Build integrated Research Spine with semantic hypothesis routes
        run: |
          python -m janus_model.extensions.research_spine_v2 \
            --topa-root runtime/research/TOPA \
            --demi-head-root runtime/research/Demi_Head \
            --fundamentum-root runtime/research/Janus-Fundamentum \
            --org-surface runtime/JANUS_ORG_SURFACE.json \
            --wikipedia runtime/JANUS_WIKIPEDIA_TRUNK.json \
            --semantic-synthesis runtime/JANUS_SEMANTIC_SYNTHESIS_CONTEXT.json \
            --out runtime/JANUS_RESEARCH_SPINE.json \
            --no-arxiv
      - name: Semantic-to-research authority ceiling and lineage gate
        run: |
          python - <<'PY'
          import json
          s=json.load(open('runtime/JANUS_SEMANTIC_SYNTHESIS_CONTEXT.json'))
          r=json.load(open('runtime/JANUS_RESEARCH_SPINE.json'))
          assert r['research_spine']['semantic_synthesis']['context_sha256']==s['context_sha256']
          assert r['hypothesis_routes']==s['research_route_seeds']
          assert len(r['hypothesis_routes']) <= 8
          assert s['source']['candidate_count_selected'] <= 12
          caps=s['capabilities']
          assert caps['may_generate_research_questions'] is True
          assert caps['may_be_used_as_world_truth'] is False
          assert caps['may_be_used_as_proof'] is False
          assert caps['may_be_direct_gradient_signal'] is False
          assert caps['may_grant_mutation_authority'] is False
          assert caps['may_auto_promote_semantic_candidate'] is False
          cc=r['claim_ceiling']
          assert cc['semantic_synthesis_is_truth'] is False
          assert cc['semantic_synthesis_is_proof'] is False
          assert cc['semantic_synthesis_is_direct_gradient_signal'] is False
          assert cc['semantic_synthesis_grants_mutation_authority'] is False
          assert cc['semantic_synthesis_auto_promotes_candidates'] is False
          print('JANUS_SYNTH_TO_RESEARCH_HANDOFF=PASS')
          print('SOURCE_STATE_SHA='+str(s['source']['state_sha256']))
          print('CONTEXT_SHA='+s['context_sha256'])
          print('CANDIDATES='+str(s['source']['candidate_count_selected']))
          print('ROUTES='+str(len(s['research_route_seeds'])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-synthesis-research-context-${{ github.run_id }}
          path: |
            runtime/JANUS_SEMANTIC_SYNTHESIS_CONTEXT.json
            runtime/JANUS_RESEARCH_SPINE.json
          retention-days: 30
