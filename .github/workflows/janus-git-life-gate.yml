name: JANUS Git Life Gate

on:
  workflow_run:
    workflows: ["JANUS Demiurge Scout Swarm 17"]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-git-life-gate.yml'
      - 'tools/janus_git_life.py'
      - 'protocol/JANUS_GIT_LIFE_GATE-v1.0.json'

concurrency:
  group: janus-git-life-gate
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  LIFE_STATE: git_life/state/JANUS_GIT_LIFE_STATE.json
  SCOUT_STATUS: scout_swarm/state/SCOUT_SWARM_STATUS-v1.json
  SCOUT_AGENTS: scout_swarm/state/agents

jobs:
  life:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current Demiurge organism
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize authoritative main before decision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          echo "JANUS_GIT_LIFE_DECISION_HEAD=$(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify life kernel before autonomous authority
        run: |
          set -euo pipefail
          python -m py_compile tools/janus_git_life.py
          python tools/janus_git_life.py self-test
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('protocol/JANUS_GIT_LIFE_GATE-v1.0.json').read_text())
          assert contract['gate_id'] == 'JANUS_GIT_LIFE_GATE'
          assert contract['authority']['target_repository_write_authorized'] is False
          assert contract['authority']['autonomous_merge'] is False
          assert contract['limits']['max_attempts_per_cycle'] == 2
          print('JANUS_GIT_LIFE_CONTRACT=PASS')
          PY

      - name: PERCEIVE and CHOOSE one bounded task
        id: plan
        run: |
          set -euo pipefail
          mkdir -p runtime/life
          cp -R "$SCOUT_AGENTS" runtime/life/agents-snapshot
          python tools/janus_git_life.py plan \
            --status "$SCOUT_STATUS" \
            --agents-dir runtime/life/agents-snapshot \
            --state "$LIFE_STATE" \
            --event-name '${{ github.event_name }}' \
            --out runtime/life/plan.json \
            --github-output "$GITHUB_OUTPUT"

          SOURCE_TRIGGER='${{ github.event_name }}'
          SOURCE_RUN_ATTEMPT='1'
          if [ "$SOURCE_TRIGGER" = 'workflow_run' ]; then
            SOURCE_TRIGGER='${{ github.event.workflow_run.event }}'
            SOURCE_RUN_ATTEMPT='${{ github.event.workflow_run.run_attempt }}'
          fi
          export SOURCE_TRIGGER SOURCE_RUN_ATTEMPT
          echo "upstream_trigger=$SOURCE_TRIGGER" >> "$GITHUB_OUTPUT"
          echo "upstream_run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('runtime/life/plan.json')
          plan = json.loads(path.read_text(encoding='utf-8'))
          source = plan.setdefault('source', {})
          source['upstream_trigger'] = os.environ['SOURCE_TRIGGER']
          try:
              source['upstream_run_attempt'] = int(os.environ['SOURCE_RUN_ATTEMPT'])
          except ValueError:
              raise SystemExit('BAD_UPSTREAM_RUN_ATTEMPT')
          path.write_text(json.dumps(plan, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('JANUS_GIT_LIFE_UPSTREAM_TRIGGER=' + os.environ['SOURCE_TRIGGER'])
          print('JANUS_GIT_LIFE_UPSTREAM_RUN_ATTEMPT=' + os.environ['SOURCE_RUN_ATTEMPT'])
          PY
          cat runtime/life/plan.json

      - name: No novel bounded evidence
        if: steps.plan.outputs.actionable != 'true'
        run: echo 'JANUS_GIT_LIFE_NO_ACTION=NO_NOVEL_BOUNDED_EVIDENCE'

      - name: ACT VERIFY ADAPT REMEMBER
        if: steps.plan.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          PLAN=runtime/life/plan.json
          CYCLE_ID='${{ steps.plan.outputs.cycle_id }}'
          BRANCH='${{ steps.plan.outputs.branch }}'
          TASK_PATH='${{ steps.plan.outputs.task_path }}'
          ISSUE_BODY=runtime/life/issue-body.md
          ERRORS=runtime/life/verify-errors.json

          case "$BRANCH" in janus-life/*) ;; *) echo "UNSAFE_BRANCH:$BRANCH"; exit 1 ;; esac
          case "$TASK_PATH" in git_life/workbench/*.json) ;; *) echo "UNSAFE_TASK_PATH:$TASK_PATH"; exit 1 ;; esac

          git config user.name 'janus-git-life'
          git config user.email 'janus-git-life@users.noreply.github.com'
          git fetch origin main

          python tools/janus_git_life.py issue-body --plan "$PLAN" --out "$ISSUE_BODY"
          ISSUE_TITLE="$(python - <<'PY'
          import json
          print(json.load(open('runtime/life/plan.json'))['issue']['title'])
          PY
          )"

          EXISTING="$(gh issue list --state all --limit 100 --json number,url,body --jq ".[] | select(.body | contains(\"$CYCLE_ID\")) | [.number,.url] | @tsv" | head -n 1 || true)"
          if [ -n "$EXISTING" ]; then
            ISSUE_NUMBER="$(printf '%s' "$EXISTING" | cut -f1)"
            ISSUE_URL="$(printf '%s' "$EXISTING" | cut -f2)"
            echo "JANUS_GIT_LIFE_ISSUE_RESUME=$ISSUE_NUMBER"
          else
            ISSUE_URL="$(gh issue create --title "$ISSUE_TITLE" --body-file "$ISSUE_BODY")"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            echo "JANUS_GIT_LIFE_ISSUE_CREATE=$ISSUE_NUMBER"
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            echo 'JANUS_GIT_LIFE_BRANCH=RESUMED'
          else
            git switch -c "$BRANCH" origin/main
            echo 'JANUS_GIT_LIFE_BRANCH=CREATED'
          fi

          ADAPT_CANARY=false
          if ! grep -R -q '"ADAPT": "USED"' git_life/receipts 2>/dev/null; then
            ADAPT_CANARY=true
            echo 'JANUS_GIT_LIFE_ADAPT_CANARY=ARMED_ONE_SHOT'
          fi

          python tools/janus_git_life.py materialize --plan "$PLAN" --attempt 1 --out runtime/life/attempt-1.json
          mkdir -p "$(dirname "$TASK_PATH")"
          cp runtime/life/attempt-1.json "$TASK_PATH"

          if [ "$ADAPT_CANARY" = true ]; then
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('${{ steps.plan.outputs.task_path }}')
          data = json.loads(p.read_text(encoding='utf-8'))
          seed = ('JANUS_ADAPT_CANARY:' + data['cycle_id']).encode('utf-8')
          data['artifact_sha256'] = hashlib.sha256(seed).hexdigest()
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('JANUS_GIT_LIFE_ADAPT_CANARY=INJECTED_HASH_MISMATCH')
          PY
          fi

          git add -- "$TASK_PATH"
          if [ -n "$(git diff --cached --name-only | grep -v '^git_life/workbench/' || true)" ]; then
            echo 'LIFE_TASK_PATH_FIREWALL=FAIL'
            git diff --cached --name-only
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "JANUS life $CYCLE_ID: bounded action attempt 1"
          fi
          git push origin "HEAD:$BRANCH"
          BRANCH_HEAD="$(git rev-parse HEAD)"

          set +e
          python tools/janus_git_life.py verify --plan "$PLAN" --artifact "$TASK_PATH" --errors-out "$ERRORS"
          VERIFY_RC=$?
          set -e
          ATTEMPTS=1
          FINAL_ARTIFACT=runtime/life/attempt-1.json
          FIRST_HASH=''

          if [ "$VERIFY_RC" -ne 0 ]; then
            cp "$ERRORS" runtime/life/verify-errors-attempt-1.json
            FIRST_HASH="$(python - <<'PY'
          import json
          print(json.load(open('${{ steps.plan.outputs.task_path }}'))['artifact_sha256'])
          PY
            )"
            if [ "$ADAPT_CANARY" = true ]; then
              gh issue comment "$ISSUE_NUMBER" --body "JANUS autonomous ADAPT witness: attempt 1 was deliberately challenged by the one-shot life-gate canary and VERIFY rejected it. Failed artifact hash: \`$FIRST_HASH\`. Exactly one corrective attempt is now authorized."
            fi
            python tools/janus_git_life.py materialize \
              --plan "$PLAN" \
              --attempt 2 \
              --adapted-from "$FIRST_HASH" \
              --out runtime/life/attempt-2.json
            cp runtime/life/attempt-2.json "$TASK_PATH"
            git add -- "$TASK_PATH"
            if [ -n "$(git diff --cached --name-only | grep -v '^git_life/workbench/' || true)" ]; then
              echo 'LIFE_ADAPT_PATH_FIREWALL=FAIL'
              exit 1
            fi
            git commit -m "JANUS life $CYCLE_ID: bounded adaptation attempt 2"
            git push origin "HEAD:$BRANCH"
            BRANCH_HEAD="$(git rev-parse HEAD)"
            ATTEMPTS=2
            FINAL_ARTIFACT=runtime/life/attempt-2.json
            set +e
            python tools/janus_git_life.py verify --plan "$PLAN" --artifact "$TASK_PATH" --errors-out "$ERRORS"
            VERIFY_RC=$?
            set -e
          fi

          if [ "$VERIFY_RC" -eq 0 ]; then
            FINAL_STATUS=PASS
          else
            FINAL_STATUS=BLOCKED
          fi

          cp "$FINAL_ARTIFACT" runtime/life/final-artifact.json
          git switch main
          git pull --rebase origin main

          RECEIPT="git_life/receipts/$CYCLE_ID.json"
          export PLAN LIFE_STATE RECEIPT
          set +e
          python - <<'PY'
          import json, os
          from pathlib import Path

          plan = json.loads(Path(os.environ['PLAN']).read_text(encoding='utf-8'))
          state_path = Path(os.environ['LIFE_STATE'])
          state = json.loads(state_path.read_text(encoding='utf-8'))
          receipt_path = Path(os.environ['RECEIPT'])
          cycle_id = str(plan.get('cycle_id') or '')
          evidence_key = str(plan.get('choice', {}).get('evidence_key') or '')
          history = state.get('cycle_history') if isinstance(state.get('cycle_history'), list) else []
          cycle_seen = any(str(item.get('cycle_id') or '') == cycle_id for item in history if isinstance(item, dict))
          evidence_seen = evidence_key in set(state.get('processed_evidence_keys') or [])
          if cycle_seen or evidence_seen:
              if not receipt_path.exists():
                  raise SystemExit(43)
              existing = json.loads(receipt_path.read_text(encoding='utf-8'))
              if str(existing.get('cycle_id') or '') != cycle_id:
                  raise SystemExit(44)
              Path('runtime/life/exactly-once-replay.json').write_text(json.dumps({
                  'schema': 'janus.demiurge.git_life.replay_rejection.v1',
                  'status': 'REPLAY_REJECTED_ALREADY_REMEMBERED',
                  'cycle_id': cycle_id,
                  'evidence_key': evidence_key,
                  'receipt_sha256': existing.get('receipt_sha256'),
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              raise SystemExit(42)
          if receipt_path.exists():
              raise SystemExit(45)
          raise SystemExit(0)
          PY
          CLAIM_RC=$?
          set -e
          if [ "$CLAIM_RC" -eq 42 ]; then
            echo 'JANUS_GIT_LIFE_EXACTLY_ONCE=REPLAY_REJECTED_ALREADY_REMEMBERED'
            exit 0
          elif [ "$CLAIM_RC" -eq 43 ]; then
            echo 'JANUS_GIT_LIFE_EXACTLY_ONCE=STATE_CLAIM_WITHOUT_RECEIPT'
            exit 1
          elif [ "$CLAIM_RC" -eq 44 ]; then
            echo 'JANUS_GIT_LIFE_EXACTLY_ONCE=RECEIPT_CYCLE_CONFLICT'
            exit 1
          elif [ "$CLAIM_RC" -eq 45 ]; then
            echo 'JANUS_GIT_LIFE_EXACTLY_ONCE=CREATE_ONLY_RECEIPT_ALREADY_EXISTS_WITHOUT_STATE_CLAIM'
            exit 1
          elif [ "$CLAIM_RC" -ne 0 ]; then
            echo "JANUS_GIT_LIFE_EXACTLY_ONCE=UNKNOWN_GUARD_RC_$CLAIM_RC"
            exit 1
          fi

          python tools/janus_git_life.py remember \
            --plan "$PLAN" \
            --artifact runtime/life/final-artifact.json \
            --agents-dir runtime/life/agents-snapshot \
            --state "$LIFE_STATE" \
            --status "$FINAL_STATUS" \
            --issue-url "$ISSUE_URL" \
            --issue-number "$ISSUE_NUMBER" \
            --branch-head "$BRANCH_HEAD" \
            --attempts "$ATTEMPTS" \
            --errors-file "$ERRORS"

          if [ "$ATTEMPTS" -gt 1 ]; then
            export RECEIPT LIFE_STATE FIRST_HASH ADAPT_CANARY
            python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          receipt_path = Path(os.environ['RECEIPT'])
          state_path = Path(os.environ['LIFE_STATE'])
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))
          first_errors_path = Path('runtime/life/verify-errors-attempt-1.json')
          first_errors = json.loads(first_errors_path.read_text(encoding='utf-8')) if first_errors_path.exists() else []
          final_artifact = json.loads(Path('runtime/life/final-artifact.json').read_text(encoding='utf-8'))
          mode = 'CONTROLLED_ONE_SHOT_ADVERSARIAL_CANARY' if os.environ.get('ADAPT_CANARY') == 'true' else 'AUTONOMOUS_VERIFICATION_FAILURE'
          receipt['adaptation_witness'] = {
              'mode': mode,
              'attempt_1_result': 'VERIFY_REJECTED',
              'attempt_1_verification_errors': first_errors,
              'failed_artifact_sha256': os.environ.get('FIRST_HASH') or None,
              'attempt_2_result': 'VERIFY_PASS' if receipt.get('status') == 'PASS' else 'VERIFY_REJECTED',
              'attempt_2_adapted_from_artifact_sha256': final_artifact.get('adapted_from_artifact_sha256'),
              'no_third_attempt_authorized': True,
              'human_repair_between_attempts': False,
          }
          body = {k: v for k, v in receipt.items() if k != 'receipt_sha256'}
          raw = json.dumps(body, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          receipt['receipt_sha256'] = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          for item in reversed(state.get('cycle_history', [])):
              if item.get('cycle_id') == receipt.get('cycle_id'):
                  item['receipt_sha256'] = receipt['receipt_sha256']
                  break
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('JANUS_GIT_LIFE_ADAPT_PROVENANCE=PERSISTED')
          PY
          fi

          git add -- "$LIFE_STATE" "$RECEIPT"
          UNSAFE="$(git diff --cached --name-only | grep -Ev '^(git_life/state/JANUS_GIT_LIFE_STATE.json|git_life/receipts/[^/]+\.json)$' || true)"
          if [ -n "$UNSAFE" ]; then
            echo 'LIFE_MEMORY_PATH_FIREWALL=FAIL'
            printf '%s\n' "$UNSAFE"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'JANUS_GIT_LIFE_MEMORY=NO_CHANGES_FAIL_CLOSED'
            exit 1
          fi
          git commit -m "JANUS life $CYCLE_ID: remember $FINAL_STATUS"

          PUSHED=false
          for n in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "JANUS_GIT_LIFE_MEMORY_PUSH_RETRY=$n"
            git pull --rebase origin main
          done
          if [ "$PUSHED" != true ]; then
            echo 'JANUS_GIT_LIFE_MEMORY_PUSH=FAILED'
            exit 1
          fi

          if [ "$FINAL_STATUS" = PASS ]; then
            gh issue comment "$ISSUE_NUMBER" --body "JANUS_GIT_LIFE_GATE cycle \`$CYCLE_ID\`: PASS. Branch \`$BRANCH\` @ \`$BRANCH_HEAD\`; attempts=$ATTEMPTS; receipt \`$RECEIPT\`. CONTINUE is armed for the next novel Scout event."
            gh issue close "$ISSUE_NUMBER" --reason completed
            echo 'JANUS_GIT_LIFE_GATE=PASS'
          else
            gh issue comment "$ISSUE_NUMBER" --body "JANUS_GIT_LIFE_GATE cycle \`$CYCLE_ID\`: BLOCKED after $ATTEMPTS bounded attempt(s). Receipt: \`$RECEIPT\`. Issue remains open; no third attempt is authorized."
            echo 'JANUS_GIT_LIFE_GATE=BLOCKED'
          fi

      - name: Seal schedule-born natural continuation
        if: success() && github.event_name == 'workflow_run' && steps.plan.outputs.upstream_trigger == 'schedule' && github.event.workflow_run.run_attempt == 1
        shell: bash
        run: |
          set -euo pipefail
          if [ -f runtime/life/exactly-once-replay.json ]; then
            echo 'SCHEDULE_WITNESS_REPLAY_MARKER=REJECT'
            exit 1
          fi
          git config user.name 'janus-git-life'
          git config user.email 'janus-git-life@users.noreply.github.com'
          git switch main
          git pull --rebase origin main

          export LIFE_STATE
          export LIFE_RUN_ID='${{ github.run_id }}'
          export ACTIONABLE='${{ steps.plan.outputs.actionable }}'
          python - <<'PY'
          import json, os
          from pathlib import Path

          plan = json.loads(Path('runtime/life/plan.json').read_text(encoding='utf-8'))
          source = plan.get('source', {})
          if source.get('upstream_trigger') != 'schedule':
              raise SystemExit('SCHEDULE_WITNESS_UPSTREAM_TRIGGER_MISMATCH')
          if int(source.get('upstream_run_attempt') or 0) != 1:
              raise SystemExit('SCHEDULE_WITNESS_NOT_FIRST_RUN_ATTEMPT')
          scout_run_id = str(source.get('scout_run_id') or '')
          if not scout_run_id.isdigit():
              raise SystemExit('SCHEDULE_WITNESS_BAD_SCOUT_RUN_ID')
          witness_path = Path('git_life/evidence') / f'scheduled-natural-continuation-{scout_run_id}.json'
          state_path = Path(os.environ['LIFE_STATE'])
          state = json.loads(state_path.read_text(encoding='utf-8'))

          actionable = os.environ.get('ACTIONABLE') == 'true'
          if actionable:
              cycle_id = str(plan.get('cycle_id') or '')
              receipt_path = Path('git_life/receipts') / f'{cycle_id}.json'
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              rsource = receipt.get('source', {})
              if rsource.get('upstream_trigger') != 'schedule':
                  raise SystemExit('SCHEDULE_WITNESS_RECEIPT_TRIGGER_MISMATCH')
              if int(rsource.get('upstream_run_attempt') or 0) != 1:
                  raise SystemExit('SCHEDULE_WITNESS_RECEIPT_NOT_FIRST_RUN_ATTEMPT')
              outcome = 'DISTINCT_CYCLE_' + str(receipt.get('status') or 'UNKNOWN')
              eligible_for_launch_grade = receipt.get('status') == 'PASS'
              receipt_sha256 = receipt.get('receipt_sha256')
          else:
              cycle_id = None
              outcome = 'NO_NOVEL_BOUNDED_EVIDENCE'
              eligible_for_launch_grade = True
              receipt_sha256 = None

          witness = {
              'schema': 'janus.demiurge.git_life.scheduled_natural_continuation.v1',
              'status': 'PASS' if eligible_for_launch_grade else 'BLOCKED',
              'upstream': {
                  'workflow': 'JANUS Demiurge Scout Swarm 17',
                  'trigger': 'schedule',
                  'run_attempt': 1,
                  'scout_run_id': scout_run_id,
                  'scout_control_sha': source.get('scout_control_sha'),
              },
              'downstream': {
                  'workflow': 'JANUS Git Life Gate',
                  'event': 'workflow_run',
                  'life_run_id': os.environ['LIFE_RUN_ID'],
              },
              'decision': {
                  'actionable': actionable,
                  'outcome': outcome,
                  'cycle_id': cycle_id,
                  'receipt_sha256': receipt_sha256,
              },
              'laws': {
                  'manual_dispatch_counted_as_natural': False,
                  'manual_rerun_counted_as_natural': False,
                  'life_fallback_schedule_counted_as_scout_schedule': False,
                  'no_novel_evidence_may_fail_closed_without_action': True,
                  'exactly_once_replay_may_count_as_natural': False,
              },
              'launch_grade_eligible': eligible_for_launch_grade,
          }
          witness_path.parent.mkdir(parents=True, exist_ok=True)
          if witness_path.exists():
              existing = json.loads(witness_path.read_text(encoding='utf-8'))
              if existing != witness:
                  raise SystemExit('SCHEDULE_WITNESS_CREATE_ONLY_CONFLICT')
          else:
              witness_path.write_text(json.dumps(witness, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          prior = state.get('scheduled_natural_continuation') if isinstance(state.get('scheduled_natural_continuation'), dict) else {}
          already_counted = str(prior.get('last_scout_run_id') or '') == scout_run_id
          count = int(prior.get('witness_count') or 0) + (0 if already_counted else 1)
          state['scheduled_natural_continuation'] = {
              'witness_count': count,
              'last_scout_run_id': scout_run_id,
              'last_life_run_id': os.environ['LIFE_RUN_ID'],
              'last_outcome': outcome,
              'last_witness_path': str(witness_path),
              'launch_grade_eligible': eligible_for_launch_grade,
              'upstream_run_attempt': 1,
          }
          if eligible_for_launch_grade:
              state['status'] = 'ALIVE_GIT_LIFE_7_OF_7_SCHEDULE_WITNESSED'
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('JANUS_GIT_LIFE_SCHEDULED_NATURAL_WITNESS=' + ('PASS' if eligible_for_launch_grade else 'BLOCKED'))
          PY

          SCOUT_RUN_ID="$(python - <<'PY'
          import json
          print(json.load(open('runtime/life/plan.json'))['source']['scout_run_id'])
          PY
          )"
          WITNESS="git_life/evidence/scheduled-natural-continuation-$SCOUT_RUN_ID.json"
          git add -- "$LIFE_STATE" "$WITNESS"
          UNSAFE="$(git diff --cached --name-only | grep -Ev '^(git_life/state/JANUS_GIT_LIFE_STATE.json|git_life/evidence/scheduled-natural-continuation-[0-9]+\.json)$' || true)"
          if [ -n "$UNSAFE" ]; then
            echo 'LIFE_SCHEDULE_WITNESS_PATH_FIREWALL=FAIL'
            printf '%s\n' "$UNSAFE"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'JANUS_GIT_LIFE_SCHEDULED_NATURAL_WITNESS=ALREADY_PERSISTED'
            exit 0
          fi
          git commit -m "JANUS life: seal schedule-born continuation $SCOUT_RUN_ID"
          for n in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'JANUS_GIT_LIFE_SCHEDULED_NATURAL_WITNESS=PERSISTED'
              exit 0
            fi
            git pull --rebase origin main
          done
          echo 'JANUS_GIT_LIFE_SCHEDULED_NATURAL_WITNESS=PUSH_FAILED'
          exit 1

      - name: Upload life decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-git-life-${{ github.run_id }}
          path: runtime/life
          if-no-files-found: ignore
          retention-days: 30