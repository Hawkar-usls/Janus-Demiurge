name: JANUS TRUMP Research Cycle

on:
  push:
    branches:
      - main
      - feature/trump-r29-objective-shadow-accelerator-v1
      - feature/trump-captain-proof-ladder-v1
      - fix/trump-research-state-drift-r30-objective-v1
      - fix/trump-research-cas-persistence-v1
    paths:
      - 'trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'
      - 'janus_model/extensions/trump_research_cycle.py'
      - 'tests/test_janus_trump_research_cycle.py'
      - '.github/workflows/janus-trump-research-cycle.yml'
  pull_request:
    paths:
      - 'trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'
      - 'janus_model/extensions/trump_research_cycle.py'
      - 'tests/test_janus_trump_research_cycle.py'
      - '.github/workflows/janus-trump-research-cycle.yml'
  workflow_dispatch:
  schedule:
    # Independent hourly observation. This is intentionally read-only toward
    # Janus-Fundamentum and does not advance or rewrite the active proof lineage.
    - cron: '23 * * * *'

concurrency:
  group: janus-trump-research-cycle
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  trump-research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout authoritative brain
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture source head and objective ref
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          REF=$(python - <<'PY'
          import json,re
          x=json.load(open('trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'))
          ref=x['active_lineage']['tracking_ref']
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', ref) or '..' in ref or '@{' in ref or ref.startswith('-') or ref.endswith('.lock'):
              raise SystemExit('TRUMP_OBJECTIVE_TRACKING_REF_REJECTED')
          print(ref)
          PY
          )
          echo "tracking_ref=$REF" >> "$GITHUB_OUTPUT"
          mkdir -p runtime/trump-research

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify objective research kernel and Captain ladder
        run: |
          python -m py_compile janus_model/extensions/trump_research_cycle.py
          python -m unittest -v tests/test_janus_trump_research_cycle.py
          python - <<'PY'
          import json
          from janus_model.extensions.trump_research_cycle import validate_objective
          x=json.load(open('trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'))
          validate_objective(x)
          assert x['current_scientific_boundary']['P_VS_NP']=='OPEN'
          ladder=x['algorithmic_proof_ladder']
          assert ladder['highest_verified_level']=='L1_LOCAL_FINITE_INSTANCE_EXACTNESS_ONLY'
          assert ladder['levels']['L1_LOCAL_FINITE_INSTANCE_EXACTNESS']['verified'] is True
          assert ladder['levels']['L2_UNIVERSAL_3CNF_COVERAGE']['verified'] is False
          assert ladder['levels']['L3_ONE_UNIFORM_TOTAL_TRUMP_RESOLVER']['verified'] is False
          assert ladder['levels']['L4_WORST_CASE_POLYNOMIAL_UNIFORM_TRUMP_RESOLVER']['verified'] is False
          assert x['janus_self_compute_policy']['authority_delta']==0
          print('JANUS_TRUMP_CAPTAIN_LADDER_KERNEL=PASS')
          PY

      - name: Fetch objective-selected TRUMP research lineage read-only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch \
            --branch '${{ steps.source.outputs.tracking_ref }}' \
            https://github.com/Hawkar-usls/Janus-Fundamentum.git \
            runtime/trump-research/Janus-Fundamentum
          echo 'JANUS_TRUMP_FUNDAMENTUM_FETCH=PASS'

      - name: Observe independent TRUMP development frontier read-only
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads https://github.com/Hawkar-usls/Janus-Fundamentum.git \
            > runtime/trump-research/remote-heads.txt
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path

          rows=[]
          for raw in Path('runtime/trump-research/remote-heads.txt').read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              sha,ref=raw.split('\t',1)
              name=ref.removeprefix('refs/heads/')
              if not re.search(r'(trump|p[-_]?vs[-_]?np|pnp)', name, flags=re.I):
                  continue
              dates=re.findall(r'20\d{2}-\d{2}-\d{2}', name)
              date_hint=max(dates) if dates else None
              rows.append({'ref':ref,'commit':sha,'date_hint':date_hint})

          # Newness is only an attention hint. It is explicitly not a proof,
          # promotion, or instruction. Branches without date hints remain visible
          # but sort below dated candidates.
          rows.sort(key=lambda r: (r['date_hint'] or '0000-00-00', r['ref']), reverse=True)
          rows=rows[:32]
          obj={
              'schema':'janus.trump.frontier_observation.v1',
              'status':'READ_ONLY_ADVISORY_FRONTIER',
              'repository':'Hawkar-usls/Janus-Fundamentum',
              'candidate_count':len(rows),
              'candidates':rows,
              'selection_hint':'RECENCY_FROM_REF_NAME_ONLY__NATIVE_RESEARCH_MAY_INSPECT__NO_AUTHORITY',
              'authority':{
                  'read_only_observation':True,
                  'changes_active_lineage':False,
                  'changes_proof_ladder':False,
                  'grants_theorem_authority':False,
                  'grants_runtime_promotion':False,
                  'mutates_observed_repository':False,
              },
              'laws':[
                  'OBSERVE_OTHER_BRANCHES_WITHOUT_CHECKOUT_OR_WRITEBACK',
                  'NEWER_BRANCH != BETTER_BRANCH',
                  'FRONTIER_ATTENTION != ACTIVE_LINEAGE',
                  'FRONTIER_ATTENTION != PROOF',
                  'P_VS_NP = OPEN',
              ],
          }
          canonical=json.dumps(obj,sort_keys=True,separators=(',',':')).encode()
          obj['observation_sha256']=hashlib.sha256(canonical).hexdigest()
          Path('runtime/TRUMP_FRONTIER_OBSERVATION.json').write_text(
              json.dumps(obj,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          print(json.dumps({
              'candidate_count':len(rows),
              'top_ref':rows[0]['ref'] if rows else None,
              'top_commit':rows[0]['commit'] if rows else None,
              'observation_sha256':obj['observation_sha256'],
          },indent=2))
          PY
          echo 'JANUS_TRUMP_FRONTIER_READ_ONLY=PASS'

      - name: Build objective-bound Wikipedia arXiv lineage and proof-ladder context
        shell: bash
        run: |
          python -m janus_model.extensions.trump_research_cycle \
            --objective trump/TRUMP_RESEARCH_OBJECTIVE-v1.json \
            --fundamentum-root runtime/trump-research/Janus-Fundamentum \
            --frontier-observation runtime/TRUMP_FRONTIER_OBSERVATION.json \
            --out runtime/JANUS_TRUMP_RESEARCH_CONTEXT.json \
            --max-results 3 \
            --timeout 10
          python - <<'PY'
          import json
          x=json.load(open('runtime/JANUS_TRUMP_RESEARCH_CONTEXT.json'))
          assert x['status'] in {'READY','READY_DEGRADED','EXTERNAL_CONTEXT_UNAVAILABLE'}
          assert x['P_VS_NP']=='OPEN'
          assert x['authority']['research_context_is_truth'] is False
          assert x['authority']['proof_ladder_state_is_theorem'] is False
          assert x['authority']['external_text_is_instruction'] is False
          assert x['authority']['frontier_observation_changes_active_lineage'] is False
          assert x['authority']['frontier_observation_is_proof'] is False
          assert x['authority']['may_grant_runtime_promotion'] is False
          assert x['fundamentum']['active_contract_head_match'] is True
          assert x['algorithmic_proof_ladder']['highest_verified_level']=='L1_LOCAL_FINITE_INSTANCE_EXACTNESS_ONLY'
          assert x['janus_self_compute_policy']['runtime_promotion_requires_exact_output_equivalence'] is True
          assert x['janus_self_compute_policy']['runtime_promotion_requires_repeated_resource_win'] is True
          frontier=x['fundamentum']['independent_frontier_observation']
          assert frontier['status']=='READ_ONLY_ADVISORY_FRONTIER'
          assert frontier['authority']['mutates_observed_repository'] is False
          print(json.dumps({
            'status':x['status'],
            'context_sha256':x['context_sha256'],
            'fundamentum_commit':x['fundamentum']['observed_commit'],
            'active_stage':x['fundamentum']['active_stage'],
            'active_contract':x['fundamentum']['active_contract_path'],
            'next_gate':x['fundamentum']['next_gate'],
            'frontier_candidate_count':len(frontier['candidates']),
            'frontier_top_ref':frontier['candidates'][0]['ref'] if frontier['candidates'] else None,
            'highest_verified_level':x['algorithmic_proof_ladder']['highest_verified_level'],
            'arxiv_pass':x['external_context']['arxiv']['pass_count'],
            'wikipedia_pass':x['external_context']['wikipedia']['pass_count'],
            'P_VS_NP':x['P_VS_NP'],
          },indent=2))
          PY

      - name: Reconcile benign state-only main drift or fail closed
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          SOURCE='${{ steps.source.outputs.head }}'
          CURRENT=$(git rev-parse origin/main)
          if [ "$SOURCE" = "$CURRENT" ]; then
            echo 'JANUS_TRUMP_RESEARCH_FRESH_BASE=PASS'
            exit 0
          fi
          git diff --name-only "$SOURCE" "$CURRENT" > runtime/trump-research/main-drift-paths.txt
          python - <<'PY'
          from pathlib import Path
          from janus_model.extensions.trump_research_cycle import validate_benign_persistence_drift
          paths=Path('runtime/trump-research/main-drift-paths.txt').read_text(encoding='utf-8').splitlines()
          allowed=validate_benign_persistence_drift(paths)
          print('JANUS_TRUMP_RESEARCH_BENIGN_STATE_DRIFT=' + ','.join(allowed))
          PY
          git rebase origin/main
          python - <<'PY'
          import json
          from janus_model.extensions.trump_research_cycle import canonical_bytes,sha256_bytes,validate_objective
          context=json.load(open('runtime/JANUS_TRUMP_RESEARCH_CONTEXT.json'))
          objective=json.load(open('trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'))
          validate_objective(objective)
          expected=sha256_bytes(canonical_bytes(objective))
          assert context['objective']['objective_sha256']==expected, 'TRUMP_OBJECTIVE_CHANGED_DURING_BENIGN_RECONCILE'
          assert context['P_VS_NP']=='OPEN'
          print('JANUS_TRUMP_RESEARCH_STATE_ONLY_RECONCILE=PASS')
          PY

      - name: Persist context with bounded compare-and-swap
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/JANUS_TRUMP_RESEARCH_CONTEXT.json janus_model/state/JANUS_TRUMP_RESEARCH_CONTEXT.json
          cp runtime/TRUMP_FRONTIER_OBSERVATION.json janus_model/state/JANUS_TRUMP_FRONTIER_OBSERVATION.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('runtime/JANUS_TRUMP_RESEARCH_CONTEXT.json'))
          frontier=x['fundamentum']['independent_frontier_observation']
          candidates=frontier['candidates']
          wake={
            'schema':'janus.trump.research_wake.v2',
            'status':'TRUMP_RESEARCH_CONTEXT_REFRESHED',
            'context_sha256':x['context_sha256'],
            'objective_sha256':x['objective']['objective_sha256'],
            'fundamentum_commit':x['fundamentum']['observed_commit'],
            'active_stage':x['fundamentum']['active_stage'],
            'active_contract_path':x['fundamentum']['active_contract_path'],
            'next_gate':x['fundamentum']['next_gate'],
            'frontier_observation_sha256':frontier.get('observation_sha256'),
            'frontier_candidate_count':len(candidates),
            'frontier_top_ref':candidates[0]['ref'] if candidates else None,
            'frontier_top_commit':candidates[0]['commit'] if candidates else None,
            'highest_verified_level':x['algorithmic_proof_ladder']['highest_verified_level'],
            'P_VS_NP':'OPEN',
            'authority':{
              'truth':False,
              'theorem':False,
              'frontier_is_proof':False,
              'frontier_changes_active_lineage':False,
              'runtime_promotion':False,
              'authority_delta':0,
            },
          }
          Path('janus_model/extensions/TRUMP_RESEARCH_WAKE.json').write_text(
            json.dumps(wake,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          PY
          git config user.name 'janus-trump-research-cycle'
          git config user.email 'janus-trump-research-cycle@users.noreply.github.com'
          git add -f \
            janus_model/state/JANUS_TRUMP_RESEARCH_CONTEXT.json \
            janus_model/state/JANUS_TRUMP_FRONTIER_OBSERVATION.json \
            janus_model/extensions/TRUMP_RESEARCH_WAKE.json
          if git diff --cached --quiet; then
            echo 'JANUS_TRUMP_RESEARCH_NO_CHANGE'
            exit 0
          fi

          git commit -m 'JANUS TRUMP: remember objective and independent read-only frontier'
          PUSHED=false
          for ATTEMPT in 1 2 3; do
            echo "JANUS_TRUMP_RESEARCH_CAS_ATTEMPT=$ATTEMPT"
            if git push origin HEAD:main; then
              PUSHED=true
              echo "JANUS_TRUMP_RESEARCH_CAS_PUSH=PASS:$ATTEMPT"
              break
            fi

            git fetch origin main
            LOCAL_PARENT=$(git rev-parse HEAD^)
            CURRENT=$(git rev-parse origin/main)
            if [ "$LOCAL_PARENT" = "$CURRENT" ]; then
              echo 'JANUS_TRUMP_RESEARCH_PUSH_FAILED_WITHOUT_REMOTE_ADVANCE'
              exit 24
            fi

            git diff --name-only "$LOCAL_PARENT" "$CURRENT" > runtime/trump-research/cas-drift-paths.txt
            python - <<'PY'
          from pathlib import Path
          from janus_model.extensions.trump_research_cycle import validate_benign_persistence_drift
          paths=Path('runtime/trump-research/cas-drift-paths.txt').read_text(encoding='utf-8').splitlines()
          allowed=validate_benign_persistence_drift(paths)
          print('JANUS_TRUMP_RESEARCH_CAS_BENIGN_DRIFT=' + ','.join(allowed))
          PY

            git rebase origin/main
            python - <<'PY'
          import json
          from janus_model.extensions.trump_research_cycle import canonical_bytes,sha256_bytes,validate_objective
          context=json.load(open('runtime/JANUS_TRUMP_RESEARCH_CONTEXT.json'))
          objective=json.load(open('trump/TRUMP_RESEARCH_OBJECTIVE-v1.json'))
          validate_objective(objective)
          expected=sha256_bytes(canonical_bytes(objective))
          assert context['objective']['objective_sha256']==expected, 'TRUMP_OBJECTIVE_CHANGED_DURING_CAS_RETRY'
          assert context['P_VS_NP']=='OPEN'
          print('JANUS_TRUMP_RESEARCH_CAS_REVALIDATION=PASS')
          PY
          done
          if [ "$PUSHED" != true ]; then
            echo 'JANUS_TRUMP_RESEARCH_CAS_RETRY_EXHAUSTED'
            exit 25
          fi
          echo 'JANUS_TRUMP_RESEARCH_PERSIST=PASS'

      - name: Explicitly wake native model after persisted context
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run janus-native-model.yml --ref main
          echo 'JANUS_TRUMP_NATIVE_WAKE=DISPATCHED'

      - name: Branch proof has zero persistence authority
        if: github.ref_name != 'main'
        run: echo 'JANUS_TRUMP_BRANCH_PROOF_READ_ONLY=PASS'
