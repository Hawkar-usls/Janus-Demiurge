name: Slime Signature Cap Router v2

on:
  push:
    paths:
      - 'models/slime/slime_semantic_candidate_router.py'
      - 'models/slime/slime_semantic_candidate_router_v2.py'
      - '.github/workflows/slime-signature-cap-router-v2.yml'
  pull_request:
    paths:
      - 'models/slime/slime_semantic_candidate_router.py'
      - 'models/slime/slime_semantic_candidate_router_v2.py'
      - '.github/workflows/slime-signature-cap-router-v2.yml'

permissions:
  contents: read

jobs:
  candidate-generator-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile routers
        run: |
          python -m py_compile models/slime/slime_semantic_candidate_router.py
          python -m py_compile models/slime/slime_semantic_candidate_router_v2.py
      - name: Run v2 self-test
        run: python models/slime/slime_semantic_candidate_router_v2.py
      - name: Verify generator firewall
        run: |
          python - <<'PY'
          import inspect
          from models.slime.slime_semantic_candidate_router_v2 import SlimeSignatureCapCandidateRouter
          params=list(inspect.signature(SlimeSignatureCapCandidateRouter.generate_manifest).parameters)
          assert params==['self','clauses']
          source=inspect.getsource(SlimeSignatureCapCandidateRouter.generate_manifest)
          for token in ['assignment_signatures(', 'ps_cut_signatures(', 'truth_table(', 'solve_sat(', 'sat_oracle(']:
              assert token not in source, token
          m=SlimeSignatureCapCandidateRouter().generate_manifest(((1,2,3),(-1,2,4),(1,-3,4)))
          assert m.exact_ps_width_computed_inside_generator is False
          assert m.sat_oracle_used is False
          assert len(m.candidates)==5
          assert m.candidates[-1].name=='SLIME_SIGNATURE_CAP_PRESSURE'
          print('SLIME_SIGNATURE_CAP_V2_FIREWALL = PASS')
          print('MANIFEST_SHA256 =',m.manifest_sha256)
          print('TOTAL_GENERATION_OPS =',m.total_generation_ops)
          PY
      - name: Claim ceiling
        run: |
          echo 'SIGNATURE_CAP = CERTIFIED UPPER BOUND, NOT EXACT PS-WIDTH'
          echo 'SLIME_V2_PROPOSAL != DECOMPOSITION_PROOF'
          echo 'P_VS_NP = OPEN'
