name: JANUS Legacy Genesis Metrics Safety Probe
on:
  pull_request:
    paths:
      - 'tools/janus_legacy_homeostasis_guard.py'
      - 'tests/test_janus_legacy_homeostasis_guard.py'
      - '.github/workflows/janus-legacy-homeostasis-guard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/janus_legacy_homeostasis_guard.py'
      - 'tests/test_janus_legacy_homeostasis_guard.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-selected-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: homeostasis-safe-isolated-source
          path: |
            tools/janus_legacy_homeostasis_guard.py
            tests/test_janus_legacy_homeostasis_guard.py
          retention-days: 1
          if-no-files-found: error
  purely-numeric-tests:
    needs: stage-selected-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homeostasis-safe-isolated-source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check isolated source syntax
        run: python -m py_compile tools/janus_legacy_homeostasis_guard.py
      - name: Validate numeric, private-data and science authority boundaries
        run: python -m unittest discover -v -s tests -p test_janus_legacy_homeostasis_guard.py
