name: TRUMP Physarius Final Gate

on:
  push:
    paths:
      - 'trump/PHYSARIUS_FINAL_ADMISSION_CONTRACT_v1.json'
      - 'trump/physarius_final_gate.py'
      - '.github/workflows/trump-physarius-final-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-current-blind-network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current HRaiN Physarius blind projection
        run: |
          python - <<'PY'
          import urllib.request
          url='https://raw.githubusercontent.com/Hawkar-usls/Janus-Fundamentum/main/registry/PHYSARIUS_NETWORK_HRAIN_LIVE_v1.json'
          req=urllib.request.Request(url, headers={'User-Agent':'JANUS-TRUMP-Physarius/1.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data=r.read()
          open('/tmp/hrain_physarius_live.json','wb').write(data)
          print('bytes=', len(data))
          PY

      - name: Compile discovery-stage candidate packet
        run: |
          python - <<'PY'
          import json
          src=json.load(open('/tmp/hrain_physarius_live.json', encoding='utf-8'))
          packet={
            'schema':'janus.trump.physarius_candidate_packet.v1',
            'stage':'DISCOVERY_ONLY',
            'source_network':src.get('source_network'),
            'source_graph_sha256':src.get('graph_sha256'),
            'content_exposed':src.get('contentPolicy',{}).get('contentExposed'),
            'source_read_only': all(bool(n.get('read_only')) for n in src.get('nodes',[])),
            'lineage_roles_preserved': all(bool(n.get('scientific_lineage')) and bool(n.get('role')) for n in src.get('nodes',[]) if n.get('type')=='REMOTE_VESSEL'),
            'mutation_policy':src.get('mutationPolicy'),
            'upstream_status':src.get('status'),
            'claim_ceiling':src.get('claim_ceiling',[])
          }
          json.dump(packet, open('/tmp/trump_packet.json','w',encoding='utf-8'), indent=2, sort_keys=True)
          print(json.dumps(packet, indent=2, sort_keys=True))
          PY

      - name: Pass current survivor through TRUMP last
        run: |
          python trump/physarius_final_gate.py \
            --packet /tmp/trump_packet.json \
            --out /tmp/trump_receipt.json

      - name: Assert candidate-only terminal
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/trump_receipt.json', encoding='utf-8'))
          assert r['verdict']=='SEARCH_ONLY_ACCEPTED_NO_PROMOTION', r
          assert r['scientific_claim_promoted'] is False
          assert r['proof_promoted'] is False
          assert r['external_effect_authorized'] is False
          assert r['physical_effect_authorized'] is False
          print('TRUMP_FINAL_GATE_PASS')
          print('verdict=', r['verdict'])
          print('next_authority=', r['next_authority'])
          print('receipt_sha256=', r['receipt_sha256'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: trump-physarius-final-gate-${{ github.run_id }}
          path: |
            /tmp/trump_packet.json
            /tmp/trump_receipt.json
          retention-days: 14
