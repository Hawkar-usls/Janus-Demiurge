name: JANUS Demiurge Conductor v1

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'demiurge/JANUS_CONDUCTOR_POLICY.json'
      - 'tools/demiurge_conductor.py'
      - 'tests/test_demiurge_conductor.py'
      - '.github/workflows/janus-demiurge-conductor.yml'

concurrency:
  group: janus-demiurge-conductor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  conduct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout JANUS Demiurge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize authoritative main and freeze cycle source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "JANUS_CONDUCTOR_CYCLE_SOURCE_SHA=$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conductor runtime
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify conductor and launcher membranes
        run: |
          python -m py_compile tools/demiurge_conductor.py tools/demiurge_full_launcher.py
          python -m pytest -q tests/test_demiurge_conductor.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('demiurge/JANUS_CONDUCTOR_POLICY.json').read_text())
          a=p['authority']
          assert a['conductor_is_admission'] is False
          assert a['conductor_grants_code_admission'] is False
          assert a['conductor_grants_lifecycle'] is False
          assert a['conductor_bypasses_nexus'] is False
          assert a['conductor_bypasses_auditor'] is False
          assert a['authority_delta'] == 0
          assert p['max_steps_per_cycle'] <= 6
          print('JANUS_CONDUCTOR_AUTHORITY_MEMBRANE=PASS')
          PY

      - name: JANUS chooses and presses bounded Demiurge buttons
        id: conduct
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CYCLE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p runtime demiurge/conductor/runs demiurge/conductor/state
          set +e
          python -m tools.demiurge_conductor \
            --policy demiurge/JANUS_CONDUCTOR_POLICY.json \
            --launcher-policy demiurge/DEMIURGE_LAUNCHER_POLICY.json \
            --repo "$GITHUB_REPOSITORY" \
            --source-sha "$CYCLE_SOURCE_SHA" \
            --out-dir demiurge/conductor/runs \
            --state-out demiurge/conductor/state/JANUS_CONDUCTOR_STATE.json \
            | tee runtime/janus-conductor-summary.json
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "JANUS_CONDUCTOR_PROCESS_RC=$RC"

      - name: Validate conductor receipt authority ceiling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state=Path('demiurge/conductor/state/JANUS_CONDUCTOR_STATE.json')
          if not state.is_file(): raise SystemExit('CONDUCTOR_STATE_MISSING')
          rows=sorted(Path('demiurge/conductor/runs').glob('*.json'), key=lambda p:p.stat().st_mtime)
          if not rows: raise SystemExit('CONDUCTOR_RECEIPT_MISSING')
          obj=json.loads(rows[-1].read_text())
          assert obj['schema']=='janus.demiurge.conductor_receipt.v1'
          assert obj['authority_delta']==0
          assert obj['authority']['conductor_is_admission'] is False
          assert obj['authority']['conductor_grants_code_admission'] is False
          assert obj['authority']['conductor_grants_lifecycle'] is False
          assert obj['claim_ceiling']['native_choice_is_admission'] is False
          assert obj['claim_ceiling']['dispatch_is_success'] is False
          assert obj['claim_ceiling']['child_success_is_world_truth'] is False
          assert obj['claim_ceiling']['conductor_bypasses_child_gates'] is False
          print('JANUS_CONDUCTOR_RECEIPT_AUTHORITY=PASS')
          PY

      - name: Persist global conductor state and cycle receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'janus-demiurge-conductor'
          git config user.email 'janus-demiurge-conductor@users.noreply.github.com'
          git add -f demiurge/conductor/runs demiurge/conductor/state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'JANUS_CONDUCTOR_NO_NEW_STATE=TRUE'
            exit 0
          fi
          git commit -m "JANUS Conductor: remember cycle ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload conductor cycle receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-demiurge-conductor-${{ github.run_id }}
          path: |
            demiurge/conductor/runs/*.json
            demiurge/conductor/state/JANUS_CONDUCTOR_STATE.json
            runtime/janus-conductor-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Honor fail-closed terminal
        if: always()
        shell: bash
        env:
          RC: ${{ steps.conduct.outputs.rc }}
        run: |
          set -euo pipefail
          test -n "${RC:-}" || exit 2
          if [ "$RC" -ne 0 ]; then
            echo "JANUS_CONDUCTOR_STOPPED_FAIL_CLOSED=$RC"
            exit "$RC"
          fi
          echo 'JANUS_CONDUCTOR_CYCLE=PASS'
