name: JANUS Legacy v5.22 Bounded Revival

on:
  workflow_dispatch:
    inputs:
      max_cycles:
        description: "Bounded legacy cycles (1-3)"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]
  push:
    branches: [main]
    paths:
      - "archaeology/legacy_v5_22/**"
      - ".github/workflows/janus-legacy-v5-22-smoke.yml"

permissions:
  contents: read

concurrency:
  group: janus-legacy-v5-22-bounded
  cancel-in-progress: false

jobs:
  legacy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAX_CYCLES: ${{ inputs.max_cycles || '1' }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded legacy runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy aiohttp psutil scikit-learn joblib opencv-python-headless scikit-image
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run bounded archived Demiurge revival
        run: |
          python archaeology/legacy_v5_22/legacy_ci_runner.py \
            --bundle archaeology/legacy_v5_22/janus-demiurge-v5.22-copy14-sanitized.tar.gz \
            --out-dir "$RUNNER_TEMP/janus-v5-22-revival" \
            --max-cycles "$MAX_CYCLES" \
            --timeout 720

      - name: Show receipt
        if: always()
        run: |
          test -f "$RUNNER_TEMP/janus-v5-22-revival/receipt.json" && cat "$RUNNER_TEMP/janus-v5-22-revival/receipt.json" || true

      - name: Upload bounded revival receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-demiurge-v5-22-bounded-revival
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/janus-v5-22-revival/receipt.json
            ${{ runner.temp }}/janus-v5-22-revival/legacy_core.log
