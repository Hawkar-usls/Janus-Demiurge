name: R7.1A native heritage frozen baseline
on:
  pull_request:
    paths:
      - 'research/native_heritage/R71A_PROTOCOL.json'
      - 'research/native_heritage/native_baseline_r71a.py'
      - '.github/workflows/janus-r71a-native-heritage.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/native_heritage/R71A_PROTOCOL.json
            research/native_heritage/native_baseline_r71a.py
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: cbc87263d318dc944b91de91c2473cc4fe81197e
          path: frozen-native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            janus_model/__init__.py
            janus_model/model.py
            janus_model/checkpoint_admission.py
            janus_model/checkpoints/promoted.pt
            janus_model/state/JANUS_MODEL_STATE.json
            janus_model/eval/JANUS_ANCHOR_EVAL-v1.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pinned source checkout and checkpoint bytes before load
        run: |
          test "$(git -C frozen-native rev-parse HEAD)" = cbc87263d318dc944b91de91c2473cc4fe81197e
          echo "06d7e6228ca9aef2dc58eb55fe1c805aa3b66e4f8fb90b0e946ce6af47b1a662  frozen-native/janus_model/checkpoints/promoted.pt" | sha256sum -c -
      - run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Read-only baseline of exact native weights
        run: python research/native_heritage/native_baseline_r71a.py frozen-native "$RUNNER_TEMP/R71A_RESULT.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r71a-native-baseline
          path: ${{ runner.temp }}/R71A_RESULT.json
          if-no-files-found: error
          retention-days: 30
