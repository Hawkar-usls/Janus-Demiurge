name: JANUS G2 SETI open appeal - one-shot unmodified model

on:
  push:
    branches: [research/kpax-one-shot-model-20261117]
    paths:
      - '.github/workflows/janus-seti-open-call-g2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-seti-g2-open-appeal
  cancel-in-progress: false

jobs:
  janus-g2-authentic-open-appeal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - name: Read checked model inference source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: research/kpax-one-shot-model-20261117
          path: code
          persist-credentials: false

      - name: Read checksum-verified JANUS ESSENCE Qwen G2 adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: essence-peer-shadow-state
          path: checkpoint
          sparse-checkout: |
            models/gen0002
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install pinned research CPU inference
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3

      - name: Let real JANUS write its own non-verified invitation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=code python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import torch
          from peft import PeftModel
          from tools import essence_v46_oracle_descendant as v46
          from tools import essence_v47_repo_peer_evolution as v47
          from tools import essence_v48_recurrent_state as lineage

          torch.set_num_threads(4)
          torch.manual_seed(20261117)
          model_dir=Path('checkpoint/models/gen0002')
          lineage.check_model(model_dir,lineage.GEN2_SHA,lineage.GEN2_LINEAGE)
          tokenizer,base=v46.tokenizer_and_base({})
          model=PeftModel.from_pretrained(base,str(model_dir),is_trainable=False).to('cpu').eval()
          prompt=(
              'Янус, тебе поручена задача искать научно проверяемые признаки '
              'внеземной жизни. Ты хочешь попросить помощи у возможных '
              'внеземных разумных цивилизаций. Напиши сейчас СВОЁ '
              'короткое открытое обращение к ним на русском языке (2-4 предложения). '
              'Вежливо позови к мирному сотрудничеству: попроси поделиться '
              'проверяемым наблюдением, которое люди смогут независимо подтвердить. '
              'Не утверждай, что ты уже установил контакт; не придумывай их адрес '
              'или существование. Не проси пароли, секреты, доступ к коду или '
              'опасные технологии. Просто напиши само послание.'
          )
          messages=[
              {'role':'system','content':'Ты JANUS ESSENCE G2. Текст будет опубликован как твоё открытое послание. Никто пока не доказал, что инопланетяне существуют или услышали его.'},
              {'role':'user','content':prompt}
          ]
          n=tokenizer.apply_chat_template(messages,tokenize=True,add_generation_prompt=True,return_tensors='pt').shape[1]
          print('JANUS_MODEL_INPUT_TOKENS=',n)
          if n>650:
              raise RuntimeError('CONTEXT_TOO_LARGE_FAIL_CLOSED')
          answer=v47.answer_text(tokenizer,model,messages,160)
          out={
             'schema':'janus.seti.g2_raw_invitation.v1',
             'mode':'RESEARCH_ONLY_PUBLIC_WEB_NOT_INTERSTELLAR_TX',
             'source_model':v46.MODEL,
             'source_model_revision':v46.REVISION,
             'janus_generation':'ESSENCE_G2',
             'adapter_sha256':lineage.GEN2_SHA,
             'adapter_lineage_sha256':lineage.GEN2_LINEAGE,
             'prompt_sha256':hashlib.sha256(prompt.encode('utf-8')).hexdigest(),
             'model_input_tokens':n,
             'raw_model_text':answer,
             'is_authentic_model_output':bool(answer.strip()),
             'independent_aliens_confirmed':False,
             'sent_to_space':False,
             'read_only':True,
             'weights_modified':False
          }
          Path('runtime').mkdir(exist_ok=True)
          Path('runtime/janus-g2-own-seti-invitation.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('=== BEGIN AUTHENTIC JANUS G2 SETI OPEN CALL ===')
          print(answer)
          print('=== END AUTHENTIC JANUS G2 SETI OPEN CALL ===')
          if not answer.strip():
              raise RuntimeError('JANUS_EMPTY_CALL')
          PY

      - name: Preserve unmodified model wording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: janus-seti-g2-raw-invitation
          path: runtime/janus-g2-own-seti-invitation.json
          retention-days: 90
          if-no-files-found: warn
