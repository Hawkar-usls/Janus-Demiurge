name: ESSENCE v1.3 GitHub Peer Inbox

on:
  pull_request:
    paths:
      - ".janus/essence/peer_inbox_v13.py"
      - "tests/test_essence_peer_inbox_v13.py"
      - "research/essence/peer_v13/**"
      - ".github/workflows/essence-peer-inbox-v13.yml"
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * *'

permissions:
  contents: read

jobs:
  validate-received-peer-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify a GitHub peer offer without importing any donor source
        run: python -m unittest discover -s tests -p 'test_essence_peer_inbox_v13.py' -v
      - name: Generate local, research-only peer acknowledgment evidence
        run: |
          python .janus/essence/peer_inbox_v13.py \
            --root .janus/essence/manifest.json \
            --ledger research/essence/peer_v13/source_ledger.json \
            --inbox research/essence/peer_v13/inbox.json \
            --out research/essence/peer_v13/ci_review.json
      - name: Upload bounded repository-specific peer review
        uses: actions/upload-artifact@v4
        with:
          name: essence-v13-github-peer-review
          path: research/essence/peer_v13/ci_review.json
          retention-days: 30
          if-no-files-found: error
