name: JANUS Kenshi Swarm Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - '.janus/KENSHI_SWARM_FOUNDATION.json'
      - 'scout_swarm/orchestrator/KENSHI_SWARM_BLACKBOARD-v1.json'
      - 'scout_swarm/orchestrator/SWARM_ORCHESTRATOR_POLICY-v1.json'
      - '.github/workflows/janus-kenshi-swarm-foundation.yml'
  push:
    branches: [main]
    paths:
      - '.janus/KENSHI_SWARM_FOUNDATION.json'
      - 'scout_swarm/orchestrator/KENSHI_SWARM_BLACKBOARD-v1.json'
      - 'scout_swarm/orchestrator/SWARM_ORCHESTRATOR_POLICY-v1.json'
      - '.github/workflows/janus-kenshi-swarm-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate foundation and blackboard bindings
        run: |
          python - <<'PY'
          import json
          binding=json.load(open('.janus/KENSHI_SWARM_FOUNDATION.json'))
          board=json.load(open('scout_swarm/orchestrator/KENSHI_SWARM_BLACKBOARD-v1.json'))
          policy=json.load(open('scout_swarm/orchestrator/SWARM_ORCHESTRATOR_POLICY-v1.json'))
          assert binding['status']=='ACTIVE_ORCHESTRATOR_FOUNDATION'
          assert policy['foundation']['core_rule']=='SYNC_STATE_NOT_IDENTITY'
          assert policy['communication']['semantics']=='KENSHI_SHARED_BLACKBOARD_WITH_LOCAL_AGENT_VIEWS'
          assert board['deduplication_boundary']['scout_identity_deduplication_allowed'] is False
          assert board['deduplication_boundary']['message_identity_deduplication_allowed'] is False
          assert board['evidence_boundary']['message_is_evidence'] is False
          assert 'FACTS_MAY_CLUSTER__SCOUTS_MUST_NOT' in policy['laws']
          print('JANUS_DEMIURGE_KENSHI_FOUNDATION=PASS')
          PY
