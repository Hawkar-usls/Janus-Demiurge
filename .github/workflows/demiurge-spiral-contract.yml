name: Demiurge Spiral Contract

on:
  pull_request:
    paths:
      - 'spiral_evolution.py'
      - 'auto_evolution.py'
      - 'architect_ai.py'
      - 'species_engine.py'
      - 'swarm_optimizer.py'
      - 'janus_core/convergence_engine.py'
      - 'janus_genesis/demiurge.py'
      - 'tools/demiurge_scout_swarm.py'
      - 'protocol/DEMIURGE_SPIRAL_EVOLUTION-v1.json'
      - 'scout_swarm/SCOUT_SWARM_MANIFEST-v1.json'
      - 'tests/test_spiral_evolution.py'
      - '.github/workflows/demiurge-spiral-contract.yml'
  push:
    branches: [main]
    paths:
      - 'spiral_evolution.py'
      - 'auto_evolution.py'
      - 'architect_ai.py'
      - 'species_engine.py'
      - 'swarm_optimizer.py'
      - 'janus_core/convergence_engine.py'
      - 'janus_genesis/demiurge.py'
      - 'tools/demiurge_scout_swarm.py'
      - 'protocol/DEMIURGE_SPIRAL_EVOLUTION-v1.json'
      - 'scout_swarm/SCOUT_SWARM_MANIFEST-v1.json'
      - 'tests/test_spiral_evolution.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile migrated modules
        run: |
          python -m py_compile \
            spiral_evolution.py \
            auto_evolution.py \
            architect_ai.py \
            species_engine.py \
            swarm_optimizer.py \
            janus_core/convergence_engine.py \
            janus_genesis/demiurge.py \
            tools/demiurge_scout_swarm.py
      - name: Run spiral regression suite
        run: python -m unittest discover -s tests -p 'test_spiral_evolution.py'
      - name: Run Scout spiral self-test
        run: python tools/demiurge_scout_swarm.py --self-test
      - name: Validate machine-readable contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          protocol = json.loads(Path('protocol/DEMIURGE_SPIRAL_EVOLUTION-v1.json').read_text())
          manifest = json.loads(Path('scout_swarm/SCOUT_SWARM_MANIFEST-v1.json').read_text())
          assert protocol['status'] == 'CANONICAL'
          assert 'NO_LEARNING_ENTITY_DELETION' in protocol['laws']
          assert 'ITERATION_IS_SPIRAL_NOT_RING' in protocol['laws']
          assert manifest['agent_count'] == 17
          assert 'FAILURE_BECOMES_LESSON' in manifest['invariants']
          print('DEMIURGE_SPIRAL_CONTRACT=PASS')
          PY
