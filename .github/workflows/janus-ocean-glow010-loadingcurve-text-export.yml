name: JANUS Ocean GLOW-010 Licensed Real Lab CSV Export
on:
  push:
    branches:
      - janus/glow010-published-afterglow-data-audit-20261110
    paths:
      - .github/workflows/janus-ocean-glow010-loadingcurve-text-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-only-original-CC-BY-csv-and-text:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original dataset MD5 and preserve selected real CSV, raw .txt and metadata
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json,hashlib,io,zipfile,urllib.request
          from pathlib import Path
          url='https://zenodo.org/api/records/6991932/files/loadingcurve.zip/content'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'JANUS-GLOW-010/1.0 CC-BY-4.0 reproducibility'}),timeout=30) as f:blob=f.read(2_000_000)
          assert hashlib.md5(blob).hexdigest()=='423e3e457d3458a0aac0b20365ebfd4b'
          files={}
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              for entry in archive.infolist():
                  if entry.is_dir():continue
                  path=Path(entry.filename)
                  if '..' in path.parts or path.is_absolute():raise ValueError('UNSAFE_SOURCE_PATH')
                  if (path.suffix.lower() not in ('.csv','.txt') or entry.file_size>4_000_000):continue
                  data=archive.read(entry)
                  dest=Path('artifacts/published_2022')/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
                  files[entry.filename]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          report={'schema':'janus.glow010.zenodo6991932_ccby_licensed_export.v1',
                  'original_doi':'10.5281/zenodo.6991932','attribution':'T. Delgado et al., Advanced Photonics Research 3, 2100179 (2022)',
                  'licence':'CC BY 4.0 https://creativecommons.org/licenses/by/4.0/',
                  'original_zip_md5':hashlib.md5(blob).hexdigest(),
                  'exported_files':files,'not_user_SUNLU_material':True,
                  'raw_measurement_fit_performed':False,
                  'no_retrocausality_claim':True}
          Path('artifacts/published_2022/source_manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'files_exported':len(files),'paths':list(files)[:25]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: janus-glow010-real-lab-texts-2022-${{ github.run_id }}
          path: artifacts/published_2022/
          retention-days: 90
          if-no-files-found: error
