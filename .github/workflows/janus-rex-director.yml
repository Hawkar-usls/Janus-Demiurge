name: JANUS Rex Director v1.3.1

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact repository SHA to process; defaults to the triggering SHA'
        required: false
        type: string
  schedule:
    - cron: '11 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'rex/JANUS_REX_DESIRES.json'
      - 'rex/desires/approved/*.json'
      - 'rex/need_admissions/*.json'
      - 'rex/need_proposals/generated/*.json'
      - 'rex/nexus_policy.json'
      - 'tools/demiurge_rex_director.py'
      - 'tests/test_rex_director_v1_1.py'
      - 'tests/test_rex_need_discovery_v1.py'
      - '.github/workflows/janus-rex-director.yml'

concurrency:
  group: janus-rex-director
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Bind checkout to requested provenance
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ -n "${REQUESTED_SHA:-}" ] && [ "$ACTUAL_SHA" != "$REQUESTED_SHA" ]; then
            echo "DIRECTOR_SHA_MISMATCH requested=$REQUESTED_SHA actual=$ACTUAL_SHA" >&2
            exit 2
          fi
          echo "REX_DIRECTOR_INPUT_SHA=$ACTUAL_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Rex Director contract
        run: |
          python -m pip install pytest
          pytest -q tests/test_rex_director_v1_1.py tests/test_rex_need_discovery_v1.py tests/test_rex_v1.py
      - name: Verify Nexus-approved discovered desires
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          for desire_path in sorted(pathlib.Path('rex/desires/approved').glob('*.json')) if pathlib.Path('rex/desires/approved').exists() else []:
              proposal_id=desire_path.stem
              proposal_path=pathlib.Path('rex/need_proposals/generated')/f'{proposal_id}.json'
              receipt_path=pathlib.Path('rex/need_admissions')/f'{proposal_id}.json'
              if not proposal_path.is_file() or not receipt_path.is_file():
                  raise SystemExit(f'NEED_CHAIN_MISSING:{proposal_id}')
              desire=json.load(open(desire_path,encoding='utf-8'))
              proposal=json.load(open(proposal_path,encoding='utf-8'))
              receipt=json.load(open(receipt_path,encoding='utf-8'))
              proposal_sha=hashlib.sha256(proposal_path.read_bytes()).hexdigest()
              if receipt.get('schema')!='janus.nexus.rex_need_admission.v1': raise SystemExit(f'NEED_RECEIPT_SCHEMA:{proposal_id}')
              if receipt.get('state')!='NEXUS_NEED_APPROVED_FOR_DIRECTOR_ONLY': raise SystemExit(f'NEED_NOT_APPROVED:{proposal_id}')
              if receipt.get('proposal_sha256')!=proposal_sha: raise SystemExit(f'NEED_PROPOSAL_SHA_DRIFT:{proposal_id}')
              if receipt.get('grants_code_admission') is not False or receipt.get('grants_lifecycle') is not False: raise SystemExit(f'NEED_AUTHORITY_ESCALATION:{proposal_id}')
              if receipt.get('authority_delta')!=0: raise SystemExit(f'NEED_AUTHORITY_DELTA:{proposal_id}')
              rows=desire.get('requests') or []
              if len(rows)!=1: raise SystemExit(f'NEED_DESIRE_CARDINALITY:{proposal_id}')
              prov=rows[0].get('need_provenance') or {}
              if prov.get('proposal_id')!=proposal_id or prov.get('proposal_sha256')!=proposal_sha: raise SystemExit(f'NEED_PROVENANCE_DRIFT:{proposal_id}')
              if rows[0].get('module_id')!=receipt.get('module_id'): raise SystemExit(f'NEED_MODULE_DRIFT:{proposal_id}')
              if proposal.get('proposal_id')!=proposal_id: raise SystemExit(f'NEED_PROPOSAL_ID_DRIFT:{proposal_id}')
          print('NEXUS_APPROVED_NEED_CHAIN=PASS')
          PY
      - name: Convert bounded desires into ModuleSpecs
        shell: bash
        run: |
          set -euo pipefail
          python tools/demiurge_rex_director.py \
            --desires rex/JANUS_REX_DESIRES.json \
            --policy rex/policy.json \
            --nexus-policy rex/nexus_policy.json \
            --out-dir rex/specs/generated
          shopt -s nullglob
          for DESIRES in rex/desires/approved/*.json; do
            python tools/demiurge_rex_director.py \
              --desires "$DESIRES" \
              --policy rex/policy.json \
              --nexus-policy rex/nexus_policy.json \
              --out-dir rex/specs/generated
          done
      - name: Persist only generated ModuleSpecs
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'janus-rex-director'
          git config user.email 'janus-rex-director@users.noreply.github.com'
          git add -f rex/specs/generated
          git diff --cached --name-only -- 'rex/specs/generated/*.json' > /tmp/rex_changed_specs.txt
          if [ ! -s /tmp/rex_changed_specs.txt ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git commit -m 'Rex Director: materialize bounded ModuleSpecs from desires'
          git pull --rebase origin main
          PUSHED_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "pushed_sha=$PUSHED_SHA" >> "$GITHUB_OUTPUT"
          echo "REX_DIRECTOR_PUSHED_SHA=$PUSHED_SHA"
      - name: Dispatch organogenesis for each newly changed spec
        if: steps.persist.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.persist.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          while IFS= read -r SPEC; do
            case "$SPEC" in rex/specs/generated/*.json) ;; *) echo "REFUSE:$SPEC" >&2; exit 2;; esac
            gh workflow run janus-rex-organogenesis.yml --repo "$GH_REPO" --ref main \
              -f spec_path="$SPEC" \
              -f target_sha="$TARGET_SHA"
            echo "REX_ORGANOGENESIS_DISPATCHED=$SPEC@$TARGET_SHA"
          done < /tmp/rex_changed_specs.txt
