name: JANUS SENTINEL prospective self-calibration (research temperature only)

on:
  pull_request:
    paths:
      - 'tools/sentinel_forward_calibrate.py'
      - 'tests/test_sentinel_forward_calibrate.py'
      - '.github/workflows/sentinel-forward-calibration.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sentinel_forward_calibrate.py'
      - '.github/workflows/sentinel-forward-calibration.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-sentinel-prospective-forward-temperature
  cancel-in-progress: false

jobs:
  prospective-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify strict chronological 64/64 model calibration and immutable cursor
        run: |
          python -m py_compile tools/sentinel_forward_calibrate.py
          python -m unittest -v tests.test_sentinel_forward_calibrate

  future-only-temperature-calibration:
    if: github.event_name != 'pull_request' && vars.SENTINEL_PAUSED != 'true' && vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: sentinel-state
          path: runtime/sentinel/calibration-state
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze immutable model's Git commit timestamp and current forward-only run source
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT=runtime/sentinel/calibration-state
          mkdir -p runtime/sentinel/calibration-ephemeral
          MODEL="$CHECKOUT/sentinel/model/checkpoint.json"
          test -f "$MODEL"
          FROZEN_AT="$(git -C "$CHECKOUT" log -1 --format=%cI -- sentinel/model/checkpoint.json)"
          test -n "$FROZEN_AT"
          echo "$FROZEN_AT" > runtime/sentinel/calibration-ephemeral/model-freeze-utc.txt
          python -m tools.sentinel_forward_calibrate \
            --preflight \
            --checkpoint "$MODEL" \
            --cursor "$CHECKOUT/sentinel/calibration/cursor.json" \
            --freeze-utc "$FROZEN_AT" \
            --source-rows runtime/sentinel/calibration-ephemeral/source-rows.json \
            | tee runtime/sentinel/calibration-ephemeral/preflight.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('runtime/sentinel/calibration-ephemeral/preflight.json').read_text())
          assert p['source_row_count']<=800
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('needs_torch='+str(p['needs_torch']).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### SENTINEL prospective temperature recalibration\n')
            f.write('Eligible NEW post-checkpoint tasks: '+str(p['post_freeze_target_count'])+'/128\n')
            f.write('Frozen GH source SHA256: '+p['source_rows_sha256']+'\n')
            f.write('No past test reuse; A/B share same model; C stays independent of Torch.\n')
          PY
      - name: Install exact fixed Torch CPU only after enough genuine future runs
        if: steps.preflight.outputs.needs_torch == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Score precommitted 64 temperature calibration and 64 unseen forward test runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m tools.sentinel_forward_calibrate \
            --checkpoint runtime/sentinel/calibration-state/sentinel/model/checkpoint.json \
            --cursor runtime/sentinel/calibration-state/sentinel/calibration/cursor.json \
            --freeze-utc "$(cat runtime/sentinel/calibration-ephemeral/model-freeze-utc.txt)" \
            --source-rows runtime/sentinel/calibration-ephemeral/source-rows.json \
            --out-dir runtime/sentinel/calibration-ephemeral/output
      - name: Git CAS append-only evaluation and optional temperature-only research checkpoint update
        env:
          CHECKOUT: runtime/sentinel/calibration-state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import sentinel_forward_calibrate as c
          from tools import sentinel_transformer as m
          src=Path('runtime/sentinel/calibration-ephemeral/output')
          p=src/'result.json'
          result=json.loads(p.read_text('utf-8'))
          assert result['receipt_sha256']==c.receipt({
              k:v for k,v in result.items() if k!='receipt_sha256'
          })['receipt_sha256']
          assert result['production_authority'] is False
          if (src/'cursor.json').exists():
              cursor=c.validate_cursor(json.loads((src/'cursor.json').read_text()))
              assert cursor['evaluation_receipt_sha256']==result['receipt_sha256']
          if (src/'checkpoint.json').exists():
              new=m.check_checkpoint(json.loads((src/'checkpoint.json').read_text()))
              original=m.check_checkpoint(json.loads(Path(
                 'runtime/sentinel/calibration-state/sentinel/model/checkpoint.json'
              ).read_text()))
              assert original['weights']==new['weights']
              assert result['accepted'] is True
              assert new['parent_checkpoint_sha256']==original['checkpoint_sha256']
          print('CHECKED_FUTURE_ONLY_RESEARCH_CALIBRATION',result['status'])
          PY
          if [ -f runtime/sentinel/calibration-ephemeral/output/cursor.json ]; then
            mkdir -p "$CHECKOUT/sentinel/calibration/receipts"
            cp runtime/sentinel/calibration-ephemeral/output/result.json \
              "$CHECKOUT/sentinel/calibration/receipts/${{ github.run_id }}.json"
            cp runtime/sentinel/calibration-ephemeral/output/cursor.json \
              "$CHECKOUT/sentinel/calibration/cursor.json"
            git -C "$CHECKOUT" add -f sentinel/calibration/cursor.json \
              sentinel/calibration/receipts/${{ github.run_id }}.json
            if [ -f runtime/sentinel/calibration-ephemeral/output/checkpoint.json ]; then
              CURRENT_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/sentinel/calibration-state/sentinel/model/checkpoint.json')
          print(json.loads(p.read_text())['checkpoint_sha256'])
          PY
          )"
              mkdir -p "$CHECKOUT/sentinel/model/parents"
              if [ -f "$CHECKOUT/sentinel/model/parents/$CURRENT_SHA.json" ]; then
                cmp "$CHECKOUT/sentinel/model/checkpoint.json" \
                  "$CHECKOUT/sentinel/model/parents/$CURRENT_SHA.json"
              else
                cp "$CHECKOUT/sentinel/model/checkpoint.json" \
                  "$CHECKOUT/sentinel/model/parents/$CURRENT_SHA.json"
              fi
              cp runtime/sentinel/calibration-ephemeral/output/checkpoint.json \
                "$CHECKOUT/sentinel/model/checkpoint.json"
              git -C "$CHECKOUT" add -f sentinel/model/checkpoint.json \
                "sentinel/model/parents/$CURRENT_SHA.json"
            fi
            git -C "$CHECKOUT" config user.name "github-actions[bot]"
            git -C "$CHECKOUT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$CHECKOUT" diff --cached --quiet && {
              echo "::error::Forward evaluation receipt missing from Git CAS"
              exit 1
            }
            git -C "$CHECKOUT" commit -m "SENTINEL: one-pass forward-only 64/64 risk calibration ${{ github.run_id }}"
            # Fail closed on concurrent data-branch modification.
            git -C "$CHECKOUT" push origin HEAD:refs/heads/sentinel-state
          fi
          echo "Forward-only research temperature gate evaluated; no working JANUS model changes." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-forward-calibration-${{ github.run_id }}
          path: |
            runtime/sentinel/calibration-ephemeral/preflight.json
            runtime/sentinel/calibration-ephemeral/output/
          if-no-files-found: warn
          retention-days: 90
