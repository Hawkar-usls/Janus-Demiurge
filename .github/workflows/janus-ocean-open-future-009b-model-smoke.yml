name: JANUS Ocean / 009B Frozen Model Inference Smoke
on:
  push:
    branches: [janus/open-causality-009-noaa-drand-20261109]
    paths: ['.github/workflows/janus-ocean-open-future-009b-model-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  model-only-no-future-beacons:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      IBM_QUANTUM_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original real trained checkpoint artifact SHA and retrieve it read-only
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13663149173" --jq .digest)" = "sha256:45c8b063b08973b06b88ec843e9a5d16976c983a8e35b39ef33e9304201e5515"
          gh run download 42596763409 --repo "$GITHUB_REPOSITORY" --name janus-ocean-wolfram-measurement --dir frozen_source
          test -f frozen_source/training/ocean_measurement_candidate.pt
          test -f frozen_source/training/report.json
      - name: Load frozen JanusTinyTransformer on CPU
        run: |
          set -euo pipefail
          python -c 'import torch' || python -m pip install --disable-pip-version-check --retries 3 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import sys, datetime as dt, json
          sys.path.insert(0,'experiments/ocean_transformer/open_causality_009')
          sys.path.insert(0,'experiments/ocean_transformer')
          import future_009b as f
          import ocean_future_model_prediction as old
          model,sha,report_sha=old.validate_source_checkpoint('frozen_source/training/ocean_measurement_candidate.pt','frozen_source/training/report.json')
          historical_rounds=f.fixed_rounds(dt.date(2026,10,1))
          p=f.predict(model,historical_rounds)
          assert len(p)==128 and all(0<=v<=1 for v in p)
          assert len(historical_rounds)==len(set(historical_rounds))
          print(json.dumps({'status':'FROZEN_JANUS_MODEL_128_INFERENCES_PASS',
                            'historical_rounds_only':True,
                            'checkpoint_sha256':sha,'source_report_sha256':report_sha,
                            'rounds':len(p),'first_model_probability':p[0],
                            'future_drand_results_fetched':False,
                            'no_retrocausality_claim':True},sort_keys=True))
          PY
