name: JANUS Demiurge Scout Swarm 17
# Strict Git Life witness mode: the temporary */5 cadence must produce a real event=schedule.
# This workflow file is intentionally excluded from push.paths while the witness is armed,
# so the arming commit cannot masquerade as the scheduled Scout event.

on:
  push:
    branches: [main]
    paths:
      - '.github/agents/**'
      - 'tools/demiurge_scout_swarm.py'
      - 'tools/demiurge_scout_snapshot_only.py'
      - 'tools/scout_observation_health.py'
      - 'spiral_evolution.py'
      - 'auto_evolution.py'
      - 'architect_ai.py'
      - 'species_engine.py'
      - 'swarm_optimizer.py'
      - 'janus_core/convergence_engine.py'
      - 'janus_genesis/demiurge.py'
      - 'protocol/DEMIURGE_SPIRAL_EVOLUTION-v1.json'
      - 'scout_swarm/SCOUT_SWARM_MANIFEST-v1.json'
      - 'tests/test_spiral_evolution.py'
      - 'tests/test_scout_observation_health.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: janus-demiurge-scout-swarm
  cancel-in-progress: false

permissions:
  contents: write
  copilot-requests: write

jobs:
  model_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      model_status: ${{ steps.probe.outputs.model_status }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version
      - name: Probe model availability once for the whole swarm
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
        shell: bash
        run: |
          set +e
          copilot -p 'Return only this JSON object: {"preflight":"PASS"}' \
            --model auto \
            --output-format=json \
            --no-ask-user \
            --no-color \
            --no-custom-instructions \
            --no-remote \
            --no-remote-export \
            --disable-builtin-mcps \
            --deny-tool=read \
            --deny-tool=write \
            --deny-tool=shell \
            --deny-tool=url \
            --deny-tool=memory \
            > model-preflight.out 2>&1
          RC=$?
          cat model-preflight.out
          if grep -q 'quota_exceeded' model-preflight.out; then
            STATUS='QUOTA_EXHAUSTED'
          elif [ "$RC" -eq 0 ] && grep -q 'PASS' model-preflight.out; then
            STATUS='AVAILABLE'
          else
            STATUS='UNAVAILABLE'
          fi
          echo "model_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "JANUS_SCOUT_MODEL_PREFLIGHT=$STATUS"
          exit 0

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Demiurge control plane
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spiral test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Test spiral evolution contract
        run: python -m unittest discover -s tests -p 'test_spiral_evolution.py'
      - name: Test Scout observation health planes
        run: python -m unittest tests/test_scout_observation_health.py
      - name: Self-test Scout evidence and spiral boundary
        run: python tools/demiurge_scout_swarm.py --self-test
      - name: Self-test snapshot/model health separation
        run: python tools/scout_observation_health.py --self-test
      - name: Self-test shared-preflight snapshot-only fallback
        run: python tools/demiurge_scout_snapshot_only.py --self-test
      - name: Build 17-agent matrix
        id: matrix
        shell: bash
        run: |
          MATRIX=$(python tools/demiurge_scout_swarm.py --matrix)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  scout:
    needs: [plan, model_preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout Demiurge control plane
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node when model synthesis is available
        if: needs.model_preflight.outputs.model_status == 'AVAILABLE'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitHub Copilot CLI when model synthesis is available
        if: needs.model_preflight.outputs.model_status == 'AVAILABLE'
        run: |
          npm install -g @github/copilot
          copilot --version
      - name: Run ${{ matrix.id }} with model synthesis
        if: needs.model_preflight.outputs.model_status == 'AVAILABLE'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
        run: |
          mkdir -p runtime/${{ matrix.id }}
          python tools/demiurge_scout_swarm.py \
            --run-agent '${{ matrix.id }}' \
            --output runtime/${{ matrix.id }}/report.json
      - name: Run ${{ matrix.id }} snapshot-only after shared model preflight block
        if: needs.model_preflight.outputs.model_status != 'AVAILABLE'
        run: |
          mkdir -p runtime/${{ matrix.id }}
          python tools/demiurge_scout_snapshot_only.py \
            --run-agent '${{ matrix.id }}' \
            --output runtime/${{ matrix.id }}/report.json \
            --model-status '${{ needs.model_preflight.outputs.model_status }}'
      - name: Upload Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.id }}
          path: runtime/${{ matrix.id }}/report.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: always()
    needs: [plan, model_preflight, scout]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Demiurge response repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all Scout reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: scout-*
          path: runtime/reports
      - name: Consolidate spiral swarm answer into Janus-Demiurge
        run: |
          python tools/demiurge_scout_swarm.py \
            --consolidate runtime/reports \
            --run-id '${{ github.run_id }}' \
            --sha '${{ github.sha }}'
      - name: Normalize repository-snapshot and model-synthesis health planes
        run: |
          python tools/scout_observation_health.py \
            --run-id '${{ github.run_id }}'
      - name: Persist Demiurge spiral lineage
        shell: bash
        run: |
          git config user.name "janus-demiurge-scout-swarm"
          git config user.email "janus-demiurge-scout-swarm@users.noreply.github.com"
          git add -f scout_swarm/outbox scout_swarm/state
          if git diff --cached --quiet; then
            echo "JANUS_DEMIURGE_SWARM_NO_CHANGES"
            exit 0
          fi
          git commit -m "Scout spiral: persist 17-agent reconnaissance turn ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "JANUS_DEMIURGE_SPIRAL_PERSIST=PASS"
