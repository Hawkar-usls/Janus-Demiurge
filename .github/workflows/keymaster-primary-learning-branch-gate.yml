name: Keymaster Primary Learning Branch Gate

on:
  push:
    branches:
      - feature/keymaster-primary-learning-contributors-v1

permissions:
  contents: read

jobs:
  keymaster-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Keymaster and corpus builder
        run: python -m py_compile janus_model/keymaster.py janus_model/corpus.py janus_model/eval_contract.py
      - name: Run Keymaster adversarial gates
        run: python -m unittest -v tests/test_janus_keymaster.py
      - name: Collect all five live contributors
        run: |
          python -m janus_model.keymaster \
            --config janus_model/keymaster/PRIMARY_REPOSITORY_CONTRIBUTORS-v1.json \
            --out runtime/keymaster | tee runtime/keymaster-live-proof.txt
      - name: Verify live 5-of-5 manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('runtime/keymaster/manifest.json').read_text())
          assert m['status']=='READY_5_OF_5'
          assert m['contributor_count']==5
          assert m['training_only'] is True
          assert m['adaptive_holdout_inclusion'] is False
          assert m['frozen_anchor_inclusion'] is False
          assert m['authority_delta']==0
          assert all(int(x['contributed_bytes'])>0 for x in m['contributors'])
          assert {x['repository'] for x in m['contributors']}=={
            'Hawkar-usls/TOPA','Hawkar-usls/tranception','Hawkar-usls/janus-lapis',
            'Hawkar-usls/janus-io-public','Hawkar-usls/Fast-CAT-SHAiTan'
          }
          print('JANUS_KEYMASTER_PRIMARY_5_OF_5_LIVE=PASS')
          PY
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-primary-learning-live-proof-${{ github.run_id }}
          path: |
            runtime/keymaster/manifest.json
            runtime/keymaster-live-proof.txt
          if-no-files-found: error
          retention-days: 14
