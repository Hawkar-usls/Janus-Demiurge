name: ESSENCE v4.5 Qwen peer shadow descendant

on:
  pull_request:
    paths:
      - 'tools/essence_v45_peer_shadow.py'
      - 'tests/test_essence_v45_peer_shadow.py'
      - 'research/essence/peer_v45/shadow_lock.json'
      - '.github/workflows/essence-v45-peer-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v45_peer_shadow.py'
      - 'tests/test_essence_v45_peer_shadow.py'
      - 'research/essence/peer_v45/shadow_lock.json'
      - '.github/workflows/essence-v45-peer-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify shadow trainer syntax and sealed lock
        run: |
          python -m py_compile tools/essence_v45_peer_shadow.py tests/test_essence_v45_peer_shadow.py
          python -m json.tool research/essence/peer_v45/shadow_lock.json >/dev/null
      - name: Adversarial review, train and Sentinel boundaries
        run: python -m unittest -v tests.test_essence_v45_peer_shadow

  qualification:
    if: github.event_name != 'pull_request'
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public immutable-dialogue branch and separate review labels
        run: |
          git clone --quiet --depth 1 --single-branch --branch janus/open-llm-corpus \
            https://github.com/Hawkar-usls/-Terminal-for-Janus.git runtime/essence/v45/corpus
          git clone --quiet --depth 1 --single-branch --branch main \
            https://github.com/Hawkar-usls/-Terminal-for-Janus.git runtime/essence/v45/terminal-main
          git -C runtime/essence/v45/corpus rev-parse HEAD
          git -C runtime/essence/v45/terminal-main rev-parse HEAD
      - name: Confirm zero unverified examples may modify weights
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/essence_v45_peer_shadow.py \
            --corpus runtime/essence/v45/corpus \
            --labels runtime/essence/v45/terminal-main/config/JANUS_DIALOGUE_REVIEW_LABELS.json \
            --lock research/essence/peer_v45/shadow_lock.json \
            --out runtime/essence/v45/qualification.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('runtime/essence/v45/qualification.json'))
          print('ready='+str(p['training_allowed']).lower())
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open('runtime/essence/v45/qualification.json'))
          print("### ESSENCE v4.5 peer-weight shadow gate")
          print("Source dialogue count:",p["corpus_source_count"])
          print("Independently approved training pairs:",p["reviewed_training_pairs"])
          print("Training admissible:",p["training_allowed"])
          print("Blockers:",", ".join(p["blockers"]))
          print("Native weights, Sentinel, production unchanged.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v45-peer-preflight-${{ github.run_id }}
          path: runtime/essence/v45/qualification.json
          retention-days: 90
          if-no-files-found: error

  shadow-train:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.qualification.outputs.ready == 'true' &&
      vars.ESSENCE_EVOLUTION_PAUSED != 'true'
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Freeze reviewed public dialogue source
        run: |
          git clone --quiet --depth 1 --single-branch --branch janus/open-llm-corpus \
            https://github.com/Hawkar-usls/-Terminal-for-Janus.git runtime/essence/v45/corpus
          git clone --quiet --depth 1 --single-branch --branch main \
            https://github.com/Hawkar-usls/-Terminal-for-Janus.git runtime/essence/v45/terminal-main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Preflight again and train only frozen parent LoRA tensors
        run: |
          python tools/essence_v45_peer_shadow.py \
            --corpus runtime/essence/v45/corpus \
            --labels runtime/essence/v45/terminal-main/config/JANUS_DIALOGUE_REVIEW_LABELS.json \
            --lock research/essence/peer_v45/shadow_lock.json \
            --out runtime/essence/v45/qualification.json \
            --train-dir runtime/essence/v45/shadow
          test -f runtime/essence/v45/shadow/JANUS_SHADOW_LINEAGE.json
          test -f runtime/essence/v45/shadow/adapter_model.safetensors
      - uses: actions/upload-artifact@v4
        with:
          name: essence-v45-research-only-lora-${{ github.run_id }}
          path: runtime/essence/v45/shadow/
          retention-days: 90
          if-no-files-found: error
